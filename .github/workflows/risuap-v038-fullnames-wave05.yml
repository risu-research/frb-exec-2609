name: RISUAP v038 NY name history wave05 date-locked
on:
  push:
    branches:
      - ops/public-input-availability-261116
    paths:
      - .github/workflows/risuap-v038-fullnames-wave05.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: name_20010401_20011115
            start: "2001-04-01"
            end: "2001-11-15"
            expected: 73369
          - label: name_20011115_20020702
            start: "2001-11-15"
            end: "2002-07-02"
            expected: 83590
          - label: name_20020702_20030215
            start: "2002-07-02"
            end: "2003-02-15"
            expected: 82207
          - label: name_20030215_20031002
            start: "2003-02-15"
            end: "2003-10-02"
            expected: 88024
          - label: name_20031002_20040517
            start: "2003-10-02"
            end: "2004-05-17"
            expected: 92372
          - label: name_20040517_20050101
            start: "2004-05-17"
            end: "2005-01-01"
            expected: 89483
          - label: name_20050101_20050817
            start: "2005-01-01"
            end: "2005-08-17"
            expected: 99866
          - label: name_20050817_20060402
            start: "2005-08-17"
            end: "2006-04-02"
            expected: 97396
          - label: name_20060402_20061116
            start: "2006-04-02"
            end: "2006-11-16"
            expected: 94806
          - label: name_20061116_20070310
            start: "2006-11-16"
            end: "2007-03-10"
            expected: 49098
          - label: name_20070310_20070703
            start: "2007-03-10"
            end: "2007-07-03"
            expected: 51463
          - label: name_20070703_20080216
            start: "2007-07-03"
            end: "2008-02-16"
            expected: 93845
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private-recipient authenticated source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/risuap-v038
          /tmp/risuap-v038/bin/pip install --quiet cryptography==44.0.3
          openssl pkey -pubin -in probe/v032-recipient.pem -noout
      - name: Retrieve complete pinned official date range and independently check edition
        shell: bash
        run: |
          set -euo pipefail
          /tmp/risuap-v038/bin/python probe/risuap_v038_name_full_ingest.py \
            --label "${{ matrix.label }}" --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --expected "${{ matrix.expected }}" --rows-epoch 1794948547 --metadata-epoch 1794945028 \
            --max-rows 100000 --limit 10000 --out source_data
          cp source_data/manifest.json source-receipt.json
      - name: Encrypt archive for owner only and remove runner plaintext
        shell: bash
        run: |
          set -euo pipefail
          /tmp/risuap-v038/bin/python probe/seal_private_v031.py \
            --source source_data --recipient probe/v032-recipient.pem --out sealed-source.json
          rm -rf source_data
          python3 probe/v032_cipher_chunks.py --sealed sealed-source.json --label "${{ matrix.label }}" --out chunks
          rm sealed-source.json
      - name: Upload only source count/vintage and encryption receipts
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-receipts
          path: |
            source-receipt.json
            chunks/transport-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload ciphertext part00
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-part00
          path: chunks/sealed.part00
          retention-days: 7
          if-no-files-found: error
      - name: Upload ciphertext part01 if present
        if: ${{ hashFiles('chunks/sealed.part01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-part01
          path: chunks/sealed.part01
          retention-days: 7
