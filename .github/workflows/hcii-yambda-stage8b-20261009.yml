name: HCII Yambda Stage8B signed-feedback audit
on:
  push:
    branches:
      - run/hcii-yambda-matched-20261009
    paths:
      - hcii_yambda/stage8b_signed_feedback.py
      - .github/workflows/hcii-yambda-stage8b-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb==1.4.0 requests==2.32.3
      - name: Run signed-feedback and clustered uncertainty audit
        run: python hcii_yambda/stage8b_signed_feedback.py
      - name: Save aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcii-yambda-stage8b-signed-audit
          path: hcii_yambda/results_stage8b/
          retention-days: 10
