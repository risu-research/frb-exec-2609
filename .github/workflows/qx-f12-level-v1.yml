name: qx S6 F12 level v1

on:
  workflow_call:
    inputs:
      N:
        required: true
        type: number
      previous_state_json:
        required: true
        type: string
    secrets:
      SOURCE_READ_TOKEN:
        required: true
    outputs:
      state_json:
        description: Exact F1/F2 frontier state after this N barrier
        value: ${{ jobs.barrier.outputs.state_json }}

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: b5d40b10e5741b493edcfceb2d5c98e43de6d56d

jobs:
  shards:
    name: F12 N${{ inputs.N }} ${{ matrix.replica }} seed${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [A, B]
        seed: [2026090801, 2026090802, 2026090803, 2026090804, 2026090805]
    env:
      PREVIOUS_STATE_JSON: ${{ inputs.previous_state_json }}
      S6_N: ${{ inputs.N }}
      S6_REPLICA: ${{ matrix.replica }}
      S6_SEED: ${{ matrix.seed }}
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact frozen private source
        shell: bash
        run: |
          set -euo pipefail
          python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Execute one exact frozen F1/F2 seed-replica shard
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/s6-f12
          out="/tmp/s6-f12/f12-N${S6_N}-${S6_REPLICA}-${S6_SEED}.json"
          (cd _src && python -m replaymark_verification.s6_campaign_f12_shard_v1 shard \
            --N "$S6_N" \
            --seed "$S6_SEED" \
            --replica "$S6_REPLICA" \
            --previous-state-json "$PREVIOUS_STATE_JSON" \
            --out "$out")
          rc=$?
          set -e
          if [ ! -s "$out" ]; then
            python - "$out" "$rc" <<'PY'
          import json, os, sys
          out, rc = sys.argv[1], int(sys.argv[2])
          N = int(os.environ['S6_N']); seed = int(os.environ['S6_SEED']); replica = os.environ['S6_REPLICA']
          previous = json.loads(os.environ['PREVIOUS_STATE_JSON'])
          points=[]
          for family, K in [('F1',16),('F2',N//2)]:
              for plane in ('full','q'):
                  points.append({'spec':{'family':family,'N':N,'K':K,'H':3,'B':4,'seed':seed},'plane':plane,'status':'ORCHESTRATION_ERROR','trials':[],'stage_decomposition':None,'orchestration_returncode':rc})
          record={'schema':'replaymark.s6.x86-first-complete-control.v2.f12-wave.v1','N':N,'seed':seed,'replica':replica,'previous_frontier_state':previous,'points':points,'orchestration_failure':True,'returncode':rc}
          with open(out,'w',encoding='utf-8') as f: json.dump(record,f,indent=2,sort_keys=True); f.write('\n')
          PY
          fi
          python -m json.tool "$out" >/dev/null
      - name: Upload immutable shard record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-f12-N${{ inputs.N }}-${{ matrix.replica }}-${{ matrix.seed }}
          path: /tmp/s6-f12
          if-no-files-found: error

  barrier:
    name: F12 N${{ inputs.N }} cross-replica barrier
    if: always()
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      state_json: ${{ steps.state.outputs.state_json }}
    env:
      PREVIOUS_STATE_JSON: ${{ inputs.previous_state_json }}
      S6_N: ${{ inputs.N }}
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact frozen private source
        shell: bash
        run: |
          set -euo pipefail
          python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Download every available shard for this N
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: s6-f12-N${{ inputs.N }}-*
          path: /tmp/s6-f12-input
          merge-multiple: true
      - name: Apply frozen barrier without infrastructure-to-resource promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-f12-input /tmp/s6-f12-barrier
          (cd _src && python -m replaymark_verification.s6_campaign_f12_shard_v1 barrier \
            --N "$S6_N" \
            --previous-state-json "$PREVIOUS_STATE_JSON" \
            --input-dir /tmp/s6-f12-input \
            --out "/tmp/s6-f12-barrier/f12-barrier-N${S6_N}.json")
          python -m json.tool "/tmp/s6-f12-barrier/f12-barrier-N${S6_N}.json" >/dev/null
      - name: Export exact next state
        id: state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=f"/tmp/s6-f12-barrier/f12-barrier-N{os.environ['S6_N']}.json"
          value=json.load(open(p,encoding='utf-8'))
          print('state_json='+json.dumps(value,sort_keys=True,separators=(',',':')))
          PY
      - name: Upload barrier record
        uses: actions/upload-artifact@v4
        with:
          name: s6-f12-barrier-N${{ inputs.N }}
          path: /tmp/s6-f12-barrier
          if-no-files-found: error
