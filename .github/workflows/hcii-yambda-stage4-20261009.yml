name: HCII Yambda explicit feedback robustness
on:
  push:
    branches:
      - run/hcii-yambda-matched-20261009
    paths:
      - hcii_yambda/stage4_robustness.py
      - .github/workflows/hcii-yambda-stage4-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install requests==2.32.3 duckdb==1.4.0
      - name: Execute one rigor audit
        run: python hcii_yambda/stage4_robustness.py
      - name: Archive aggregate results without user records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcii-yambda-robustness-aggregate
          path: hcii_yambda/results_stage4/
          retention-days: 10
