name: Stigler 2027 R02 multi-state source evidence audit
on:
  push:
    branches:
      - experiment/stigler-chatbot-r02-multistate-20261123
    paths:
      - research/stigler_r02/**
      - .github/workflows/stigler-r02-multistate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_public_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic document parsers
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'pypdf>=5,<7'
      - name: Collect and hash official multistate primary records
        run: python -u research/stigler_r02/run_sources.py
      - name: Preserve structured evidence index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stigler-chatbot-r02-multistate-official-sources
          path: research/stigler_r02/results/
          if-no-files-found: warn
          retention-days: 14
