name: Preserve normalized tariff provenance R48
on:
  push:
    branches: [experiment/continuation-cache-audit-20261123]
    paths: ['.github/workflows/tariff-provenance-r48.yml']
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: endpoint-tariff-census
          path: capture
          run-id: 45318045292
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub==0.36.0' 'pyarrow==21.0.0' 'numpy==2.2.6'
      - name: Recover audited tariff rows and raw file hashes
        run: |
          cat > expected.json <<'JSON'
          {"2026-05-17_2026-05-23":{"sha256":"6772d28dee9df407dac2064cf5758a481baf1b8576600965a8cbf47266844d90","requests":10738},"2026-05-24_2026-05-30":{"sha256":"a045b793e1de0aed6e877f59e1699b6b496a55b9a522465eacfb9b8d7ad6e4d7","requests":12827},"2026-05-31_2026-06-06":{"sha256":"bfb76d58fc23d5afe92bdb3f9503cf0c19cb983586744706f47b5f94bd0f2d69","requests":7324},"2026-06-07_2026-06-13":{"sha256":"81c8642eed8141a6911d9321be96454d1620acf4d4e36faa50a80c8c59ca80c5","requests":6859},"2026-06-14_2026-06-20":{"sha256":"1e3ee32ffe76fce288ea4b71c79fd6af34c97c7dc9bef3050269276ae370576f","requests":35659},"2026-06-21_2026-06-27":{"sha256":"82e639ac17c4560e05c5f4cbc4b24cad9fb8f006c5f8b8a79fff1f8fcf27d4a8","requests":56310},"2026-06-28_2026-07-04":{"sha256":"d146b14e3353a675b0c9427ee013df5fd022370ce57649df29ee2e8c7bb72efc","requests":50615},"2026-07-05_2026-07-11":{"sha256":"502b4635f3d9b87b42523c181c0dcef4e91f918b8c104cc628e79bd42affaa20","requests":68302},"2026-07-12_2026-07-18":{"sha256":"b479e68289f78cc184c650996d0d7cbc07fa5169a5ccc6a6dc8939d2e536b024","requests":72025},"2026-07-19_2026-07-25":{"sha256":"764616d813311357fd19cc99ecd2e167fcbf14132f9fa8fbfcb1fc19595ccef9","requests":78804},"2026-07-26_2026-08-01":{"sha256":"16466f33e7fec987a621a1374baf272d7d9943fd5062ab2cb7ee2ad113a29eaf","requests":84524},"2026-08-02_2026-08-08":{"sha256":"f1cdcf63fb579b2c51de3a56025cb3a03d06bc1e45e82a0a79cb53d4c5ac7820","requests":79546},"2026-08-09_2026-08-15":{"sha256":"cb11c50b6dc9f35d8cff5385768a77c8618c3aff03113f28e7ac8c17a5ffbae7","requests":163970},"2026-08-16_2026-08-22":{"sha256":"b707132fd02d13cd9ac3570990eea566933344d308990e6669ae4f686ddc9856","requests":144227},"2026-08-23_2026-08-29":{"sha256":"27bd0ad8367a4176d5bff29e88820ccc0cda814f882a3c05ecc99da08931d23f","requests":159925},"2026-08-30_2026-09-05":{"sha256":"e8f4f987f00442348ac09b1d6dc8865cf3dde299944423d54402f620244d3a6a","requests":190544}}
          JSON
          cat > audit.py <<'PY'
          import pathlib,json,hashlib,collections as C,statistics as S,tempfile
          from decimal import Decimal as D
          import numpy as np
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi,hf_hub_download
          def d(x):
              try:
                  if x is None or isinstance(x,bool):return None
                  a=D(str(x));return a if a.is_finite() and a>=0 else None
              except Exception:return None
          def nonzero(v):
              return v is not None and d(v)!=D(0)
          def positive(v):return isinstance(v,int) and not isinstance(v,bool) and v>0
          def norm(e):
              p=e.get("pricing") or {}; a,b,c=(d(p.get(k)) for k in ("prompt","completion","input_cache_read"))
              if not e.get("provider_name") or a is None or a<=0 or b is None:return None,"price"
              if c is None:return None,"unknown_cache"
              if c>a:return None,"cache_above_prompt"
              if p.get("overrides") or e.get("pricing_overrides") or e.get("pricing_tiers"):return None,"overrides"
              if nonzero(p.get("discount")) or nonzero(e.get("discount")):return None,"discount"
              if any(nonzero(p.get(k)) for k in ("input_cache_write","input_cache_write_1h")):return None,"cache_write"
              if any(nonzero(p.get(k)) for k in ("request","internal_reasoning")):return None,"other_charge"
              if e.get("status")!=0:return None,"status"
              tag=str(e.get("tag") or e.get("name") or "")
              if any(x in tag.lower() for x in (":free",":batch","/free","/batch")):return None,"variant"
              q=e.get("quantization");q=q.lower() if isinstance(q,str) else ""
              return (e["provider_name"],a,b,c,e.get("context_length"),e.get("max_prompt_tokens"),e.get("max_completion_tokens"),q,tuple(sorted(e.get("supported_parameters") or [])),tag),None
          
          P=pathlib.Path("capture");O=pathlib.Path("r48-results");O.mkdir(exist_ok=True)
          m=json.loads((P/"manifest.json").read_text())
          assert hashlib.sha256((P/"models.json").read_bytes()).hexdigest()==m["catalog"]["sha256"]
          models={};labels=C.defaultdict(set)
          for r in m["models"]:
              if r["error"] or ":" in r["model"]:continue
              raw=(P/"raw"/r["meta"]["file"]).read_bytes();assert hashlib.sha256(raw).hexdigest()==r["meta"]["sha256"]
              obj=json.loads(raw)["data"];assert obj["id"]==r["model"]
              rs=[]
              for e in obj["endpoints"]:
                  a,why=norm(e)
                  if a is not None:rs.append(a)
              unique={}
              for a in rs:unique.setdefault(a[:9],a)
              mid=r["model"];models[mid]=list(unique.values())
              labels[mid.casefold()].add(mid);labels[mid.split("/",1)[-1].casefold()].add(mid)
          (O/"normalized-tariffs.json").write_text(json.dumps({"manifest_catalog_sha256":m["catalog"]["sha256"],"models":models},default=str,indent=2))
          print("CATALOG_HASH",m["catalog"]["sha256"],flush=True)
          for r in m["models"]:
              print("MANIFEST_ROW",json.dumps(r,separators=(",",":")),flush=True)
          for k,v in sorted(models.items()):
              if v:print("NORMALIZED_ROW",json.dumps(dict(model=k,rows=v),default=str,separators=(",",":")),flush=True)
          
          PY
          python audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tariff-provenance-r48
          path: r48-results/
          retention-days: 14
