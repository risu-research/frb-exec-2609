name: VE2 E0R pre-science execution qualification v1

on:
  push:
    branches:
      - ve2-e0r-v1

permissions:
  contents: read

env:
  E0Q_PARENT: d9a1a55e8bb83a8fc89e67ee71918f32d2249a43
  PRIVATE_CONSTITUTION: f0cca6726b634a35c523b0caab89694bd7fb18e5
  ORIGIN_REPOSITORY: risu-research/appeal-discovery-consumer
  ORIGIN_COMMIT: c290786d92e7546345b348916b3b3d1c11780e4c
  HA_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293
  HA_TRIGGER_HELPER_BLOB: 9451757998c63efcf8c7a01249f730594b3f68dd
  E0Q_BOUNDARY_BLOB: 765680028bde49ead76a22bebe5aace1bfbea60e
  CONTRACT_BLOB: fe8290c102198c7cedf331654216a2280971846f
  TARGET_SPEC_BLOB: 464882347fc2f95ceb479a0a58ba2cee05c4d48a
  BUILDER_BLOB: bc04cf3a6a908a38daa36b3d95a75d4cd826d11a
  CONTRACT_VERIFIER_BLOB: 3db00230a2f5049c26f7204eedefd784694f6116
  E0R_SEMANTIC_BLOB: 52d3b6e5ab3816266424ca61feef7cbb7f431d51
  E0R_RUNTIME_BLOB: 740800a13b541423b0bce4702faff31e85ac90b2
  E0R_INDEPENDENT_BLOB: 37e3c3983ae84f7f9800fd61f95276d09154c8a5
  T01_MANIFEST_BLOB: c1731d24387ec4c2dcb33167a286d89fc45ef254
  T02_MANIFEST_BLOB: c9d543be934dd0cc33b67a2f987f0eae9705a83b

jobs:
  e0r:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact public E0R authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Require exact first-complete OPEN and additive source freeze
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -f VE2_E0R_AUTHORITY_OPEN_V1.json
          source_freeze="$(git rev-parse HEAD^)"
          test "$(git rev-parse "$source_freeze^")" = "$E0Q_PARENT"

          mapfile -t open_changed < <(git diff --name-only "$source_freeze..HEAD")
          test "${#open_changed[@]}" = "1"
          test "${open_changed[0]}" = "VE2_E0R_AUTHORITY_OPEN_V1.json"

          mapfile -t source_changed < <(git diff --name-only "$E0Q_PARENT..$source_freeze")
          expected=(
            ".github/workflows/ve2-e0r-v1.yml"
            "VE2_E0R_PUBLIC_EXECUTION_CONTRACT_V1.json"
            "VE2_TARGET_ONLY_CONTRACT_SPEC_V1.json"
            "ve2_e0r_independent_validate_v1.py"
            "ve2_e0r_runtime_v1.py"
            "ve2_e0r_semantic_boundary_v1.py"
            "ve2_target_only_contract_v1.py"
            "verify_ve2_target_only_contract_v1.py"
          )
          test "${#source_changed[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${source_changed[$i]}" = "${expected[$i]}"; done

          test "$(git hash-object --no-filters VE2_E0R_PUBLIC_EXECUTION_CONTRACT_V1.json)" = "$CONTRACT_BLOB"
          test "$(git hash-object --no-filters VE2_TARGET_ONLY_CONTRACT_SPEC_V1.json)" = "$TARGET_SPEC_BLOB"
          test "$(git hash-object --no-filters ve2_target_only_contract_v1.py)" = "$BUILDER_BLOB"
          test "$(git hash-object --no-filters verify_ve2_target_only_contract_v1.py)" = "$CONTRACT_VERIFIER_BLOB"
          test "$(git hash-object --no-filters ve2_e0r_semantic_boundary_v1.py)" = "$E0R_SEMANTIC_BLOB"
          test "$(git hash-object --no-filters ve2_e0r_runtime_v1.py)" = "$E0R_RUNTIME_BLOB"
          test "$(git hash-object --no-filters ve2_e0r_independent_validate_v1.py)" = "$E0R_INDEPENDENT_BLOB"
          test "$(git hash-object --no-filters VE2_T01_EXECUTION_STATE_MANIFEST_V1.json)" = "$T01_MANIFEST_BLOB"
          test "$(git hash-object --no-filters VE2_T02_EXECUTION_STATE_MANIFEST_V1.json)" = "$T02_MANIFEST_BLOB"
          test "$(git hash-object --no-filters ve2_boundary_microkernel_v2.py)" = "$E0Q_BOUNDARY_BLOB"

          python - "$source_freeze" <<'PY'
          import json,sys
          c=json.load(open("VE2_E0R_PUBLIC_EXECUTION_CONTRACT_V1.json"))
          assert c["schema"]=="replaymark.ve2.e0r-public-execution-contract.v1"
          assert c["status"]=="FROZEN_PRE_SCIENCE"
          assert c["parent_public_e0q_pass_seal"]=="d9a1a55e8bb83a8fc89e67ee71918f32d2249a43"
          assert c["private_science_constitution"]["commit"]=="f0cca6726b634a35c523b0caab89694bd7fb18e5"
          assert c["forbidden"]["expected_frontier_use_by_builder_or_runtime"] is True
          o=json.load(open("VE2_E0R_AUTHORITY_OPEN_V1.json"))
          assert o == {
            "schema":"replaymark.ve2.e0r-public-authority-open.v1",
            "authority":"PRE_SCIENCE_EXECUTION_SUBSTRATE_FIRST_COMPLETE",
            "source_freeze_public_head":sys.argv[1],
            "private_science_constitution":"f0cca6726b634a35c523b0caab89694bd7fb18e5",
            "scientific_result_opened":False,
            "frontier_result_seen":False,
            "ve2_home_assistant_scientific_cells":0,
            "ve2_replaymark_scientific_cells":0,
            "same_authority_rerun":False,
          }
          PY
          echo "source_freeze=$source_freeze" >> "$GITHUB_OUTPUT"

      - name: Materialize exact ReplayMark compiler allowlist capsule
        shell: bash
        run: |
          set -euo pipefail
          rm -rf origin compiler_capsule results
          git init -q origin
          git -C origin remote add upstream "https://github.com/${ORIGIN_REPOSITORY}.git"
          git -C origin fetch --depth=1 upstream "$ORIGIN_COMMIT"
          git -C origin checkout -q --detach FETCH_HEAD
          test "$(git -C origin rev-parse HEAD)" = "$ORIGIN_COMMIT"

          mkdir -p compiler_capsule/replaymark results/contracts results/runtime
          declare -A core=(
            [replaymark/__init__.py]=01d266fbd970920cf55008d0fa97af8af9e689e9
            [replaymark/adjudicator.py]=32ba03a9a987b16355c166cf56efbf1f6f3b8542
            [replaymark/compiled_contract.py]=9780550de9c9447ca4e488ff5797e08fdd548405
            [replaymark/contracts.py]=a8805eed01328061337290f0d5f2006bd2a7f1c4
            [replaymark/evidence_image.py]=c5a589aba97ba57de9e82a69f812e4abeff1b42e
            [replaymark/evidence_semantics.py]=83106c59bcdab433d88be78be58e3330ab7aaa6c
            [replaymark/predictive_witness.py]=6115ab4f2e4f21e1abda2f4f0d37a3e4ff09d9a3
            [replaymark/q_compiler.py]=f74e765ef1872b54743b31ebf11a113f32d9840e
            [replaymark/rstar.py]=73e0a94f1be76272075d7f1050439ef6b321017e
            [replaymark/support_envelope.py]=6a527573d130bde5649bcf891fc080f16e38cb0d
            [replaymark/target_provenance.py]=e819cee216aa59ea40b1f4e66e3fb0f59b726fc7
          )
          for path in "${!core[@]}"; do
            test "$(git -C origin hash-object --no-filters "$path")" = "${core[$path]}"
            mkdir -p "compiler_capsule/$(dirname "$path")"
            cp "origin/$path" "compiler_capsule/$path"
            test "$(git hash-object --no-filters "compiler_capsule/$path")" = "${core[$path]}"
          done
          cp VE2_TARGET_ONLY_CONTRACT_SPEC_V1.json compiler_capsule/replaymark/
          cp VE2_T01_EXECUTION_STATE_MANIFEST_V1.json compiler_capsule/replaymark/
          cp VE2_T02_EXECUTION_STATE_MANIFEST_V1.json compiler_capsule/replaymark/
          cp ve2_target_only_contract_v1.py compiler_capsule/replaymark/
          cp verify_ve2_target_only_contract_v1.py compiler_capsule/replaymark/

          test ! -e compiler_capsule/replaymark/VE2_T01_EXPECTED_FRONTIER_V1.json
          test ! -e compiler_capsule/replaymark/VE2_T02_EXPECTED_FRONTIER_V1.json
          test ! -e compiler_capsule/replaymark/VE2_T01_NATIVE_SEMANTICS_V1.json
          test ! -e compiler_capsule/replaymark/VE2_T02_NATIVE_SEMANTICS_V1.json
          test "$(git hash-object --no-filters compiler_capsule/replaymark/VE2_TARGET_ONLY_CONTRACT_SPEC_V1.json)" = "$TARGET_SPEC_BLOB"
          test "$(git hash-object --no-filters compiler_capsule/replaymark/ve2_target_only_contract_v1.py)" = "$BUILDER_BLOB"
          test "$(git hash-object --no-filters compiler_capsule/replaymark/verify_ve2_target_only_contract_v1.py)" = "$CONTRACT_VERIFIER_BLOB"
          find compiler_capsule -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > results/COMPILER_CAPSULE_SHA256.txt

      - name: Compile target-only contracts with exact ReplayMark core
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/compiler_capsule" python compiler_capsule/replaymark/ve2_target_only_contract_v1.py \
            --out-dir results/contracts/generated \
            > results/contracts/BUILDER_STDOUT.txt 2> results/contracts/BUILDER_STDERR.txt
          PYTHONPATH="$PWD/compiler_capsule" python compiler_capsule/replaymark/verify_ve2_target_only_contract_v1.py \
            --generated results/contracts/generated \
            --out results/contracts/generated/VE2_TARGET_ONLY_CONTRACT_INDEPENDENT_VALIDATION_V1.json \
            > results/contracts/INDEPENDENT_STDOUT.txt 2> results/contracts/INDEPENDENT_STDERR.txt
          python - <<'PY'
          import json
          a=json.load(open("results/contracts/generated/VE2_TARGET_ONLY_CONTRACT_FREEZE_RECEIPT_V1.json"))
          b=json.load(open("results/contracts/generated/VE2_TARGET_ONLY_CONTRACT_INDEPENDENT_VALIDATION_V1.json"))
          assert a["status"]=="PASS_PRE_SCIENCE"
          assert a["contracts"]["T01"]["states"]==2
          assert a["contracts"]["T02"]["states"]==42
          assert a["inputs"]["expected_frontier_files_read"] is False
          assert b["status"]=="PASS" and b["scientific_cells"]==0
          PY

      - name: Pull and verify exact Home Assistant image/source seam
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$HA_IMAGE"
          docker image inspect "$HA_IMAGE" > results/runtime/HOME_ASSISTANT_IMAGE_INSPECT.json
          observed="$(docker run --rm --network none --entrypoint python3 "$HA_IMAGE" -c 'from pathlib import Path; import hashlib,homeassistant.helpers.trigger as t; b=Path(t.__file__).read_bytes(); print(hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest())')"
          test "$observed" = "$HA_TRIGGER_HELPER_BLOB"
          printf '%s\n' "$observed" > results/runtime/HOME_ASSISTANT_TRIGGER_HELPER_GIT_BLOB.txt

      - name: Execute orthogonal native invocation and Historical Behavior qualification
        shell: bash
        run: |
          set -euo pipefail
          chmod 0777 results/runtime
          docker run --rm --network none \
            -v "$PWD/ve2_boundary_microkernel_v2.py:/work/ve2_boundary_microkernel_v2.py:ro" \
            -v "$PWD/ve2_e0r_semantic_boundary_v1.py:/work/ve2_e0r_semantic_boundary_v1.py:ro" \
            -v "$PWD/ve2_e0r_runtime_v1.py:/work/ve2_e0r_runtime_v1.py:ro" \
            -v "$PWD/results/runtime:/results" \
            --entrypoint python3 "$HA_IMAGE" \
            /work/ve2_e0r_runtime_v1.py --out /results/VE2_E0R_RUNTIME_RESULT_V1.json \
            > results/runtime/RUNTIME_STDOUT.txt 2> results/runtime/RUNTIME_STDERR.txt
          python - <<'PY'
          import json
          r=json.load(open("results/runtime/VE2_E0R_RUNTIME_RESULT_V1.json"))
          assert r["status"]=="PASS"
          assert r["qualified_families"]==["STATE","TIME","HOMEASSISTANT_START","SERVICE","CERTIFIED_NO_ACTION"]
          assert r["scientific_result_opened"] is False
          assert r["ve2_home_assistant_scientific_cells"]==0
          assert r["ve2_replaymark_scientific_cells"]==0
          PY

      - name: Independent post-execution validation
        shell: bash
        run: |
          set -euo pipefail
          python ve2_e0r_independent_validate_v1.py \
            --runtime results/runtime/VE2_E0R_RUNTIME_RESULT_V1.json \
            --contracts results/contracts/generated \
            --out results/VE2_E0R_INDEPENDENT_VALIDATION_V1.json \
            > results/INDEPENDENT_VALIDATOR_STDOUT.txt 2> results/INDEPENDENT_VALIDATOR_STDERR.txt
          python - <<'PY'
          import json
          r=json.load(open("results/VE2_E0R_INDEPENDENT_VALIDATION_V1.json"))
          assert r["status"]=="PASS"
          assert r["scientific_result_opened"] is False
          assert r["scientific_cells"]==0
          PY

      - name: Seal complete E0R artifact
        shell: bash
        env:
          SOURCE_FREEZE: ${{ steps.gate.outputs.source_freeze }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.load(open("results/contracts/generated/VE2_TARGET_ONLY_CONTRACT_FREEZE_RECEIPT_V1.json"))
          v=json.load(open("results/VE2_E0R_INDEPENDENT_VALIDATION_V1.json"))
          Path("results/VE2_E0R_PUBLIC_PROVENANCE_V1.json").write_text(json.dumps({
            "schema":"replaymark.ve2.e0r-public-provenance.v1",
            "status":"PASS_PRE_SCIENCE",
            "repository":os.environ["GITHUB_REPOSITORY"],
            "execution_head":os.environ["GITHUB_SHA"],
            "source_freeze_public_head":os.environ["SOURCE_FREEZE"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "origin_repository":os.environ["ORIGIN_REPOSITORY"],
            "origin_commit":os.environ["ORIGIN_COMMIT"],
            "home_assistant_image":os.environ["HA_IMAGE"],
            "promoted_e0q_boundary_blob":os.environ["E0Q_BOUNDARY_BLOB"],
            "target_only_contract_fingerprints":{"T01":a["contracts"]["T01"]["contract_fingerprint"],"T02":a["contracts"]["T02"]["contract_fingerprint"]},
            "independent_validation_status":v["status"],
            "expected_frontier_available_to_builder_capsule":False,
            "transition_blueprint_executed":False,
            "scientific_fixture_executed":False,
            "historical_better_thermostat_action_dispatched":False,
            "scientific_result_opened":False,
            "frontier_result_seen":False,
            "ve2_home_assistant_scientific_cells":0,
            "ve2_replaymark_scientific_cells":0,
            "same_authority_rerun":False
          },sort_keys=True,indent=2)+"\n")
          PY
          (
            cd results
            find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
            sha256sum -c CHECKSUMS.sha256
          )

      - name: Upload immutable E0R first-complete artifact
        uses: actions/upload-artifact@v4
        with:
          name: ve2-e0r-first-complete-v1
          path: results/
          if-no-files-found: error
          retention-days: 90

      - name: Final E0R PASS gate
        shell: bash
        run: |
          set -euo pipefail
          (cd results && sha256sum -c CHECKSUMS.sha256)
          python - <<'PY'
          import json
          p=json.load(open("results/VE2_E0R_PUBLIC_PROVENANCE_V1.json"))
          v=json.load(open("results/VE2_E0R_INDEPENDENT_VALIDATION_V1.json"))
          assert p["status"]=="PASS_PRE_SCIENCE"
          assert v["status"]=="PASS"
          assert p["scientific_result_opened"] is False
          assert p["ve2_home_assistant_scientific_cells"]==0
          assert p["ve2_replaymark_scientific_cells"]==0
          PY
          echo "VE2 E0R: PASS; target-only contracts + native invocation + Historical Behavior qualified; SCIENTIFIC CELLS=0"
