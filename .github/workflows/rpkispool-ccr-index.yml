name: rpkispool-ccr-index
on:
  workflow_dispatch:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpkispool_ccr_index.sh
      - .github/workflows/rpkispool-ccr-index.yml
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Index all Sep4 CCR snapshots
        run: bash rpkispool_ccr_index.sh
      - name: Commit CCR index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin rpki-pilot-20261002 || true
          git add results/rpkispool_ccr_index_20261002
          git commit -m "add Sep4 RPKISPOOL CCR index [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpkispool-ccr-index-20261002
          path: results/rpkispool_ccr_index_20261002
