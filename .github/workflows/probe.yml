name: exec-probe
on:
  push:
    branches:
      - exec/j-75c7a8ef2d82
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: metadata-only probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          key = os.environ.get("OPENAI_API_KEY", "")
          candidates = ["gpt-6-astra", "gpt-5.6-sol"]
          report = {
              "schema": "exec.metadata-probe.v1",
              "generation_calls": 0,
              "candidate_order": candidates,
              "selected_model": None,
              "status": None,
              "probes": [],
          }

          if not key:
              report["status"] = "CREDENTIAL_MISSING"
              print(json.dumps(report, sort_keys=True))
              sys.exit(0)

          for model in candidates:
              req = urllib.request.Request(
                  "https://api.openai.com/v1/models/" + model,
                  method="GET",
                  headers={"Authorization": "Bearer " + key, "User-Agent": "neutral-metadata-probe/1"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = json.loads(r.read().decode("utf-8"))
                      report["probes"].append({
                          "candidate": model,
                          "http": int(r.status),
                          "id": body.get("id"),
                          "object": body.get("object"),
                          "owned_by": body.get("owned_by"),
                          "created": body.get("created"),
                      })
                      if int(r.status) == 200 and body.get("id") == model:
                          report["selected_model"] = model
                          report["status"] = "LOCKABLE_METADATA_ONLY"
                          break
                      report["status"] = "ABORT_UNEXPECTED_METADATA"
                      break
              except urllib.error.HTTPError as e:
                  code = int(e.code)
                  report["probes"].append({"candidate": model, "http": code})
                  if code in (403, 404):
                      continue
                  if code == 401:
                      report["status"] = "ABORT_CREDENTIAL"
                  elif code == 429 or 500 <= code <= 599:
                      report["status"] = "ABORT_TRANSIENT"
                  else:
                      report["status"] = "ABORT_HTTP"
                  break
              except Exception as e:
                  report["probes"].append({"candidate": model, "transport_error": type(e).__name__})
                  report["status"] = "ABORT_TRANSIENT"
                  break
          else:
              report["status"] = "NO_CANDIDATE_ACCESS"

          print(json.dumps(report, sort_keys=True))
          if report["status"].startswith("ABORT_"):
              sys.exit(2)
          PY
