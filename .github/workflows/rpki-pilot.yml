name: RPKI handoff pilot

on:
  push:
    branches: [rpki-pilot-20261002]
    paths:
      - rpkispool_tar_probe.sh
      - .github/workflows/rpki-pilot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpki-pilot-20261002
      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Stream archive member structure
        run: bash rpkispool_tar_probe.sh
      - name: Commit result bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/rpkispool_tar_members_20261002
          git commit -m "add RPKISPOOL tar member probe [skip ci]" || exit 0
          git push origin HEAD:rpki-pilot-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: rpkispool-tar-members-20261002
          path: results/rpkispool_tar_members_20261002
