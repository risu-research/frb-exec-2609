name: j-a93f
on:
  push:
    branches: [x-2602-b1]
    paths:
      - 'jobs/j-a93f.py'
      - '.github/workflows/j-a93f.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --upgrade pip requests
      - name: run
        run: python jobs/j-a93f.py
      - name: hashes
        if: always()
        run: |
          if [ -d out2 ]; then sha256sum out2/* | tee out2/SHA256SUMS.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j-a93f-out
          path: out2/
          if-no-files-found: warn
          retention-days: 7
