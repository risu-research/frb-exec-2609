name: FOCI EU27 OONI measurement evidence
on:
  push:
    branches:
      - foci-ooni-audit-20261029
    paths:
      - '.github/workflows/foci_ooni_counts.yml'
      - 'foci_ooni_controls.py'
      - 'foci_ooni_unlisted_controls.py'
      - 'foci_ooni_list_membership.py'
      - 'foci_git_full_history.py'
      - 'foci_eu27_list_check.py'
      - 'foci_eu27_measurements.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Counting or verification stage
        type: choice
        options: [eu27count, eu27, history, list, unlisted, comparison, full, quick, alias, fr, export]
        default: eu27count
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Run selected reproducible stage
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'eu27count' }}
        run: |
          set -euo pipefail
          mkdir -p results
          cp foci_ooni_count.py foci_ooni_aliases.py foci_ooni_fr_cluster.py foci_ooni_controls.py foci_ooni_unlisted_controls.py foci_ooni_list_membership.py foci_git_full_history.py foci_eu27_list_check.py foci_eu27_measurements.py results/
          case "$RUN_MODE" in
            full|quick) python3 foci_ooni_count.py --mode "$RUN_MODE" --output results ;; 
            comparison) python3 foci_ooni_controls.py && cp foci_controls_results/* results/ ;;
            unlisted) python3 foci_ooni_unlisted_controls.py && cp foci_unlisted_controls_results/* results/ ;;
            list) python3 foci_ooni_list_membership.py && cp foci_testlist_results/* results/ ;;
            history) python3 foci_git_full_history.py && cp foci_git_history_results/* results/ ;;
            eu27) python3 foci_eu27_list_check.py && cp foci_eu27_lists/* results/ ;;
            eu27count) python3 foci_eu27_measurements.py && cp foci_eu27_measurements/* results/ ;;
            alias) python3 foci_ooni_aliases.py --mode full --output results ;;
            fr) python3 foci_ooni_fr_cluster.py && cp foci_fr_cluster_results/* results/ ;;
            export) echo "Source snapshot only; no network queries" ;;
            *) echo "Invalid mode" >&2; exit 2 ;;
          esac
      - name: Save source and generated data, including partial output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foci-ooni-source-and-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
