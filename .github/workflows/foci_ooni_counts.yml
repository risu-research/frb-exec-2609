name: FOCI OONI French cluster verification
on:
  push:
    branches:
      - foci-ooni-audit-20261029
    paths:
      - 'foci_ooni_count.py'
      - 'foci_ooni_aliases.py'
      - 'foci_ooni_fr_cluster.py'
      - '.github/workflows/foci_ooni_counts.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Coverage (quick = 2 periods, full = 7 periods)
        type: choice
        options: [quick, full]
        default: full
        required: true
permissions:
  contents: read
jobs:
  public_ooni_aggregation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Execute read-only OONI aggregation
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
        run: |
          python3 --version
          python3 foci_ooni_fr_cluster.py
      - name: Publish research CSVs even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foci-ooni-france-cluster
          path: foci_fr_cluster_results/
          if-no-files-found: warn
          retention-days: 14
