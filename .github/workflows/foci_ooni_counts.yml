name: FOCI OONI sanctioned news comparison
on:
  push:
    branches:
      - foci-ooni-audit-20261029
    paths:
      - '.github/workflows/foci_ooni_counts.yml'
      - 'foci_ooni_controls.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Counting or verification stage
        type: choice
        options: [comparison, full, quick, alias, fr, export]
        default: comparison
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Run selected reproducible stage
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'comparison' }}
        run: |
          set -euo pipefail
          mkdir -p results
          cp foci_ooni_count.py foci_ooni_aliases.py foci_ooni_fr_cluster.py results/
          case "$RUN_MODE" in
            full|quick) python3 foci_ooni_count.py --mode "$RUN_MODE" --output results ;; 
            comparison) python3 foci_ooni_controls.py && cp foci_controls_results/* results/ ;;
            alias) python3 foci_ooni_aliases.py --mode full --output results ;;
            fr) python3 foci_ooni_fr_cluster.py && cp foci_fr_cluster_results/* results/ ;;
            export) echo "Source snapshot only; no network queries" ;;
            *) echo "Invalid mode" >&2; exit 2 ;;
          esac
      - name: Save source and generated data, including partial output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foci-ooni-source-and-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
