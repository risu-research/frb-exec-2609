name: HCII Yambda Stage5 prospective evidence audit
on:
  push:
    branches:
      - run/hcii-yambda-matched-20261009
    paths:
      - hcii_yambda/stage5_prospective.py
      - .github/workflows/hcii-yambda-stage5-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb==1.4.0 requests==2.32.3
      - name: Execute separated evidence and follow-up audit
        run: python hcii_yambda/stage5_prospective.py
      - name: Save aggregate findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcii-yambda-stage5-aggregates
          path: hcii_yambda/results_stage5/
          retention-days: 10
