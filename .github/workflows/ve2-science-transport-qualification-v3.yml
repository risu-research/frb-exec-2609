name: VE2 cross-version science transport qualification v3

on:
  push:
    branches:
      - ve2-science-transport-qualification-v3

permissions:
  contents: read

env:
  V2_FAILURE_SEAL: edaa6525243e4b06092379a314b7faea78b4aae4
  PRIVATE_PREOPEN_AUTHORITY: e8c32489b113724d20fb57b34d4464aeb4626c9d
  PRIVATE_SCIENCE_CONSTITUTION: f0cca6726b634a35c523b0caab89694bd7fb18e5
  PUBLIC_E0R_PASS: 390280823553b2c9b7c5996953891cfae5648fb1
  BASE_CONTRACT_BLOB: 2b79daab2de89a11890adca7f1d804d42b34e2d1
  TRANSPORT_VALIDATOR_BLOB: 5dcf67b9bdb349032670c127bd756e40f0acdc1c
  V3_RUNTIME_BLOB: 7b31244a3a4505399e5885b017fd81bb06209176
  V3_PREFLIGHT_VALIDATOR_BLOB: 6f8cf9393547359597c8ccb2f236003df6f86722
  V3_CONTRACT_BLOB: c91a49bc9a408123b6d0af000794d7fdead65cd3
  V3_REMEDIATION_BLOB: 05fb25cd012fc14d85758f91ad86801fa3232821
  T01_OLD_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:92a8fe2ba3ffa0217776dd44687a2f477dc6342e7135766e9599ad8952e3914e
  T01_NEW_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:97d63b3d0028b6b52ad8e5ac7b014c3404e69bf1656b5489eec48b59184e0bc7
  T02_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293

jobs:
  open-gate:
    runs-on: ubuntu-24.04
    outputs:
      source_freeze: ${{ steps.gate.outputs.source_freeze }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 50
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f VE2_SCIENCE_TRANSPORT_QUALIFICATION_OPEN_V3.json
          source_freeze="$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$V2_FAILURE_SEAL" "$source_freeze"

          mapfile -t open_delta < <(git diff --name-only "$source_freeze..HEAD")
          test "${#open_delta[@]}" = '1'
          test "${open_delta[0]}" = 'VE2_SCIENCE_TRANSPORT_QUALIFICATION_OPEN_V3.json'

          mapfile -t source_delta < <(git diff --name-only "$V2_FAILURE_SEAL..$source_freeze")
          expected=(
            '.github/workflows/ve2-science-transport-qualification-v3.yml'
            'VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V3.json'
            'VE2_SCIENCE_TRANSPORT_V3_BOOTSTRAP_REMEDIATION.json'
            've2_science_transport_preflight_validate_v3.py'
            've2_science_transport_qualify_v3.py'
          )
          test "${#source_delta[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${source_delta[$i]}" = "${expected[$i]}"; done

          test "$(git hash-object --no-filters VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V1.json)" = "$BASE_CONTRACT_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_independent_validate_v1.py)" = "$TRANSPORT_VALIDATOR_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_qualify_v3.py)" = "$V3_RUNTIME_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_preflight_validate_v3.py)" = "$V3_PREFLIGHT_VALIDATOR_BLOB"
          test "$(git hash-object --no-filters VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V3.json)" = "$V3_CONTRACT_BLOB"
          test "$(git hash-object --no-filters VE2_SCIENCE_TRANSPORT_V3_BOOTSTRAP_REMEDIATION.json)" = "$V3_REMEDIATION_BLOB"

          python - "$source_freeze" <<'PY'
          import ast,json,sys
          from pathlib import Path

          c=json.load(open('VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V3.json'))
          assert c['schema']=='replaymark.ve2.science-transport-qualification-contract.v3'
          assert c['status']=='FROZEN_PROSPECTIVE_PRE_SCIENCE'
          assert c['authority']['v2_failure_seal']=='edaa6525243e4b06092379a314b7faea78b4aae4'
          assert c['v3_bootstrap_closure']['runtime_git_blob_sha1']=='7b31244a3a4505399e5885b017fd81bb06209176'
          assert c['v3_bootstrap_closure']['zero_invocation_preflight_required_for_all_roles_before_any_qualification_stimulus'] is True
          assert c['inheritance']['pass_criteria_changed'] is False
          assert c['inheritance']['clock_transport_law_changed'] is False
          assert c['inheritance']['double_witness_law_changed'] is False
          assert c['scientific_hygiene']['scientific_cells']==0
          assert c['scientific_hygiene']['expected_frontier_mounted'] is False

          r=json.load(open('VE2_SCIENCE_TRANSPORT_V3_BOOTSTRAP_REMEDIATION.json'))
          assert r['predecessor_failure_seal']=='edaa6525243e4b06092379a314b7faea78b4aae4'
          assert r['observed_predecessor_exposure']['neutral_transport_rows_opened']==0
          assert r['observed_predecessor_exposure']['scientific_cells']==0
          assert r['immutable_inherited_semantics']['transport_pass_criteria_changed'] is False
          assert r['attempt_law']['v2_never_rerun'] is True
          assert r['attempt_law']['v3_promotable_attempt']==1

          o=json.load(open('VE2_SCIENCE_TRANSPORT_QUALIFICATION_OPEN_V3.json'))
          assert o=={
            'schema':'replaymark.ve2.science-transport-qualification-open.v3',
            'authority':'VE2_CROSS_VERSION_SCIENCE_TRANSPORT_PRE_SCIENCE_V3',
            'source_freeze_public_head':sys.argv[1],
            'predecessor_failure_seal':'edaa6525243e4b06092379a314b7faea78b4aae4',
            'private_preopen_authority':'e8c32489b113724d20fb57b34d4464aeb4626c9d',
            'scientific_result_opened':False,
            'frontier_result_seen':False,
            'neutral_transport_rows_before_open':0,
            'scientific_cells':0,
            'same_authority_rerun':False,
          }

          source=Path('ve2_science_transport_qualify_v3.py').read_text()
          tree=ast.parse(source)
          forbidden_exact={
            'VE2_T01_EXECUTION_STATE_MANIFEST_V1.json',
            'VE2_T02_EXECUTION_STATE_MANIFEST_V1.json',
            'VE2_T01_EXPECTED_FRONTIER_V1.json',
            'VE2_T02_EXPECTED_FRONTIER_V1.json',
            'VE2_T01_NATIVE_SEMANTICS_V1.json',
            'VE2_T02_NATIVE_SEMANTICS_V1.json',
          }
          strings={n.value for n in ast.walk(tree) if isinstance(n,ast.Constant) and isinstance(n.value,str)}
          assert forbidden_exact.isdisjoint(strings)
          imports=set()
          direct_read_calls=[]
          for n in ast.walk(tree):
            if isinstance(n,ast.Import): imports.update(a.name.split('.')[0] for a in n.names)
            elif isinstance(n,ast.ImportFrom) and n.module: imports.add(n.module.split('.')[0])
            elif isinstance(n,ast.Call):
              if isinstance(n.func,ast.Name) and n.func.id=='open': direct_read_calls.append('open')
              if isinstance(n.func,ast.Attribute) and n.func.attr in {'read_text','read_bytes'}: direct_read_calls.append(n.func.attr)
          assert not ({'requests','httpx','socket','subprocess'} & imports)
          assert direct_read_calls==[]
          assert '--preflight-only' in source
          assert 'result_dependent_fallback' in source and 'retry_after_failure' in source
          PY

          python -m py_compile ve2_science_transport_qualify_v3.py ve2_science_transport_preflight_validate_v3.py ve2_science_transport_independent_validate_v1.py
          echo "source_freeze=$source_freeze" >> "$GITHUB_OUTPUT"

  bootstrap-preflight:
    needs: open-gate
    strategy:
      fail-fast: false
      matrix:
        role: [T01_OLD_RUNTIME, T01_NEW_RUNTIME, T02_RUNTIME]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Select exact frozen runtime image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$ROLE" in
            T01_OLD_RUNTIME) image="$T01_OLD_IMAGE"; expected='2022.10.0' ;;
            T01_NEW_RUNTIME) image="$T01_NEW_IMAGE"; expected='2026.1.0' ;;
            T02_RUNTIME) image="$T02_IMAGE"; expected='2026.9.0' ;;
            *) exit 2 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
      - name: Verify exact image and source-proven Home Assistant version
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED: ${{ steps.image.outputs.expected }}
        run: |
          set -euo pipefail
          mkdir -p preflight
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > "preflight/${ROLE}_IMAGE_INSPECT.json"
          observed="$(docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from homeassistant.const import __version__; print(__version__)')"
          test "$observed" = "$EXPECTED"
          printf '%s\n' "$observed" > "preflight/${ROLE}_HA_VERSION.txt"
      - name: Materialize native substrate without emitting neutral stimulus
        id: runtime
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          chmod 0777 preflight
          set +e
          docker run --rm --network none \
            -v "$PWD/ve2_science_transport_qualify_v3.py:/work/qualify.py:ro" \
            -v "$PWD/preflight:/results" \
            --entrypoint python3 "$IMAGE" \
            /work/qualify.py --preflight-only --role "$ROLE" --out "/results/${ROLE}_PREFLIGHT.json" \
            > "preflight/${ROLE}_PREFLIGHT_STDOUT.txt" 2> "preflight/${ROLE}_PREFLIGHT_STDERR.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "preflight/${ROLE}_PREFLIGHT_EXIT.txt"
          echo "runtime_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal preflight role evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight
          (cd preflight && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable preflight role capsule
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v3-preflight-${{ matrix.role }}
          path: preflight/
          if-no-files-found: error
          retention-days: 90
      - name: Fail role after evidence seal if bootstrap incomplete
        if: always()
        shell: bash
        env:
          RUNTIME_RC: ${{ steps.runtime.outputs.runtime_rc }}
        run: |
          set -euo pipefail
          test "$RUNTIME_RC" = '0'

  preflight-adjudicate:
    needs: [open-gate, bootstrap-preflight]
    if: always() && needs.open-gate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Create total failure-provenance surface before any gate
        run: mkdir -p preflight-aggregate
      - name: Download all sealed preflight capsules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ve2-science-transport-v3-preflight-*
          path: preflight-downloads
          merge-multiple: false
      - name: Verify preflight checksums and exits
        id: role_gate
        shell: bash
        run: |
          set +e
          ok=1
          for role in T01_OLD_RUNTIME T01_NEW_RUNTIME T02_RUNTIME; do
            root="preflight-downloads/ve2-science-transport-v3-preflight-${role}"
            test -d "$root" || ok=0
            if test -d "$root"; then
              (cd "$root" && sha256sum -c CHECKSUMS.sha256) || ok=0
              test "$(cat "$root/${role}_PREFLIGHT_EXIT.txt" 2>/dev/null)" = '0' || ok=0
              test -f "$root/${role}_PREFLIGHT.json" || ok=0
            fi
          done
          echo "roles_ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently adjudicate all three zero-invocation bootstraps
        id: validate
        if: steps.role_gate.outputs.roles_ok == '1'
        shell: bash
        run: |
          set +e
          python ve2_science_transport_preflight_validate_v3.py \
            --t01-old preflight-downloads/ve2-science-transport-v3-preflight-T01_OLD_RUNTIME/T01_OLD_RUNTIME_PREFLIGHT.json \
            --t01-new preflight-downloads/ve2-science-transport-v3-preflight-T01_NEW_RUNTIME/T01_NEW_RUNTIME_PREFLIGHT.json \
            --t02 preflight-downloads/ve2-science-transport-v3-preflight-T02_RUNTIME/T02_RUNTIME_PREFLIGHT.json \
            --out preflight-aggregate/VE2_SCIENCE_TRANSPORT_V3_PREFLIGHT_ADJUDICATION.json \
            > preflight-aggregate/VALIDATOR_STDOUT.txt 2> preflight-aggregate/VALIDATOR_STDERR.txt
          rc=$?
          echo "validator_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal preflight aggregate provenance regardless of outcome
        if: always()
        shell: bash
        env:
          SOURCE_FREEZE: ${{ needs.open-gate.outputs.source_freeze }}
          ROLES_OK: ${{ steps.role_gate.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validate.outputs.validator_rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          adjud=Path('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V3_PREFLIGHT_ADJUDICATION.json')
          parsed=json.loads(adjud.read_text()) if adjud.exists() else None
          ok=(os.environ.get('ROLES_OK')=='1' and os.environ.get('VALIDATOR_RC')=='0' and parsed and parsed.get('status')=='PASS')
          p={
            'schema':'replaymark.ve2.science-transport-v3-preflight-provenance.v1',
            'status':'PASS_ZERO_INVOCATION' if ok else 'INCOMPLETE_NON_PROMOTABLE',
            'execution_head':os.environ['GITHUB_SHA'],
            'source_freeze_public_head':os.environ.get('SOURCE_FREEZE',''),
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'all_role_capsules_structurally_valid':os.environ.get('ROLES_OK')=='1',
            'independent_validator_pass':os.environ.get('VALIDATOR_RC')=='0',
            'neutral_trigger_stimulus_emitted':False,
            'neutral_automation_invocations_before_qualification':0,
            'scientific_result_opened':False,
            'frontier_result_seen':False,
            'scientific_cells':0,
            'promotion_to_neutral_transport_qualification':bool(ok),
          }
          Path('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V3_PREFLIGHT_PROVENANCE.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          (cd preflight-aggregate && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable preflight aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v3-preflight-aggregate
          path: preflight-aggregate/
          if-no-files-found: error
          retention-days: 90
      - name: Open neutral qualification only after sealed independent preflight PASS
        if: always()
        shell: bash
        env:
          ROLES_OK: ${{ steps.role_gate.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validate.outputs.validator_rc }}
        run: |
          set -euo pipefail
          test "$ROLES_OK" = '1'
          test "$VALIDATOR_RC" = '0'
          python - <<'PY'
          import json
          p=json.load(open('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V3_PREFLIGHT_PROVENANCE.json'))
          assert p['status']=='PASS_ZERO_INVOCATION'
          assert p['neutral_automation_invocations_before_qualification']==0
          assert p['scientific_cells']==0
          assert p['promotion_to_neutral_transport_qualification'] is True
          PY

  qualify-role:
    needs: [open-gate, preflight-adjudicate]
    strategy:
      fail-fast: false
      matrix:
        role: [T01_OLD_RUNTIME, T01_NEW_RUNTIME, T02_RUNTIME]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Re-select exact frozen runtime image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$ROLE" in
            T01_OLD_RUNTIME) image="$T01_OLD_IMAGE"; expected='2022.10.0' ;;
            T01_NEW_RUNTIME) image="$T01_NEW_IMAGE"; expected='2026.1.0' ;;
            T02_RUNTIME) image="$T02_IMAGE"; expected='2026.9.0' ;;
            *) exit 2 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
      - name: Re-verify exact runtime identity
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED: ${{ steps.image.outputs.expected }}
        run: |
          set -euo pipefail
          mkdir -p results
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > "results/${ROLE}_IMAGE_INSPECT.json"
          observed="$(docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from homeassistant.const import __version__; print(__version__)')"
          test "$observed" = "$EXPECTED"
          printf '%s\n' "$observed" > "results/${ROLE}_HA_VERSION.txt"
      - name: Execute orthogonal neutral transport qualification
        id: runtime
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          chmod 0777 results
          set +e
          docker run --rm --network none \
            -v "$PWD/ve2_science_transport_qualify_v3.py:/work/qualify.py:ro" \
            -v "$PWD/results:/results" \
            --entrypoint python3 "$IMAGE" \
            /work/qualify.py --role "$ROLE" --out "/results/${ROLE}.json" \
            > "results/${ROLE}_STDOUT.txt" 2> "results/${ROLE}_STDERR.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "results/${ROLE}_EXIT.txt"
          echo "runtime_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal qualification role evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          (cd results && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable qualification role capsule
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v3-${{ matrix.role }}
          path: results/
          if-no-files-found: error
          retention-days: 90
      - name: Fail role after evidence seal if qualifier incomplete
        if: always()
        shell: bash
        env:
          RUNTIME_RC: ${{ steps.runtime.outputs.runtime_rc }}
        run: |
          set -euo pipefail
          test "$RUNTIME_RC" = '0'

  adjudicate:
    needs: [open-gate, preflight-adjudicate, qualify-role]
    if: always() && needs.open-gate.result == 'success' && needs.preflight-adjudicate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Create total aggregate provenance surface before any gate
        run: mkdir -p aggregate
      - name: Download every sealed qualification role capsule
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ve2-science-transport-v3-T*
          path: downloads
          merge-multiple: false
      - name: Verify qualification capsule checksums and exits
        id: role_gate
        shell: bash
        run: |
          set +e
          ok=1
          for role in T01_OLD_RUNTIME T01_NEW_RUNTIME T02_RUNTIME; do
            root="downloads/ve2-science-transport-v3-${role}"
            test -d "$root" || ok=0
            if test -d "$root"; then
              (cd "$root" && sha256sum -c CHECKSUMS.sha256) || ok=0
              test "$(cat "$root/${role}_EXIT.txt" 2>/dev/null)" = '0' || ok=0
              test -f "$root/${role}.json" || ok=0
            fi
          done
          echo "roles_ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently adjudicate unchanged transport pass law
        id: validate
        if: steps.role_gate.outputs.roles_ok == '1'
        shell: bash
        run: |
          set +e
          python ve2_science_transport_independent_validate_v1.py \
            --t01-old downloads/ve2-science-transport-v3-T01_OLD_RUNTIME/T01_OLD_RUNTIME.json \
            --t01-new downloads/ve2-science-transport-v3-T01_NEW_RUNTIME/T01_NEW_RUNTIME.json \
            --t02 downloads/ve2-science-transport-v3-T02_RUNTIME/T02_RUNTIME.json \
            --out aggregate/VE2_SCIENCE_TRANSPORT_QUALIFICATION_RESULT_V3.json \
            > aggregate/VALIDATOR_STDOUT.txt 2> aggregate/VALIDATOR_STDERR.txt
          rc=$?
          echo "validator_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal complete aggregate provenance regardless of outcome
        if: always()
        shell: bash
        env:
          SOURCE_FREEZE: ${{ needs.open-gate.outputs.source_freeze }}
          ROLES_OK: ${{ steps.role_gate.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validate.outputs.validator_rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          result_path=Path('aggregate/VE2_SCIENCE_TRANSPORT_QUALIFICATION_RESULT_V3.json')
          result=json.loads(result_path.read_text()) if result_path.exists() else None
          ok=(os.environ.get('ROLES_OK')=='1' and os.environ.get('VALIDATOR_RC')=='0' and result and result.get('status')=='PASS')
          p={
            'schema':'replaymark.ve2.science-transport-qualification-provenance.v3',
            'status':'PASS_PRE_SCIENCE' if ok else 'INCOMPLETE_NON_PROMOTABLE',
            'execution_head':os.environ['GITHUB_SHA'],
            'source_freeze_public_head':os.environ.get('SOURCE_FREEZE',''),
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'predecessor_v2_failure_seal':os.environ['V2_FAILURE_SEAL'],
            'private_preopen_authority':os.environ['PRIVATE_PREOPEN_AUTHORITY'],
            'preflight_required_and_completed':True,
            'all_role_capsules_structurally_valid':os.environ.get('ROLES_OK')=='1',
            'independent_validator_pass':os.environ.get('VALIDATOR_RC')=='0',
            'scientific_result_opened':False,
            'frontier_result_seen':False,
            'transition_blueprint_executed':False,
            'scientific_cells':0,
            'same_authority_rerun':False,
            'promotion':bool(ok),
          }
          Path('aggregate/VE2_SCIENCE_TRANSPORT_QUALIFICATION_PROVENANCE_V3.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          (cd aggregate && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable aggregate qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-qualification-v3-aggregate
          path: aggregate/
          if-no-files-found: error
          retention-days: 90
      - name: Surface GREEN only after complete evidence seal
        if: always()
        shell: bash
