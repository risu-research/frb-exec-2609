name: VE2 cross-version science transport qualification v6

on:
  push:
    branches:
      - ve2-science-transport-qualification-v6

permissions:
  contents: read

env:
  DIAGNOSIS_SEAL: 5f541f3976946ca21d3a911b49f6f0f69158d369
  V5_FAILURE_SEAL: c17d2506e465b9bb3ac71cb04cb7c10c0360ba01
  PRIVATE_PREOPEN_AUTHORITY: e8c32489b113724d20fb57b34d4464aeb4626c9d
  PRIVATE_SCIENCE_CONSTITUTION: f0cca6726b634a35c523b0caab89694bd7fb18e5
  PUBLIC_E0R_PASS: 390280823553b2c9b7c5996953891cfae5648fb1
  BASE_CONTRACT_BLOB: 2b79daab2de89a11890adca7f1d804d42b34e2d1
  TRANSPORT_VALIDATOR_BLOB: 5dcf67b9bdb349032670c127bd756e40f0acdc1c
  V3_RUNTIME_BLOB: 7b31244a3a4505399e5885b017fd81bb06209176
  V4_RUNTIME_BLOB: 8c33de1d8717983ffecd4a45634de0d2469ac19d
  V5_RUNTIME_BLOB: 20914078395995116cbd88cdd63063f4fb6907f0
  V4_PREFLIGHT_VALIDATOR_BLOB: 6d45caa8d2ae721cf2dc8fe33ca61b263451e309
  V6_RUNTIME_BLOB: 3c3af5b6dd54bebea7faed905cec6da066e1ee32
  V6_PREFLIGHT_VALIDATOR_BLOB: c584a2aeaeae3f9be280f35503503c4fb3a92cbc
  V6_REMEDIATION_BLOB: b439f783a5163552bbaf20b1eb97531304dd6cf3
  V6_CONTRACT_BLOB: 0cfd7c2c54b9176764459ca33e85802aff8d82bf
  T01_OLD_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:92a8fe2ba3ffa0217776dd44687a2f477dc6342e7135766e9599ad8952e3914e
  T01_NEW_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:97d63b3d0028b6b52ad8e5ac7b014c3404e69bf1656b5489eec48b59184e0bc7
  T02_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293

jobs:
  open-gate:
    runs-on: ubuntu-24.04
    outputs:
      source_freeze: ${{ steps.gate.outputs.source_freeze }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 100
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f VE2_SCIENCE_TRANSPORT_QUALIFICATION_OPEN_V6.json
          source_freeze="$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$DIAGNOSIS_SEAL" "$source_freeze"

          mapfile -t open_delta < <(git diff --name-only "$source_freeze..HEAD" | LC_ALL=C sort)
          test "${#open_delta[@]}" = '1'
          test "${open_delta[0]}" = 'VE2_SCIENCE_TRANSPORT_QUALIFICATION_OPEN_V6.json'

          mapfile -t source_delta < <(git diff --name-only "$DIAGNOSIS_SEAL..$source_freeze" | LC_ALL=C sort)
          expected=(
            '.github/workflows/ve2-science-transport-qualification-v6.yml'
            'VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V6.json'
            'VE2_SCIENCE_TRANSPORT_V6_LIFECYCLE_SIGNAL_REMEDIATION.json'
            've2_science_transport_preflight_validate_v6.py'
            've2_science_transport_qualify_v6.py'
          )
          test "${#source_delta[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${source_delta[$i]}" = "${expected[$i]}"; done

          test "$(git hash-object --no-filters VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V1.json)" = "$BASE_CONTRACT_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_independent_validate_v1.py)" = "$TRANSPORT_VALIDATOR_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_qualify_v3.py)" = "$V3_RUNTIME_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_qualify_v4.py)" = "$V4_RUNTIME_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_qualify_v5.py)" = "$V5_RUNTIME_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_preflight_validate_v4.py)" = "$V4_PREFLIGHT_VALIDATOR_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_qualify_v6.py)" = "$V6_RUNTIME_BLOB"
          test "$(git hash-object --no-filters ve2_science_transport_preflight_validate_v6.py)" = "$V6_PREFLIGHT_VALIDATOR_BLOB"
          test "$(git hash-object --no-filters VE2_SCIENCE_TRANSPORT_V6_LIFECYCLE_SIGNAL_REMEDIATION.json)" = "$V6_REMEDIATION_BLOB"
          test "$(git hash-object --no-filters VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V6.json)" = "$V6_CONTRACT_BLOB"

          python - "$source_freeze" <<'PY'
          import ast,json,sys
          from pathlib import Path

          c=json.load(open('VE2_SCIENCE_TRANSPORT_QUALIFICATION_CONTRACT_V6.json'))
          assert c['schema']=='replaymark.ve2.science-transport-qualification-contract.v6'
          assert c['status']=='FROZEN_PROSPECTIVE_PRE_SCIENCE'
          assert c['authority']['t02_diagnosis_seal']=='5f541f3976946ca21d3a911b49f6f0f69158d369'
          assert c['v6_delta']['runtime_blob']=='3c3af5b6dd54bebea7faed905cec6da066e1ee32'
          assert c['v6_delta']['preflight_validator_blob']=='c584a2aeaeae3f9be280f35503503c4fb3a92cbc'
          assert c['v6_delta']['semantic_change_count']==1
          assert c['v6_delta']['old_signal']=='homeassistant_start'
          assert c['v6_delta']['new_signal']=='homeassistant_started'
          assert c['v6_delta']['affects_only_case']=='homeassistant_start_delay_30s'
          assert c['v6_delta']['additional_home_assistant_setup_calls']==0
          assert c['v6_delta']['clock_driver_changed'] is False
          assert c['v6_delta']['wait_timeout_changed'] is False
          assert c['inheritance']['transport_pass_criteria_changed'] is False
          assert c['scientific_firewall']['scientific_cells']==0

          r=json.load(open('VE2_SCIENCE_TRANSPORT_V6_LIFECYCLE_SIGNAL_REMEDIATION.json'))
          assert r['predecessor_diagnosis_seal']=='5f541f3976946ca21d3a911b49f6f0f69158d369'
          assert r['source_evidence']['home_assistant_tag_commit']=='dfb5a9e690daaf204b542896e4b595e61a11a401'
          assert r['source_evidence']['native_listener_symbol']=='EVENT_HOMEASSISTANT_STARTED'
          assert r['source_evidence']['native_listener_value']=='homeassistant_started'
          assert r['repair']['authorized_semantic_changes']==1
          assert r['repair']['additional_home_assistant_setup_calls']==0
          assert r['repair']['state_case_changed'] is False
          assert r['repair']['state_for_case_changed'] is False
          assert r['repair']['time_case_changed'] is False
          assert r['repair']['delay_duration_changed'] is False
          assert r['repair']['clock_driver_changed'] is False
          assert r['repair']['wait_timeout_changed'] is False
          assert r['repair']['transport_pass_criteria_changed'] is False

          o=json.load(open('VE2_SCIENCE_TRANSPORT_QUALIFICATION_OPEN_V6.json'))
          assert o=={
            'schema':'replaymark.ve2.science-transport-qualification-open.v6',
            'authority':'VE2_CROSS_VERSION_SCIENCE_TRANSPORT_PRE_SCIENCE_V6',
            'source_freeze_public_head':sys.argv[1],
            'diagnosis_seal':'5f541f3976946ca21d3a911b49f6f0f69158d369',
            'private_preopen_authority':'e8c32489b113724d20fb57b34d4464aeb4626c9d',
            'scientific_result_opened':False,
            'frontier_result_seen':False,
            'neutral_transport_rows_before_open':0,
            'scientific_cells':0,
            'same_authority_rerun':False,
          }

          forbidden={
            'VE2_T01_EXECUTION_STATE_MANIFEST_V1.json',
            'VE2_T02_EXECUTION_STATE_MANIFEST_V1.json',
            'VE2_T01_EXPECTED_FRONTIER_V1.json',
            'VE2_T02_EXPECTED_FRONTIER_V1.json',
            'VE2_T01_NATIVE_SEMANTICS_V1.json',
            'VE2_T02_NATIVE_SEMANTICS_V1.json',
          }
          for filename in ('ve2_science_transport_qualify_v3.py','ve2_science_transport_qualify_v4.py','ve2_science_transport_qualify_v5.py','ve2_science_transport_qualify_v6.py'):
            source=Path(filename).read_text()
            tree=ast.parse(source)
            strings={n.value for n in ast.walk(tree) if isinstance(n,ast.Constant) and isinstance(n.value,str)}
            assert forbidden.isdisjoint(strings)
            imports=set()
            direct_reads=[]
            for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports.update(a.name.split('.')[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module: imports.add(n.module.split('.')[0])
              elif isinstance(n,ast.Call):
                if isinstance(n.func,ast.Name) and n.func.id=='open': direct_reads.append('open')
                if isinstance(n.func,ast.Attribute) and n.func.attr in {'read_text','read_bytes'}: direct_reads.append(n.func.attr)
            assert not ({'requests','httpx','socket','subprocess'} & imports)
            assert direct_reads==[]

          v3_source=Path('ve2_science_transport_qualify_v3.py').read_text()
          v3_tree=ast.parse(v3_source)
          functional=[]
          for node in v3_tree.body:
            if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
              count=sum(1 for n in ast.walk(node) if isinstance(n,ast.Name) and isinstance(n.ctx,ast.Load) and n.id=='EVENT_HOMEASSISTANT_START')
              if count: functional.append((node.name,count))
          assert functional==[('run_startup_delay',1)], functional

          v6_source=Path('ve2_science_transport_qualify_v6.py').read_text()
          v6_tree=ast.parse(v6_source)
          repairs=[]
          for n in ast.walk(v6_tree):
            if isinstance(n,ast.Assign) and len(n.targets)==1:
              t=n.targets[0]
              if isinstance(t,ast.Attribute) and isinstance(t.value,ast.Name) and t.value.id=='v3' and t.attr=='EVENT_HOMEASSISTANT_START':
                repairs.append(n)
          assert len(repairs)==1
          assert isinstance(repairs[0].value,ast.Name) and repairs[0].value.id=='EVENT_HOMEASSISTANT_STARTED'
          assert 'v5._install_v5()' in v6_source
          for forbidden_call in ('async_setup_component(', '.async_load(', '.async_setup(', 'hass.services.', 'hass.states.', '_drive_clock =', '_wait_for_count ='):
              assert forbidden_call not in v6_source
          PY

          python -m py_compile \
            ve2_science_transport_qualify_v3.py \
            ve2_science_transport_qualify_v4.py \
            ve2_science_transport_qualify_v5.py \
            ve2_science_transport_qualify_v6.py \
            ve2_science_transport_preflight_validate_v3.py \
            ve2_science_transport_preflight_validate_v4.py \
            ve2_science_transport_preflight_validate_v6.py \
            ve2_science_transport_independent_validate_v1.py
          echo "source_freeze=$source_freeze" >> "$GITHUB_OUTPUT"

  bootstrap-preflight:
    needs: open-gate
    strategy:
      fail-fast: false
      matrix:
        role: [T01_OLD_RUNTIME, T01_NEW_RUNTIME, T02_RUNTIME]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Select exact frozen runtime image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$ROLE" in
            T01_OLD_RUNTIME) image="$T01_OLD_IMAGE"; expected='2022.10.0' ;;
            T01_NEW_RUNTIME) image="$T01_NEW_IMAGE"; expected='2026.1.0' ;;
            T02_RUNTIME) image="$T02_IMAGE"; expected='2026.9.0' ;;
            *) exit 2 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
      - name: Verify exact image, HA version, and lifecycle constant surface
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED: ${{ steps.image.outputs.expected }}
        run: |
          set -euo pipefail
          mkdir -p preflight
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > "preflight/${ROLE}_IMAGE_INSPECT.json"
          observed="$(docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from homeassistant.const import __version__; print(__version__)')"
          test "$observed" = "$EXPECTED"
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from homeassistant.const import EVENT_HOMEASSISTANT_START, EVENT_HOMEASSISTANT_STARTED; assert str(EVENT_HOMEASSISTANT_START)=="homeassistant_start"; assert str(EVENT_HOMEASSISTANT_STARTED)=="homeassistant_started"; assert EVENT_HOMEASSISTANT_START != EVENT_HOMEASSISTANT_STARTED'
          printf '%s\n' "$observed" > "preflight/${ROLE}_HA_VERSION.txt"
      - name: Materialize v6 native substrate with zero trigger stimulus
        id: runtime
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          chmod 0777 preflight
          set +e
          docker run --rm --network none \
            -v "$PWD/ve2_science_transport_qualify_v3.py:/work/ve2_science_transport_qualify_v3.py:ro" \
            -v "$PWD/ve2_science_transport_qualify_v4.py:/work/ve2_science_transport_qualify_v4.py:ro" \
            -v "$PWD/ve2_science_transport_qualify_v5.py:/work/ve2_science_transport_qualify_v5.py:ro" \
            -v "$PWD/ve2_science_transport_qualify_v6.py:/work/qualify.py:ro" \
            -v "$PWD/preflight:/results" \
            --entrypoint python3 "$IMAGE" \
            /work/qualify.py --preflight-only --role "$ROLE" --out "/results/${ROLE}_PREFLIGHT.json" \
            > "preflight/${ROLE}_PREFLIGHT_STDOUT.txt" 2> "preflight/${ROLE}_PREFLIGHT_STDERR.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "preflight/${ROLE}_PREFLIGHT_EXIT.txt"
          echo "runtime_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal preflight role evidence
        shell: bash
        run: |
          set -euo pipefail
          (cd preflight && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable preflight role capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v6-preflight-${{ matrix.role }}
          path: preflight/
          if-no-files-found: error
          retention-days: 90
      - name: Fail only after evidence seal if bootstrap incomplete
        shell: bash
        env:
          RUNTIME_RC: ${{ steps.runtime.outputs.runtime_rc }}
        run: |
          set -euo pipefail
          test "$RUNTIME_RC" = '0'

  preflight-adjudicate:
    needs: [open-gate, bootstrap-preflight]
    if: ${{ always() && needs.open-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Create total preflight aggregate surface
        run: mkdir -p preflight-aggregate preflight-downloads
      - name: Download all sealed preflight capsules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ve2-science-transport-v6-preflight-*
          path: preflight-downloads
          merge-multiple: false
      - name: Verify preflight checksums and exits
        id: roles
        shell: bash
        run: |
          set +e
          ok=1
          for role in T01_OLD_RUNTIME T01_NEW_RUNTIME T02_RUNTIME; do
            root="preflight-downloads/ve2-science-transport-v6-preflight-${role}"
            test -d "$root" || ok=0
            if test -d "$root"; then
              (cd "$root" && sha256sum -c CHECKSUMS.sha256) || ok=0
              test "$(cat "$root/${role}_PREFLIGHT_EXIT.txt" 2>/dev/null)" = '0' || ok=0
              test -f "$root/${role}_PREFLIGHT.json" || ok=0
            fi
          done
          echo "roles_ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently adjudicate v6 bootstrap, registry closure, and zero invocation
        id: validator
        shell: bash
        run: |
          set +e
          python ve2_science_transport_preflight_validate_v6.py \
            --t01-old preflight-downloads/ve2-science-transport-v6-preflight-T01_OLD_RUNTIME/T01_OLD_RUNTIME_PREFLIGHT.json \
            --t01-new preflight-downloads/ve2-science-transport-v6-preflight-T01_NEW_RUNTIME/T01_NEW_RUNTIME_PREFLIGHT.json \
            --t02 preflight-downloads/ve2-science-transport-v6-preflight-T02_RUNTIME/T02_RUNTIME_PREFLIGHT.json \
            --out preflight-aggregate/VE2_SCIENCE_TRANSPORT_V6_PREFLIGHT_ADJUDICATION.json \
            > preflight-aggregate/VALIDATOR_STDOUT.txt 2> preflight-aggregate/VALIDATOR_STDERR.txt
          rc=$?
          echo "validator_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal preflight aggregate provenance regardless of outcome
        shell: bash
        env:
          ROLES_OK: ${{ steps.roles.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validator.outputs.validator_rc }}
          SOURCE_FREEZE: ${{ needs.open-gate.outputs.source_freeze }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          adjud=Path('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V6_PREFLIGHT_ADJUDICATION.json')
          parsed=json.loads(adjud.read_text()) if adjud.exists() else None
          ok=(os.environ['ROLES_OK']=='1' and os.environ['VALIDATOR_RC']=='0' and parsed and parsed.get('status')=='PASS')
          p={
            'schema':'replaymark.ve2.science-transport-v6-preflight-provenance.v1',
            'status':'PASS_ZERO_INVOCATION' if ok else 'INCOMPLETE_NON_PROMOTABLE',
            'execution_head':os.environ['GITHUB_SHA'],
            'source_freeze_public_head':os.environ['SOURCE_FREEZE'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'diagnosis_seal':os.environ['DIAGNOSIS_SEAL'],
            'all_role_capsules_structurally_valid':os.environ['ROLES_OK']=='1',
            'independent_validator_pass':os.environ['VALIDATOR_RC']=='0',
            'neutral_trigger_stimulus_emitted':False,
            'neutral_automation_invocations_before_qualification':0,
            'scientific_result_opened':False,
            'frontier_result_seen':False,
            'scientific_cells':0,
            'promotion_to_neutral_transport_qualification':bool(ok),
          }
          Path('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V6_PREFLIGHT_PROVENANCE.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          (cd preflight-aggregate && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable preflight aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v6-preflight-aggregate
          path: preflight-aggregate/
          if-no-files-found: error
          retention-days: 90
      - name: Open neutral qualification only after sealed independent preflight PASS
        shell: bash
        env:
          ROLES_OK: ${{ steps.roles.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validator.outputs.validator_rc }}
        run: |
          set -euo pipefail
          test "$ROLES_OK" = '1'
          test "$VALIDATOR_RC" = '0'
          python - <<'PY'
          import json
          a=json.load(open('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V6_PREFLIGHT_ADJUDICATION.json'))
          p=json.load(open('preflight-aggregate/VE2_SCIENCE_TRANSPORT_V6_PREFLIGHT_PROVENANCE.json'))
          assert a['status']=='PASS'
          assert a['promotion']['all_six_native_registry_loads']=='PASS'
          assert a['promotion']['all_three_zero_neutral_invocations'] is True
          assert a['promotion']['eligible_for_neutral_transport_qualification'] is True
          assert p['status']=='PASS_ZERO_INVOCATION'
          assert p['scientific_cells']==0
          assert p['promotion_to_neutral_transport_qualification'] is True
          PY

  qualify-role:
    needs: preflight-adjudicate
    strategy:
      fail-fast: false
      matrix:
        role: [T01_OLD_RUNTIME, T01_NEW_RUNTIME, T02_RUNTIME]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Select exact frozen runtime image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$ROLE" in
            T01_OLD_RUNTIME) image="$T01_OLD_IMAGE"; expected='2022.10.0' ;;
            T01_NEW_RUNTIME) image="$T01_NEW_IMAGE"; expected='2026.1.0' ;;
            T02_RUNTIME) image="$T02_IMAGE"; expected='2026.9.0' ;;
            *) exit 2 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
      - name: Re-verify exact runtime identity and lifecycle surface
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED: ${{ steps.image.outputs.expected }}
        run: |
          set -euo pipefail
          mkdir -p results
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > "results/${ROLE}_IMAGE_INSPECT.json"
          observed="$(docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from homeassistant.const import __version__; print(__version__)')"
          test "$observed" = "$EXPECTED"
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'from homeassistant.const import EVENT_HOMEASSISTANT_START, EVENT_HOMEASSISTANT_STARTED; assert str(EVENT_HOMEASSISTANT_START)=="homeassistant_start"; assert str(EVENT_HOMEASSISTANT_STARTED)=="homeassistant_started"; assert EVENT_HOMEASSISTANT_START != EVENT_HOMEASSISTANT_STARTED'
          printf '%s\n' "$observed" > "results/${ROLE}_HA_VERSION.txt"
      - name: Execute complete v6 orthogonal neutral transport population
        id: runtime
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          chmod 0777 results
          set +e
          docker run --rm --network none \
            -v "$PWD/ve2_science_transport_qualify_v3.py:/work/ve2_science_transport_qualify_v3.py:ro" \
            -v "$PWD/ve2_science_transport_qualify_v4.py:/work/ve2_science_transport_qualify_v4.py:ro" \
            -v "$PWD/ve2_science_transport_qualify_v5.py:/work/ve2_science_transport_qualify_v5.py:ro" \
            -v "$PWD/ve2_science_transport_qualify_v6.py:/work/qualify.py:ro" \
            -v "$PWD/results:/results" \
            --entrypoint python3 "$IMAGE" \
            /work/qualify.py --role "$ROLE" --out "/results/${ROLE}.json" \
            > "results/${ROLE}_STDOUT.txt" 2> "results/${ROLE}_STDERR.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "results/${ROLE}_EXIT.txt"
          echo "runtime_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal qualification role evidence
        shell: bash
        run: |
          set -euo pipefail
          (cd results && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable qualification role capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v6-${{ matrix.role }}
          path: results/
          if-no-files-found: error
          retention-days: 90
      - name: Fail only after evidence seal if qualifier incomplete
        shell: bash
        env:
          RUNTIME_RC: ${{ steps.runtime.outputs.runtime_rc }}
        run: |
          set -euo pipefail
          test "$RUNTIME_RC" = '0'

  adjudicate:
    needs: [open-gate, qualify-role]
    if: ${{ always() && needs.open-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Create total aggregate provenance surface
        run: mkdir -p aggregate qualification-downloads
      - name: Download every sealed qualification role capsule
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ve2-science-transport-v6-*
          path: qualification-downloads
          merge-multiple: false
      - name: Verify qualification capsule checksums and exits
        id: roles
        shell: bash
        run: |
          set +e
          ok=1
          for role in T01_OLD_RUNTIME T01_NEW_RUNTIME T02_RUNTIME; do
            root="qualification-downloads/ve2-science-transport-v6-${role}"
            test -d "$root" || ok=0
            if test -d "$root"; then
              (cd "$root" && sha256sum -c CHECKSUMS.sha256) || ok=0
              test "$(cat "$root/${role}_EXIT.txt" 2>/dev/null)" = '0' || ok=0
              test -f "$root/${role}.json" || ok=0
            fi
          done
          echo "roles_ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently adjudicate unchanged transport pass law
        id: validator
        shell: bash
        env:
          ROLES_OK: ${{ steps.roles.outputs.roles_ok }}
        run: |
          set +e
          rc=99
          if test "$ROLES_OK" = '1'; then
            python ve2_science_transport_independent_validate_v1.py \
              --t01-old qualification-downloads/ve2-science-transport-v6-T01_OLD_RUNTIME/T01_OLD_RUNTIME.json \
              --t01-new qualification-downloads/ve2-science-transport-v6-T01_NEW_RUNTIME/T01_NEW_RUNTIME.json \
              --t02 qualification-downloads/ve2-science-transport-v6-T02_RUNTIME/T02_RUNTIME.json \
              --out aggregate/VE2_SCIENCE_TRANSPORT_V6_INDEPENDENT_VALIDATION.json \
              > aggregate/VALIDATOR_STDOUT.txt 2> aggregate/VALIDATOR_STDERR.txt
            rc=$?
          else
            printf '%s\n' 'validator skipped because at least one sealed role exit was nonzero or missing' > aggregate/VALIDATOR_STDERR.txt
            : > aggregate/VALIDATOR_STDOUT.txt
          fi
          echo "validator_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal complete aggregate provenance regardless of outcome
        shell: bash
        env:
          ROLES_OK: ${{ steps.roles.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validator.outputs.validator_rc }}
          SOURCE_FREEZE: ${{ needs.open-gate.outputs.source_freeze }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          adjud=Path('aggregate/VE2_SCIENCE_TRANSPORT_V6_INDEPENDENT_VALIDATION.json')
          parsed=json.loads(adjud.read_text()) if adjud.exists() else None
          ok=(os.environ['ROLES_OK']=='1' and os.environ['VALIDATOR_RC']=='0' and parsed and parsed.get('status')=='PASS')
          p={
            'schema':'replaymark.ve2.science-transport-v6-aggregate-provenance.v1',
            'status':'PASS_GREEN_GREEN' if ok else 'INCOMPLETE_NON_PROMOTABLE',
            'execution_head':os.environ['GITHUB_SHA'],
            'source_freeze_public_head':os.environ['SOURCE_FREEZE'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'diagnosis_seal':os.environ['DIAGNOSIS_SEAL'],
            'all_role_capsules_structurally_valid_and_exit_zero':os.environ['ROLES_OK']=='1',
            'unchanged_independent_transport_validator_pass':os.environ['VALIDATOR_RC']=='0',
            'scientific_result_opened':False,
            'frontier_result_seen':False,
            'scientific_cells':0,
            'eligible_for_public_transport_pass_seal':bool(ok),
            'eligible_for_scientific_capsule_freeze':bool(ok),
          }
          Path('aggregate/VE2_SCIENCE_TRANSPORT_V6_AGGREGATE_PROVENANCE.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          (cd aggregate && find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
      - name: Upload immutable aggregate qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-science-transport-v6-aggregate
          path: aggregate/
          if-no-files-found: error
          retention-days: 90
      - name: Surface GREEN only after complete evidence seal
        shell: bash
        env:
          ROLES_OK: ${{ steps.roles.outputs.roles_ok }}
          VALIDATOR_RC: ${{ steps.validator.outputs.validator_rc }}
        run: |
          set -euo pipefail
          test "$ROLES_OK" = '1'
          test "$VALIDATOR_RC" = '0'
          python - <<'PY'
          import json
          a=json.load(open('aggregate/VE2_SCIENCE_TRANSPORT_V6_INDEPENDENT_VALIDATION.json'))
          p=json.load(open('aggregate/VE2_SCIENCE_TRANSPORT_V6_AGGREGATE_PROVENANCE.json'))
          assert a['status']=='PASS'
          assert a['promotion']['cross_version_invocation_double_witness']=='PASS'
          assert a['promotion']['T02_clock_transport']=='PASS'
          assert a['promotion']['scientific_cells']==0
          assert a['promotion']['frontier_result_seen'] is False
          assert a['promotion']['eligible_for_scientific_capsule_freeze'] is True
          assert p['status']=='PASS_GREEN_GREEN'
          assert p['eligible_for_public_transport_pass_seal'] is True
          assert p['scientific_cells']==0
          PY
