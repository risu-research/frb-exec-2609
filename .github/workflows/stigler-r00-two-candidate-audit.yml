name: Stigler 2027 R00 institutional choice sources
on:
  push:
    branches:
      - experiment/stigler-institutional-choice-r00-20261123
    paths:
      - research/stigler_r00/**
      - .github/workflows/stigler-r00-two-candidate-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pure source audit parsers
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'pypdf>=5,<7'
      - name: Fetch and hash seven official legislative documents and NAIRR resource catalog
        run: python -u research/stigler_r00/run.py
      - name: Archive public-source research records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stigler-r00-official-public-sources
          path: research/stigler_r00/results/
          if-no-files-found: warn
          retention-days: 14
