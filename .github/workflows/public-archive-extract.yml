name: Public official archive extract
on:
  push:
    branches:
      - ops/public-input-availability-261116
    paths:
      - .github/workflows/public-archive-extract.yml
      - probe/public_archive_extract.py
      - probe/sftp_download.py
      - probe/encrypt_archive_extract.py
      - probe/archive-recipient.pem
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ZIP decoder and isolated SFTP and crypto tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7zz >/dev/null 2>&1; then
            sudo apt-get install -y -qq 7zip || sudo apt-get install -y -qq p7zip-full
          fi
          python3 -m venv /tmp/public-archive-tools
          /tmp/public-archive-tools/bin/pip install --quiet cryptography==44.0.3 paramiko==3.5.1
          command -v 7z || command -v 7zz
      - name: Download and verify frozen official event source over SFTP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source output_public_archives
          /tmp/public-archive-tools/bin/python probe/sftp_download.py corevent source/corevent.zip
      - name: Select disjoint cases before opening corporate master
        shell: bash
        run: |
          set -euo pipefail
          python3 probe/public_archive_extract.py --phase select --corevent source/corevent.zip --out-dir output_public_archives
          rm source/corevent.zip
      - name: Download and verify frozen official corporate master over SFTP
        shell: bash
        run: |
          set -euo pipefail
          /tmp/public-archive-tools/bin/python probe/sftp_download.py cordata source/cordata.zip
      - name: Collect minimal master fields and seal output
        shell: bash
        run: |
          set -euo pipefail
          python3 probe/public_archive_extract.py --phase enrich --cordata source/cordata.zip --out-dir output_public_archives
          /tmp/public-archive-tools/bin/python probe/encrypt_archive_extract.py
          rm -rf output_public_archives source
      - name: Upload only encrypted research-neutral extract
        uses: actions/upload-artifact@v4
        with:
          name: sealed-public-archive-extract
          path: encrypted-extract.json
          retention-days: 3
          if-no-files-found: error
