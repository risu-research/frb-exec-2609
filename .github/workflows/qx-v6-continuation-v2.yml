    with: {N: 4096, previous_state_json: '${{ needs.f12_2048.outputs.state_json }}'}
    secrets: inherit
  f12_8192:
    needs: f12_4096
    uses: ./.github/workflows/qx-f12-level-v1.yml
    with: {N: 8192, previous_state_json: '${{ needs.f12_4096.outputs.state_json }}'}
