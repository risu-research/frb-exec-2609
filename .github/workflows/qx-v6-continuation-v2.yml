    with: {N: 1048576, previous_state_json: '${{ needs.f12_524288.outputs.state_json }}'}
    secrets: inherit

  f4_d1_completion:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {H: 1, replica: A, seed: 2026090801}
          - {H: 1, replica: A, seed: 2026090802}
          - {H: 2, replica: A, seed: 2026090801}
    env:
      PREVIOUS_STATE_JSON: '{"schema":"replaymark.s6.x86-first-complete-control.v2.f4-frontier-state.v1","streams":{"full":{"all_fail_streak":0,"closed":false},"q":{"all_fail_streak":0,"closed":false}},"barrier_valid":true}'
      S6_H: ${{ matrix.H }}
      S6_REPLICA: ${{ matrix.replica }}
      S6_SEED: ${{ matrix.seed }}
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Execute only exact V5 runnerless F4 d1 shard
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/s6-f4
          out="/tmp/s6-f4/f4-d1-H${S6_H}-${S6_REPLICA}-${S6_SEED}.json"
          (cd _src && python -m replaymark_verification.s6_campaign_f4_shard_v1 shard --d 1 --H "$S6_H" --seed "$S6_SEED" --replica "$S6_REPLICA" --previous-state-json "$PREVIOUS_STATE_JSON" --out "$out")
          rc=$?
          set -e
          if [ ! -s "$out" ]; then
            python - "$out" "$rc" <<'PY'
          import json,os,sys
          out,rc=sys.argv[1],int(sys.argv[2]); H=int(os.environ['S6_H']); seed=int(os.environ['S6_SEED']); replica=os.environ['S6_REPLICA']; previous=json.loads(os.environ['PREVIOUS_STATE_JSON'])
          spec={'family':'F4','d':1,'H':H,'B':4,'seed':seed}
          points=[{'spec':spec,'plane':plane,'status':'ORCHESTRATION_ERROR','trials':[],'stage_decomposition':None,'orchestration_returncode':rc} for plane in ('full','q')]
          record={'schema':'replaymark.s6.x86-first-complete-control.v2.f4-wave.v1','d':1,'N':256,'H':H,'seed':seed,'replica':replica,'previous_frontier_state':previous,'points':points,'orchestration_failure':True,'returncode':rc}
          open(out,'w').write(json.dumps(record,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$out" >/dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-f4-d1-H${{ matrix.H }}-${{ matrix.replica }}-${{ matrix.seed }}
          path: /tmp/s6-f4
          if-no-files-found: error

  f4_d1_barrier:
    needs: [bootstrap, f4_d1_completion]
    if: ${{ always() && needs.bootstrap.outputs.run_open_sealed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      state_json: ${{ steps.state.outputs.state_json }}
    env:
      PREVIOUS_STATE_JSON: '{"schema":"replaymark.s6.x86-first-complete-control.v2.f4-frontier-state.v1","streams":{"full":{"all_fail_streak":0,"closed":false},"q":{"all_fail_streak":0,"closed":false}},"barrier_valid":true}'
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Download 15 immutable V5 d1 shards
        shell: bash
        run: |
          set -euo pipefail
          python tools/qx_private_source.py download --sha "$SOURCE_SHA" --run-id "$SOURCE_V5_RUN_ID" --pattern 's6-f4-d1-*' --out /tmp/s6-f4-input --flatten
      - name: Download exactly 3 current completion shards
        uses: actions/download-artifact@v4
        with:
          pattern: 's6-f4-d1-*'
          path: /tmp/s6-f4-input
          merge-multiple: true
      - name: Apply unchanged frozen d1 barrier over inherited plus completion union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-f4-barrier
          (cd _src && python -m replaymark_verification.s6_campaign_f4_shard_v1 barrier --d 1 --previous-state-json "$PREVIOUS_STATE_JSON" --input-dir /tmp/s6-f4-input --out /tmp/s6-f4-barrier/f4-barrier-d1.json)
          python -m json.tool /tmp/s6-f4-barrier/f4-barrier-d1.json >/dev/null
      - name: Export exact next state
        id: state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('/tmp/s6-f4-barrier/f4-barrier-d1.json'))
          assert value['barrier_valid'] is True and value['input_record_count']==18
          print('state_json='+json.dumps(value,sort_keys=True,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s6-f4-barrier-d1
          path: /tmp/s6-f4-barrier
          if-no-files-found: error

  f4_2:
    needs: f4_d1_barrier
    uses: ./.github/workflows/qx-f4-level-v1.yml
    with: {d: 2, h_values_json: '[0,1,2,3]', previous_state_json: '${{ needs.f4_d1_barrier.outputs.state_json }}'}
    secrets: inherit
  f4_4:
    needs: f4_2
    uses: ./.github/workflows/qx-f4-level-v1.yml
    with: {d: 4, h_values_json: '[0,1,2,3,4,5]', previous_state_json: '${{ needs.f4_2.outputs.state_json }}'}
    secrets: inherit
  f4_8:
    needs: f4_4
    uses: ./.github/workflows/qx-f4-level-v1.yml
    with: {d: 8, h_values_json: '[0,1,2,4,7,8,9]', previous_state_json: '${{ needs.f4_4.outputs.state_json }}'}
    secrets: inherit
  f4_16:
    needs: f4_8
    uses: ./.github/workflows/qx-f4-level-v1.yml
    with: {d: 16, h_values_json: '[0,1,2,4,8,15,16,17]', previous_state_json: '${{ needs.f4_8.outputs.state_json }}'}
    secrets: inherit
  f4_32:
    needs: f4_16
    uses: ./.github/workflows/qx-f4-level-v1.yml
    with: {d: 32, h_values_json: '[0,1,2,4,8,16,31,32,33]', previous_state_json: '${{ needs.f4_16.outputs.state_json }}'}
    secrets: inherit

  secondary_completion:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {group: f3full, replica: B, seed: 2026090801}
          - {group: f5full, replica: B, seed: 2026090801}
          - {group: f5full, replica: B, seed: 2026090804}
          - {group: f6full, replica: B, seed: 2026090801}
    env:
      S6_GROUP: ${{ matrix.group }}
      S6_REPLICA: ${{ matrix.replica }}
      S6_SEED: ${{ matrix.seed }}
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Execute only exact V5 runnerless secondary shard
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/s6-secondary
          out="/tmp/s6-secondary/secondary-${S6_GROUP}-${S6_REPLICA}-${S6_SEED}.json"
          (cd _src && python -m replaymark_verification.s6_campaign_control_v2 secondary --group "$S6_GROUP" --replica "$S6_REPLICA" --seed "$S6_SEED" --out "$out")
          rc=$?
          set -e
          if [ ! -s "$out" ]; then
            python - "$out" "$rc" <<'PY'
          import json,os,sys
          out,rc=sys.argv[1],int(sys.argv[2]); r={'schema':'replaymark.s6.x86-first-complete-control.v2.secondary.v1','group':os.environ['S6_GROUP'],'replica':os.environ['S6_REPLICA'],'seed':int(os.environ['S6_SEED']),'points':[],'orchestration_failure':True,'returncode':rc}
          open(out,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$out" >/dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-secondary-${{ matrix.group }}-${{ matrix.replica }}-${{ matrix.seed }}
          path: /tmp/s6-secondary
          if-no-files-found: error

  generated_online:
    needs: [bootstrap, f12_1048576, f4_32, secondary_completion]
    if: ${{ always() && needs.bootstrap.outputs.run_open_sealed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: [f12, f3, f6]
        replica: [A, B]
    env:
      S6_GROUP: ${{ matrix.group }}
      S6_REPLICA: ${{ matrix.replica }}
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Download inherited V5 offline records for this group
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-online-input
          case "$S6_GROUP" in
            f12) pattern='s6-f12-N*' ;;
            f3) pattern='s6-secondary-f3full-*' ;;
            f6) pattern='s6-secondary-f6full-*' ;;
            *) exit 2 ;;
          esac
          python tools/qx_private_source.py download --sha "$SOURCE_SHA" --run-id "$SOURCE_V5_RUN_ID" --pattern "$pattern" --out /tmp/s6-online-input --flatten
      - name: Download current continuation records for this group
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.group == 'f12' && 's6-f12-N*' || matrix.group == 'f3' && 's6-secondary-f3full-*' || 's6-secondary-f6full-*' }}
          path: /tmp/s6-online-input
          merge-multiple: true
      - name: Execute unchanged generated semantic-authorization timing
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/s6-online-input /tmp/s6-online
          out="/tmp/s6-online/online-${S6_GROUP}-${S6_REPLICA}.json"
          (cd _src && python -m replaymark_verification.s6_campaign_online_v1 --group "$S6_GROUP" --replica "$S6_REPLICA" --input-root /tmp/s6-online-input --out "$out")
          rc=$?
          set -e
          if [ ! -s "$out" ]; then
            python - "$out" "$rc" <<'PY'
          import json,os,sys
          out,rc=sys.argv[1],int(sys.argv[2]); r={'schema':'replaymark.s6.x86-generated-online.v1','group':os.environ['S6_GROUP'],'replica':os.environ['S6_REPLICA'],'qualified_full_contract_specs_seen':0,'condition_records':[],'setup_errors':[{'error':'top-level orchestration failure','returncode':rc}],'all_qualified_specs_measured':False}
          open(out,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$out" >/dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-online-${{ matrix.group }}-${{ matrix.replica }}
          path: /tmp/s6-online
          if-no-files-found: error

  e3b_budget:
    needs: [bootstrap, generated_online]
    if: ${{ always() && needs.bootstrap.outputs.run_open_sealed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {replica: [A, B]}
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Install exact frozen E3b dependency before any timing
        shell: bash
        run: |
          set -euo pipefail
          cd _src
          test "$(git hash-object agentmark_e3b_lab/e3_mqtt/app/requirements.txt)" = '96a27161c71b126522a8cfafbf303a0501ae694a'
          python -m pip install --disable-pip-version-check --no-deps -r agentmark_e3b_lab/e3_mqtt/app/requirements.txt
          python - <<'PY'
          import importlib.metadata as md
          import paho.mqtt.client as mqtt
          assert md.version('paho-mqtt')=='2.1.0' and hasattr(mqtt,'CallbackAPIVersion')
          PY
      - name: Execute exact immutable-corpus E3b production budget
        shell: bash
        run: |
          mkdir -p /tmp/s6-e3b
          cd _src
          python agentmark_e3b_lab/e3_mqtt/app/s6_campaign_e3b_budget_v1.py --replica "${{ matrix.replica }}" --out "/tmp/s6-e3b/e3b-${{ matrix.replica }}.json"
          python -m json.tool "/tmp/s6-e3b/e3b-${{ matrix.replica }}.json" >/dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 's6-e3b-budget-${{ matrix.replica }}', path: /tmp/s6-e3b, if-no-files-found: error}

  anchors:
    needs: [bootstrap, e3b_budget]
    if: ${{ always() && needs.bootstrap.outputs.run_open_sealed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {replica: [A, B]}
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
      S6_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Install exact frozen E3b dependency before anchor timing
        shell: bash
        run: |
          set -euo pipefail
          cd _src
          python -m pip install --disable-pip-version-check --no-deps -r agentmark_e3b_lab/e3_mqtt/app/requirements.txt
          python - <<'PY'
          import importlib.metadata as md
          assert md.version('paho-mqtt')=='2.1.0'
          PY
      - name: Execute mandatory preexisting real-controller anchors
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/s6-anchors
          out="/tmp/s6-anchors/anchors-${S6_REPLICA}.json"
          (cd _src && python -m replaymark_verification.s6_campaign_anchors_v1 performance --replica "$S6_REPLICA" --out "$out")
          rc=$?
          set -e
          if [ ! -s "$out" ]; then
            python - "$out" "$rc" <<'PY'
          import json,os,sys
          out,rc=sys.argv[1],int(sys.argv[2]); r={'schema':'replaymark.s6.real-controller-anchors.v1','status':'EXECUTION_FAILURE','replica':os.environ.get('S6_REPLICA','unknown'),'anchors':{},'orchestration_failure':True,'returncode':rc}
          open(out,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          fi
          python -m json.tool "$out" >/dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 's6-anchors-${{ matrix.replica }}', path: /tmp/s6-anchors, if-no-files-found: error}

  aggregate:
    needs: [bootstrap, anchors]
    if: ${{ always() && needs.bootstrap.outputs.run_open_sealed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Download immutable V5 source artifacts
        shell: bash
        run: |
          set -euo pipefail
          python tools/qx_private_source.py download --sha "$SOURCE_SHA" --run-id "$SOURCE_V5_RUN_ID" --pattern 's6-*' --out /tmp/s6-source-all
      - name: Download every current-run V6 artifact
        uses: actions/download-artifact@v4
        with: {pattern: 's6-*', path: /tmp/s6-current-all}
      - name: Construct duplicate-free scientific raw union
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          out=Path('/tmp/s6-authority/raw'); out.mkdir(parents=True,exist_ok=True)
          allowed_source=('s6-f12-','s6-f4-','s6-secondary-')
          allowed_current=('s6-f12-','s6-f4-','s6-secondary-','s6-online-','s6-e3b-budget-','s6-anchors-')
          copied=[]
          for root,prefixes in [(Path('/tmp/s6-source-all'),allowed_source),(Path('/tmp/s6-current-all'),allowed_current)]:
              for d in sorted(p for p in root.iterdir() if p.is_dir() and p.name.startswith(prefixes)):
                  dst=out/d.name
                  if dst.exists(): raise RuntimeError('duplicate artifact identity in V5/V6 union: '+d.name)
                  shutil.copytree(d,dst); copied.append(d.name)
          assert copied
          print('QX_S6_V6_V2_RAW_UNION_ARTIFACT_DIRS',len(copied))
          PY
      - name: Copy sealed continuation provenance outside scientific scan root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-authority/provenance
          cp -a /tmp/s6-current-all/s6-v6-continuation-provenance/. /tmp/s6-authority/provenance/
          test -s /tmp/s6-authority/provenance/S6_V6_CONTINUATION_PROVENANCE.json
          test -s /tmp/s6-authority/provenance/RUN_OPEN.json
      - name: Independently aggregate unchanged science plus provenance binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-authority/aggregate
          (cd _src && python -m replaymark_verification.s6_campaign_aggregate_protocol_v4 aggregate \
            --input-root /tmp/s6-authority/raw \
            --continuation-provenance /tmp/s6-authority/provenance/S6_V6_CONTINUATION_PROVENANCE.json \
            --out /tmp/s6-authority/aggregate/S6_X86_FIRST_COMPLETE_AGGREGATE_V1.json)
          python -m json.tool /tmp/s6-authority/aggregate/S6_X86_FIRST_COMPLETE_AGGREGATE_V1.json >/dev/null
          sha256sum /tmp/s6-authority/aggregate/S6_X86_FIRST_COMPLETE_AGGREGATE_V1.json > /tmp/s6-authority/aggregate/S6_X86_FIRST_COMPLETE_AGGREGATE_V1.sha256
      - name: Upload authority before interpretation
        uses: actions/upload-artifact@v4
        with:
          name: replaymark-s6-x86-first-complete-authority-v6-public-substrate-v2
          path: /tmp/s6-authority
          if-no-files-found: error

  enforce:
    needs: [bootstrap, aggregate]
    if: ${{ always() && needs.bootstrap.outputs.run_open_sealed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind exact frozen private source
        run: python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
      - name: Download already-uploaded immutable authority
        uses: actions/download-artifact@v4
        with: {name: replaymark-s6-x86-first-complete-authority-v6-public-substrate-v2, path: /tmp/s6-sealed-authority}
      - name: Enforce preregistered interpretations only after sealing
        shell: bash
        run: |
          set -euo pipefail
          authority=/tmp/s6-sealed-authority/aggregate/S6_X86_FIRST_COMPLETE_AGGREGATE_V1.json
          test -s "$authority"
          mkdir -p /tmp/s6-enforcement
          (cd _src && python -m replaymark_verification.s6_campaign_aggregate_protocol_v4 enforce --authority "$authority" --out /tmp/s6-enforcement/S6_X86_FIRST_COMPLETE_ENFORCEMENT_V1.json)
          python -m json.tool /tmp/s6-enforcement/S6_X86_FIRST_COMPLETE_ENFORCEMENT_V1.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: replaymark-s6-x86-first-complete-enforcement-v6-public-substrate-v2
          path: /tmp/s6-enforcement
          if-no-files-found: error
