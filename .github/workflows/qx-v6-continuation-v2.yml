name: qx ReplayMark S6 V6 continuation v2

on:
  push:
    branches:
      - qx-run-v2

permissions:
  actions: read
  contents: read

concurrency:
  group: qx-replaymark-s6-v6-first-complete-authority-v2
  cancel-in-progress: false

env:
  SOURCE_SHA: b5d40b10e5741b493edcfceb2d5c98e43de6d56d
  SOURCE_V5_RUN_ID: '34289543842'
  SOURCE_V5_SHA: 35b57a9b70f94f430db73b50088565570b027dc8

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      f12_state_json: ${{ steps.f12state.outputs.state_json }}
      run_open_sealed: ${{ steps.open_sealed.outputs.run_open_sealed }}
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require immutable v2 launch ref and same-SHA v2 static authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qx-run-v2'
          python -m json.tool authority/QX_V6_TRANSPORT_AND_OPEN_REPAIR_V2.json >/dev/null
          python -m json.tool authority/QX_V6_PUBLIC_RUN_V1_QUARANTINE.json >/dev/null
          python -m json.tool authority/QX_V6_HARNESS_MANIFEST_V2.json >/dev/null
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" \
            -o /tmp/qx-static-runs.json
          python - <<'PY'
          import json,os
          runs=json.load(open('/tmp/qx-static-runs.json'))['workflow_runs']
          ok=False
          for r in runs:
              if (r.get('path')=='.github/workflows/qx-v6-harness-static-v2.yml'
                  and r.get('head_branch')=='qx-static-v2'
                  and r.get('head_sha')==os.environ['GITHUB_SHA']
                  and r.get('conclusion')=='success'):
                  ok=True
          assert ok, 'same-SHA qx v2 static authority missing'
          print('QX_V6_V2_SAME_SHA_STATIC_AUTHORITY: PASS')
          PY

      - name: Bind exact frozen private source and prove frozen identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/qx_private_source.py clone --sha "$SOURCE_SHA" --dest _src
          cd _src
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('replaymark/S6_X86_FIRST_COMPLETE_EXECUTION_V6.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert head=='b5d40b10e5741b493edcfceb2d5c98e43de6d56d'
          assert parent==m['parent_commit']=='35b57a9b70f94f430db73b50088565570b027dc8'
          changed=sorted(subprocess.check_output(['git','diff','--name-only',parent,head],text=True).splitlines())
          assert changed==sorted(m['expected_delta_paths']) and len(changed)==7
          v5=json.loads(Path('replaymark/S6_X86_FIRST_COMPLETE_EXECUTION_V5.json').read_text())
          for category in ('frozen_authority_blobs','orchestration_blobs'):
              for path,want in v5[category].items():
                  got=subprocess.check_output(['git','hash-object',path],text=True).strip()
                  assert got==want,(category,path,got,want)
          for path,want in m['new_v6_blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==want,(path,got,want)
          print('QX_V6_V2_EXACT_PRIVATE_SCIENCE_IDENTITY: PASS')
          PY

      - name: Snapshot exact immutable V5 metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-v6-provenance/meta
          python tools/qx_private_source.py snapshot \
            --sha "$SOURCE_SHA" \
            --run-id "$SOURCE_V5_RUN_ID" \
            --out /tmp/s6-v6-provenance/meta

      - name: Download all 54 prospectively eligible V5 artifacts through repaired transport
        shell: bash
        run: |
          set -euo pipefail
          python tools/qx_private_source.py download \
            --sha "$SOURCE_SHA" \
            --run-id "$SOURCE_V5_RUN_ID" \
            --pattern 's6-f12-*' \
            --pattern 's6-f4-*' \
            --pattern 's6-secondary-*' \
            --out /tmp/s6-v5-source \
            --manifest /tmp/s6-v6-provenance/meta/source-artifact-download-manifest.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/s6-v6-provenance/meta/source-artifact-download-manifest.json'))
          assert len(rows)==54, len(rows)
          assert len({r['name'] for r in rows})==54
          assert all(r['source_token_forwarded_to_redirect'] is False for r in rows)
          assert all(len(r['downloaded_zip_sha256'])==64 for r in rows)
          for r in rows:
              d=r.get('github_digest')
              if d:
                  assert d.lower()==('sha256:'+r['downloaded_zip_sha256']).lower(), r['name']
          print('QX_V6_V2_ALL_54_ARTIFACT_BYTES_BOUND: PASS')
          PY

      - name: Validate deterministic V5 inheritance without timing-value selection
        shell: bash
        run: |
          set -euo pipefail
          (cd _src && python -m replaymark_verification.s6_campaign_continuation_v1 validate-source \
            --source-root /tmp/s6-v5-source \
            --run-json /tmp/s6-v6-provenance/meta/run.json \
            --jobs-json /tmp/s6-v6-provenance/meta/jobs-page1.json \
            --jobs-json /tmp/s6-v6-provenance/meta/jobs-page2.json \
            --artifacts-json /tmp/s6-v6-provenance/meta/artifacts.json \
            --out /tmp/s6-v6-provenance/S6_V6_CONTINUATION_PROVENANCE.json)
          python -m json.tool /tmp/s6-v6-provenance/S6_V6_CONTINUATION_PROVENANCE.json >/dev/null

      - name: Export immutable inherited N32 frontier state
        id: f12state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/s6-v6-provenance/S6_V6_CONTINUATION_PROVENANCE.json'))
          state=p['inherited_f12_N32_frontier_state']
          assert state['barrier_valid'] is True and state['N']==32
          print('state_json='+json.dumps(state,sort_keys=True,separators=(',',':')))
          PY

      - name: Recheck exact frozen E3b dependency and corpus without performance clocks
        shell: bash
        run: |
          set -euo pipefail
          cd _src
          test "$(git hash-object agentmark_e3b_lab/e3_mqtt/app/requirements.txt)" = '96a27161c71b126522a8cfafbf303a0501ae694a'
          python -m pip install --disable-pip-version-check --no-deps -r agentmark_e3b_lab/e3_mqtt/app/requirements.txt
          python - <<'PY'
          import importlib.metadata as md,sys
          from pathlib import Path
          root=Path('.').resolve(); app=root/'agentmark_e3b_lab'/'e3_mqtt'/'app'
          for p in (root,root/'agentmark_e3b_lab',app):
              if str(p) not in sys.path: sys.path.insert(0,str(p))
          import s6_campaign_e3b_budget_v1 as b
          from replaymark_shadow import compile_e3b_r1_shadow_contract
          assert md.version('paho-mqtt')=='2.1.0'
          corpus,_=b._load_frozen_corpus(); contract=compile_e3b_r1_shadow_contract()
          assert contract.fingerprint()==corpus['acquisition_identity']['contract_fingerprint']
          assert b._independent_requalification(contract,corpus)['cases_checked']==128
          print('QX_V6_V2_FINAL_NO_CLOCK_GATE: PASS')
          PY

      - name: Record v2 performance opening boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s6-v6-provenance/substrate
          cp authority/QX_V6_EXECUTION_SUBSTRATE_V1.json /tmp/s6-v6-provenance/substrate/
          cp authority/QX_V6_HARNESS_MANIFEST_V2.json /tmp/s6-v6-provenance/substrate/
          cp authority/QX_V6_TRANSPORT_AND_OPEN_REPAIR_V2.json /tmp/s6-v6-provenance/substrate/
          cp authority/QX_V6_PUBLIC_RUN_V1_QUARANTINE.json /tmp/s6-v6-provenance/substrate/
          python - <<'PY'
          import json,os
          r={
            'schema':'replaymark.s6.x86-first-complete-v6-continuation-run-open.v2',
            'status':'V6_CONTINUATION_V2_PERFORMANCE_OPEN_AFTER_FULL_54_ARTIFACT_STATIC_AND_RUNTIME_VALIDATION',
            'source_head':'b5d40b10e5741b493edcfceb2d5c98e43de6d56d',
            'public_harness_head':os.environ['GITHUB_SHA'],
            'public_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_v5_run_id':34289543842,
            'source_v5_sha':'35b57a9b70f94f430db73b50088565570b027dc8',
            'quarantined_qx_run_v1_id':34366933489,
            'source_valid_records_rerun':False,
            'selection_by_performance_value':False,
            'protocol_or_threshold_change':False,
            'runnerless_records_promoted_to_resource_failure':False,
            'scientific_code_changed_for_substrate':False,
            'transport_only_and_fail_closed_orchestration_repair':True
          }
          open('/tmp/s6-v6-provenance/RUN_OPEN.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - name: Seal continuation provenance and RUN_OPEN before any new performance
        uses: actions/upload-artifact@v4
        with:
          name: s6-v6-continuation-provenance
          path: /tmp/s6-v6-provenance
          if-no-files-found: error

      - name: Mark sealed opening as sole downstream performance admission token
        id: open_sealed
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/s6-v6-provenance/RUN_OPEN.json
          echo 'run_open_sealed=true' >> "$GITHUB_OUTPUT"

  f12_64:
    needs: bootstrap
    uses: ./.github/workflows/qx-f12-level-v1.yml
    with:
      N: 64
      previous_state_json: '${{ needs.bootstrap.outputs.f12_state_json }}'
    secrets: inherit
  f12_128:
    needs: f12_64
    uses: ./.github/workflows/qx-f12-level-v1.yml
    with: {N: 128, previous_state_json: '${{ needs.f12_64.outputs.state_json }}'}
    secrets: inherit
  f12_256:
    needs: f12_128
    uses: ./.github/workflows/qx-f12-level-v1.yml
    with: {N: 256, previous_state_json: '${{ needs.f12_128.outputs.state_json }}'}
    secrets: inherit
  f12_512:
    needs: f12_256
    uses: ./.github/workflows/qx-f12-level-v1.yml
    with: {N: 512, previous_state_json: '${{ needs.f12_256.outputs.state_json }}'}
    secrets: inherit
  f12_1024:
