name: HCII Yambda Stage6 fixed-coverage comparison
on:
  push:
    branches:
      - run/hcii-yambda-matched-20261009
    paths:
      - hcii_yambda/stage6_risk_coverage.py
      - .github/workflows/hcii-yambda-stage6-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install duckdb==1.4.0 requests==2.32.3
      - name: Run risk coverage audit
        run: python hcii_yambda/stage6_risk_coverage.py
      - name: Archive aggregate outputs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcii-yambda-risk-coverage
          path: hcii_yambda/results_stage6/
          retention-days: 10
