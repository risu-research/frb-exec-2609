      - name: Archive encrypted transport part 08
        if: ${{ hashFiles('chunks/sealed.part08') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: risuap-v032-${{ matrix.label }}-part08
          path: chunks/sealed.part08
          retention-days: 7
          if-no-files-found: error
      - name: Archive encrypted transport part 09
        if: ${{ hashFiles('chunks/sealed.part09') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: risuap-v032-${{ matrix.label }}-part09
          path: chunks/sealed.part09
          retention-days: 7
          if-no-files-found: error
