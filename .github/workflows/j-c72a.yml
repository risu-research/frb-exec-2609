name: j-c72a
on:
  push:
    branches: [x-2602-b1]
    paths:
      - 'jobs/j-c72a.py'
      - '.github/workflows/j-c72a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python jobs/j-c72a.py
      - if: always()
        run: |
          if compgen -G 'out4/*' > /dev/null; then sha256sum out4/* | tee out4/SHA256SUMS.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j-c72a-out
          path: out4/
          if-no-files-found: warn
          retention-days: 7
