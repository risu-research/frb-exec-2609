name: j-4c9g
on:
  push:
    branches: [run/j-4c9g]
    paths:
      - 'runs/j-4c9g/**'
      - '.github/workflows/j-4c9g.yml'
permissions:
  contents: read
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  DATASETS_DISABLE_PROGRESS_BARS: '1'
  TARGET_N: '600'
  MIN_N: '500'
  MAX_DEMOS: '99'
  MAX_PER_DEMO: '12'
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'datasets>=3,<5' 'huggingface_hub>=0.28,<1' 'pandas>=2,<3' 'pillow>=10,<13' 'ImageHash>=4.3,<5' 'numpy>=1.26,<3' 'requests>=2.32,<3'
      - name: Run candidate-panel pilot
        run: python runs/j-4c9g/pilot.py
      - name: Upload aggregate outputs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j-4c9g-aggregate
          path: out/
          if-no-files-found: warn
          retention-days: 7
