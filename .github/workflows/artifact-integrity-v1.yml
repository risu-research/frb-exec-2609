name: artifact-integrity-v1

on:
  push:
    branches:
      - artifact-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify non-authority integrity bundle
        run: python artifact/verify_bundle.py
