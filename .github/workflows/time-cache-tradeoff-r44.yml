name: Time discount versus cache continuity R44
on:
  push:
    branches: [experiment/continuation-cache-audit-20261123]
    paths: ['.github/workflows/time-cache-tradeoff-r44.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub==0.36.0' 'pyarrow==21.0.0' 'numpy==2.2.6'
      - name: Replay actual warm continuations at next offpeak boundary
        run: |
          cat > expected.json <<'JSON'
          {"2026-08-09_2026-08-15":{"sha256":"cb11c50b6dc9f35d8cff5385768a77c8618c3aff03113f28e7ac8c17a5ffbae7","requests":163970},"2026-08-16_2026-08-22":{"sha256":"b707132fd02d13cd9ac3570990eea566933344d308990e6669ae4f686ddc9856","requests":144227},"2026-08-23_2026-08-29":{"sha256":"27bd0ad8367a4176d5bff29e88820ccc0cda814f882a3c05ecc99da08931d23f","requests":159925},"2026-08-30_2026-09-05":{"sha256":"e8f4f987f00442348ac09b1d6dc8865cf3dde299944423d54402f620244d3a6a","requests":190544}}
          JSON
          cat > audit.py <<'PY'
          import pathlib,json,hashlib,collections as C,statistics as S,tempfile,datetime as dt
          import numpy as np
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REV="bb26cf72c9c20f2b05f765d88548156a74d3c253";REPO="harvardMadsys/freeinference_agentic_trace"
          EXP=json.loads(pathlib.Path("expected.json").read_text())
          UTC=dt.timezone.utc;DAY=86400000;HOUR=3600000
          CUT=int(dt.datetime(2026,8,16,16,tzinfo=UTC).timestamp()*1000)
          WEEKEND=int(dt.datetime(2026,8,22,16,tzinfo=UTC).timestamp()*1000)
          # Integer units of 0.1 nano-USD, R43 tariff. Half-price costs exact.
          def cost(r):return (r["prompt_tokens"]-r["cache_read_tokens"])*4400+r["cache_read_tokens"]*140+r["completion_tokens"]*13200
          def valid(r):
              p,c,o=r["prompt_tokens"],r["cache_read_tokens"],r["completion_tokens"]
              return p is not None and c is not None and o is not None and p>0 and 0<=c<=p and o>=0 and r["start_ms"] is not None and r["end_ms"] is not None and r["end_ms"]>=r["start_ms"] and bool(r["provider"])
          def peak(t,cal):
              h=t%DAY;w=dt.datetime.fromtimestamp(t/1000,UTC).weekday()
              return (HOUR<=h<4*HOUR or 6*HOUR<=h<10*HOUR) and (cal=="daily" or t<WEEKEND or w<5)
          def factor(t,cal):return 2 if peak(t,cal) else 1
          def delay(t,cal):
              assert peak(t,cal)
              return (4*HOUR if t%DAY<4*HOUR else 10*HOUR)-t%DAY
          def q(a):
              if not a:return {}
              return dict(n=len(a),mean=S.fmean(a),median=S.median(a),p10=float(np.quantile(a,.1)),p90=float(np.quantile(a,.9)))
          gaps=[1,5,15,60,300,900,1800,3600,7200,14400,28800,86400]
          def gapbin(t):return str(next((g for g in gaps if t<=g*1000),999999))
          def adj(a,b):return a["session_id"]==b["session_id"] and b["step"]==a["step"]+1 and a["model"]==b["model"] and a["provider"]==b["provider"] and b["start_ms"]>=a["end_ms"]
          gapstats=C.defaultdict(C.Counter);coverage=C.Counter();results=C.defaultdict(C.Counter);values=C.defaultdict(lambda:C.defaultdict(list));weeks=[]
          def record(key,seq,shift,cal,gap):
              base=sum(cost(r)*factor(r["start_ms"],cal)//2 for r in seq)
              later=sum(cost(r)*factor(r["start_ms"]+shift,cal)//2 for r in seq)
              penalty=seq[0]["cache_read_tokens"]*4260*factor(seq[0]["start_ms"]+shift,cal)//2
              assert penalty>=0
              c=results[key];c["n"]+=1;c["now_units"]+=base;c["later_warm_units"]+=later;c["later_loss_units"]+=later+penalty
              c["warm_saves"]+=int(later<base);c["loss_costlier"]+=int(later+penalty>base)
              c["reversal"]+=int(later<base<later+penalty)
              c["loss_saves"]+=int(later+penalty<base)
              c["flat_reference_extra_units"]+=seq[0]["cache_read_tokens"]*4260
              c["flat_reference_costlier"]+=int(penalty>0)
              c["crosses_day"]+=int(any((r["start_ms"]+shift)//DAY!=r["start_ms"]//DAY for r in seq))
              v=values[key];v["wait_minutes"].append(shift/60000);v["extra_gap_minutes"].append((gap+shift)/60000);v["now_usd"].append(base/1e10);v["warm_saving_usd"].append((base-later)/1e10);v["loss_extra_usd"].append((later+penalty-base)/1e10)
              if later<base and penalty>0:v["break_even_loss_fraction"].append((base-later)/penalty)
              for p in (.01,.05,.1,.25,.5,1.):
                  c["expected_costlier_"+str(p)]+=int(later+p*penalty>base+1e-6)
              # Flat-rate customer entitlement has no time discount, even if upstream saves.
              c["upstream_saves_customer_extra_full"]+=int(later+penalty<base and penalty>0)
          for week,e in EXP.items():
              wc=C.Counter();prev=None;seg=[];seen=set()
              def close():
                  if len(seg)<2:return
                  for i in range(1,len(seg)):
                      a,b=seg[i-1:i+1];t=b["start_ms"];gap=t-a["end_ms"]
                      if t<CUT or a["cache_read_tokens"]*10<a["prompt_tokens"]*9 or b["transition"]!="append":continue
                      gb=gapbin(gap);c=gapstats[(gb,b["step_trigger"] or "unknown")];c["n"]+=1
                      c["zero"]+=int(b["cache_read_tokens"]==0);c["severe"]+=int(a["cache_read_tokens"]/a["prompt_tokens"]-b["cache_read_tokens"]/b["prompt_tokens"]>.5)
                      c["high"]+=int(b["cache_read_tokens"]*10>=b["prompt_tokens"]*9)
                      c["cached"]+=b["cache_read_tokens"];c["prompt"]+=b["prompt_tokens"]
                      # observed warm requests only; compare a delayed replay conditional on first-request loss.
                      if b["cache_read_tokens"]*10<b["prompt_tokens"]*9:continue
                      for cal in ("daily","weekend"):
                          if not peak(t,cal):continue
                          shift=delay(t,cal)
                          for H in (1,5,20):
                              if i+H>len(seg):continue
                              seq=seg[i:i+H]
                              if any(x["start_ms"]//DAY!=t//DAY or (x["end_ms"]+shift)//DAY!=t//DAY for x in seq):continue
                              # common horizon cohort separate from all eligible H.
                              keys=[(cal,str(H),"all")]
                              if i+20<=len(seg) and all(x["start_ms"]//DAY==t//DAY and (x["end_ms"]+shift)//DAY==t//DAY for x in seg[i:i+20]):keys.append((cal,str(H),"common20"))
                              sk=(cal,H,b["session_id"],t//DAY)
                              if sk not in seen:seen.add(sk);keys.append((cal,str(H),"first_session_day"))
                              for k in keys:record(k,seq,shift,cal,gap)
              with tempfile.TemporaryDirectory() as td:
                  f=hf_hub_download(REPO,f"release/{week}/processed/requests.parquet",repo_type="dataset",revision=REV,cache_dir=td)
                  with open(f,"rb") as v:assert hashlib.file_digest(v,"sha256").hexdigest()==e["sha256"]
                  pf=pq.ParquetFile(f);assert pf.metadata.num_rows==e["requests"]
                  for batch in pf.iter_batches(batch_size=8192,columns="session_id step model provider prompt_tokens cache_read_tokens completion_tokens start_ms end_ms step_trigger transition".split()):
                      for r in batch.to_pylist():
                          wc["requests"]+=1
                          ok=r["model"]=="deepseek-v4-flash" and valid(r)
                          if ok:wc["valid_target"]+=1
                          if not ok or not seg or not adj(seg[-1],r):
                              close();seg=[]
                          if ok:seg.append(r)
                  close()
              assert wc["requests"]==e["requests"];coverage.update(wc);weeks.append(dict(week=week,sha=e["sha256"],counts=wc));print("WEEK",week,json.dumps(wc),flush=True)
          out=dict(coverage=coverage,weeks=weeks,gaps=[dict(bin_seconds=k[0],trigger=k[1],counts=v) for k,v in sorted(gapstats.items())],scenarios=[dict(calendar=k[0],horizon=k[1],cohort=k[2],counts=v,stats={a:q(b) for a,b in values[k].items()}) for k,v in sorted(results.items())],limitations=["Historical DeepSeek first-party reference rates; actual anonymous route prices/expiry unknown.","Same-route append label is structural evidence not actual cache key. Gap survival descriptive conditional on previous high hit, no causal extrapolation to delayed requests.","Replay shifts observed sequential requests by same delay to next offpeak boundary, holds future token counts and gaps fixed, excludes UTC day crossing. First request only loss, later observed cache assumed restored. Not actual customer scheduling or latency valuation.","All anchor results overlap; first per session-day is a sensitivity, not independent account observations.","Full loss, partial loss and expected loss probabilities are scenarios. Fixed internal peak accounting implies no time discount; reference debit not real money."])
          print("R44",json.dumps(out),flush=True)
          pathlib.Path("r44-results").mkdir(exist_ok=True);pathlib.Path("r44-results/results.json").write_text(json.dumps(out,indent=2))
          
          PY
          python audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-cache-tradeoff-r44
          path: r44-results/
          retention-days: 14
