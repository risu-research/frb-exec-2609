name: RISUAP v038 NY historical name wave06 exact edition
on:
  push:
    branches:
      - ops/public-input-availability-261116
    paths:
      - .github/workflows/risuap-v038-fullnames-wave06.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: name_20080216_20081001
            start: "2008-02-16"
            end: "2008-10-01"
            expected: 94448
          - label: name_20081001_20090517
            start: "2008-10-01"
            end: "2009-05-17"
            expected: 84997
          - label: name_20090517_20100101
            start: "2009-05-17"
            end: "2010-01-01"
            expected: 83738
          - label: name_20100101_20100817
            start: "2010-01-01"
            end: "2010-08-17"
            expected: 91478
          - label: name_20100817_20110402
            start: "2010-08-17"
            end: "2011-04-02"
            expected: 91746
          - label: name_20110402_20111116
            start: "2011-04-02"
            end: "2011-11-16"
            expected: 90073
          - label: name_20111116_20120309
            start: "2011-11-16"
            end: "2012-03-09"
            expected: 48609
          - label: name_20120309_20120702
            start: "2012-03-09"
            end: "2012-07-02"
            expected: 52074
          - label: name_20120702_20130215
            start: "2012-07-02"
            end: "2013-02-15"
            expected: 96238
          - label: name_20130215_20130609
            start: "2013-02-15"
            end: "2013-06-09"
            expected: 54568
          - label: name_20130609_20131001
            start: "2013-06-09"
            end: "2013-10-01"
            expected: 51232
          - label: name_20131001_20140123
            start: "2013-10-01"
            end: "2014-01-23"
            expected: 52271
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private-recipient authenticated source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/risuap-v038
          /tmp/risuap-v038/bin/pip install --quiet cryptography==44.0.3
          openssl pkey -pubin -in probe/v032-recipient.pem -noout
      - name: Retrieve complete pinned official date range and independently check edition
        shell: bash
        run: |
          set -euo pipefail
          /tmp/risuap-v038/bin/python probe/risuap_v038_name_full_ingest.py \
            --label "${{ matrix.label }}" --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --expected "${{ matrix.expected }}" --rows-epoch 1794948547 --metadata-epoch 1794945028 \
            --max-rows 100000 --limit 10000 --out source_data
          cp source_data/manifest.json source-receipt.json
      - name: Encrypt archive for owner only and remove runner plaintext
        shell: bash
        run: |
          set -euo pipefail
          /tmp/risuap-v038/bin/python probe/seal_private_v031.py \
            --source source_data --recipient probe/v032-recipient.pem --out sealed-source.json
          rm -rf source_data
          python3 probe/v032_cipher_chunks.py --sealed sealed-source.json --label "${{ matrix.label }}" --out chunks
          rm sealed-source.json
      - name: Upload only source count/vintage and encryption receipts
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-receipts
          path: |
            source-receipt.json
            chunks/transport-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload ciphertext part00
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-part00
          path: chunks/sealed.part00
          retention-days: 7
          if-no-files-found: error
      - name: Upload ciphertext part01 if present
        if: ${{ hashFiles('chunks/sealed.part01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-part01
          path: chunks/sealed.part01
          retention-days: 7
