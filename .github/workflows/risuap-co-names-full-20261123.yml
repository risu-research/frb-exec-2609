name: CO full corporate name source (encrypted)
on:
  push:
    paths:
      - '.github/workflows/risuap-co-names-full-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  name_source_capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public script only
        uses: actions/checkout@v4
      - name: Install independent encryption library
        run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - name: Fetch and freeze one official Colorado source edition
        run: python co_name_collect.py "${{ runner.temp }}/public_artifact" risuap-co-names-20261123.pub.pem "${{ runner.temp }}/owner_plaintext"
      - name: Upload encrypted-only output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: co-official-name-20261123-encrypted
          path: ${{ runner.temp }}/public_artifact/
          if-no-files-found: error
          retention-days: 3