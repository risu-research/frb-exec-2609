name: j-810a8a82-rel-judge
on:
  push:
    branches: ["exec/j-810a8a82"]
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: judge-generated-semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.34.0-rc2
          git clone -q https://github.com/leanprover/comparator.git /tmp/comparator
          git -C /tmp/comparator checkout -q 2312244ac716564a61cc0bf4e107d9abf1757a61
          (cd /tmp/comparator && lake build lean4export comparator)
          git clone -q https://github.com/ammkrn/nanoda_lib.git /tmp/nanoda
          git -C /tmp/nanoda checkout -q 4c544ed4099c8227f07d5de77ad1e69fb0740a27
          (cd /tmp/nanoda && cargo build --release --bin nanoda_bin)
          git clone -q https://github.com/Zouuup/landrun.git /tmp/landrun-src
          git -C /tmp/landrun-src checkout -q 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd /tmp/landrun-src && go build -o /tmp/landrun ./cmd/landrun/main.go)
          cd jobs/j-4b2c82ad
          test "$(sha256sum source_a05.json | cut -d' ' -f1)" = ab3b7afc2634bdd6f2939355e7d47e355ae2bd06a99bae84b00bf3b8a3746736
          python qualify_emitters.py
          python translation_gate.py
          python relational_adapter.py
          python roundtrip_check.py source_a05.json typed_ir.json
          echo leanprover/lean4:v4.34.0-rc2 > lean-toolchain
          rm -rf .lake lake-manifest.json
          export COMPARATOR_LANDRUN=/tmp/landrun
          export COMPARATOR_LEAN4EXPORT=/tmp/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          export COMPARATOR_NANODA=/tmp/nanoda/target/release/nanoda_bin
          lake env /tmp/comparator/.lake/build/bin/comparator comparator_generated.json
