name: Public archive transport preflight
on:
  push:
    branches:
      - ops/public-input-availability-261116
    paths:
      - .github/workflows/public-archive-transport.yml
      - probe/public_archive_transport.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test official public transport
        run: python3 probe/public_archive_transport.py
      - name: Preserve transport-only observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-archive-transport
          path: public_transport_probe.json
          if-no-files-found: warn
