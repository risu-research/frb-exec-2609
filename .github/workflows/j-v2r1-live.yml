name: j-v2r1-live
on:
  push:
    branches: ["exec/j-v2r1-live"]
permissions:
  contents: read
  actions: read
jobs:
  resume:
    runs-on: ubuntu-24.04
    env:
      V2R1_PRIVATE_COMMIT: 62178b903cde255eac70a7731eb6d911edca0a9b
    steps:
      - name: checkout execution substrate
        uses: actions/checkout@v4
      - name: checkout sealed V2R1 authority
        uses: actions/checkout@v4
        with:
          repository: risu-research/consequence-drift
          ref: 62178b903cde255eac70a7731eb6d911edca0a9b
          token: ${{ secrets.RISU_PRIVATE_READ_TOKEN }}
          path: scientific
          persist-credentials: false
      - name: verify exact V2R1 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C scientific rev-parse HEAD)" = "$V2R1_PRIVATE_COMMIT"
          test "$(git -C scientific hash-object protocol/V2R1_RESUME_SEED.json)" = "6ddfb6c81f978e377cba54a484138c1c9d9714e0"
          test "$(git -C scientific hash-object runner/v2_resume_verify.py)" = "e21fc310d254914673b34cca9c711f3a58488b15"
          test "$(git -C scientific hash-object runner/v2_resume_driver.py)" = "225b9763e73096e75cbfcd0293a8190dee536501"
          test "$(git -C scientific hash-object protocol/V2R1_RESUME_LOCK.json)" = "5be44506cbeee9445288a548e7c5fd3a6852dc9b"
      - name: recover exact prior checkpoint
        uses: actions/download-artifact@v4
        with:
          name: j-v2-science-evidence
          path: source
          github-token: ${{ github.token }}
          repository: risu-research/frb-exec-2609
          run-id: 34735214661
      - name: verify and import checkpoint
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/scientific/runner:$GITHUB_WORKSPACE/scientific/evaluator"
          python - <<'PY'
          import json
          from pathlib import Path
          from v2_resume_verify import verify_source
          from v2_resume_driver import import_checkpoint
          root=Path('scientific'); source=Path('source'); out=Path('v2r1-output')
          print(json.dumps(verify_source(root, source), sort_keys=True, separators=(',', ':')))
          p=import_checkpoint(repo_root=root, source_root=source, output_root=out)
          print(p.read_text())
          assert (out/'results/v2-excluded-p0.json').is_file()
          assert not (out/'results/v2-excluded-p1.json').exists()
          assert not (out/'results/v2-excluded-p2.json').exists()
          PY
      - name: resume gate
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/scientific/runner:$GITHUB_WORKSPACE/scientific/evaluator"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from v2_resume_driver import resume_live
          r=resume_live(repo_root=Path('scientific'),output_root=Path('v2r1-output'),apparatus_commit=os.environ['V2R1_PRIVATE_COMMIT'])
          print(json.dumps(r,sort_keys=True,separators=(',', ':')))
          if r['status']=='ZERO_OUTPUT_RETRY_REQUIRED': raise SystemExit(75)
          assert r['status']=='COMPLETE'
          PY
      - name: artifact integrity index
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          files={}; root=Path('v2r1-output')
          if root.exists():
              for p in sorted(x for x in root.rglob('*') if x.is_file()): files[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          obj={'schema':'neutral.v2r1-artifact-index.v1','head_sha':os.environ['GITHUB_SHA'],'scientific_authority_commit':os.environ['V2R1_PRIVATE_COMMIT'],'files':files}
          Path('v2r1-artifact-index.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
      - name: upload V2R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j-v2r1-live-evidence
          path: |
            v2r1-output
            v2r1-artifact-index.json
