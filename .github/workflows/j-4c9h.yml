name: j-4c9h
on:
  push:
    branches: [run/j-4c9h]
    paths:
      - 'runs/j-4c9h/**'
      - '.github/workflows/j-4c9h.yml'
permissions:
  contents: read
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  DATASETS_DISABLE_PROGRESS_BARS: '1'
  TARGET_N: '900'
  MIN_N: '800'
  MAX_DEMOS: '99'
  MAX_PER_DEMO: '1000'
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'datasets>=3,<5' 'huggingface_hub>=0.28,<1' 'pandas>=2,<3' 'pillow>=10,<13' 'ImageHash>=4.3,<5' 'numpy>=1.26,<3' 'requests>=2.32,<3'
      - name: Run full eligible-universe pilot
        run: python runs/j-4c9h/pilot.py
      - name: Upload aggregate outputs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j-4c9h-aggregate
          path: out/
          if-no-files-found: warn
          retention-days: 7
