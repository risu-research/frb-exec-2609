name: j-4c9e-preflight
on:
  push:
    branches:
      - run/j-4c9e
    paths:
      - "jobs/j-4c9e-preflight/**"
      - ".github/workflows/j-4c9e-preflight.yml"
permissions:
  contents: read
env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  DATASETS_DISABLE_PROGRESS_BARS: "1"
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "datasets>=3,<5" "huggingface_hub>=0.28,<1"
      - run: python jobs/j-4c9e-preflight/preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j-4c9e-preflight
          path: out_preflight/
          if-no-files-found: warn
          retention-days: 7
