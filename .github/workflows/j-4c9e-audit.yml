name: j-4c9e-audit
on:
  push:
    branches:
      - run/j-4c9e
    paths:
      - "jobs/j-4c9e-audit/universe.py"
      - ".github/workflows/j-4c9e-audit.yml"
permissions:
  contents: read
env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  DATASETS_DISABLE_PROGRESS_BARS: "1"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "weblinx==0.3.2" "datasets>=3,<5" "huggingface_hub>=0.28,<1" pillow ImageHash requests
      - run: python jobs/j-4c9e-audit/universe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j-4c9e-audit
          path: out_audit/
          if-no-files-found: warn
          retention-days: 7

# rerun-serialization-fix
