name: VE1 corrected source-history preflight v5

on:
  push:
    branches:
      - ve1-source-preflight-v5

permissions:
  contents: read

env:
  OLD_COMMIT: 611723a7cffd7cbc151afd0415c1a705900754f1
  MID_COMMIT: 87e8844e3e0fa0a47e586cecd2c4d412c7bc718f
  NEW_COMMIT: da6b8f90fa38d91b82f2ec301195f2ef4461deea
  C3_COMMIT: 57d56f076c05ccaa9553e6bd4b673b6d43a8cf7f
  OLD_BLOB: 6ce2d0e433b8380d03289d450aa3dc2fbe2d3977
  MID_BLOB: 5091b299da53ed3eaed85098d4e2a554289597e1
  NEW_BLOB: fae46c0527aabd3778506622a0f69c544db1be05
  MID_SHA256: 3d2e6a9cc6695cda5e38227686f9690318652ec747e8673670bd48cb9a46c1fd
  NEW_SHA256: 16d52ce11dec44fa9ca533d15f3cec1eb9646d59bf6a455bd905af63cdf86443
  ROWS_SHA256: 0ef80acf64bcc192837ee17f6b57ab2e79ee4182c9b793d8cf388d59d2558c20
  UPSTREAM_PATH: automation/BetterThermostatControl/BetterThermostat_RoomHeatControl_Lean.yaml

jobs:
  static-source-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert pre-result authority mirror
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          import json
          a=json.load(open('VE1_PRIVATE_PRE_RESULT_AUTHORITY_V2_FINAL_MIRROR.json'))
          d=json.load(open('VE1_EXPECTED_ROWS_DIGEST_V2_MIRROR.json'))
          assert a['schema']=='replaymark.ve1.pre-result-authority.v2.final'
          assert a['result_exposure']=={'ha_cells':0,'replaymark_cells':0,'scientific_outcome_seen':False}
          assert a['prediction']=={'states':32,'compatible':24,'retired':8}
          assert a['expected_rows_sha256']==d['rows_sha256']=="0ef80acf64bcc192837ee17f6b57ab2e79ee4182c9b793d8cf388d59d2558c20"
          assert d['scientific_result_opened'] is False
          PY

      - name: Materialize exact Git blob bytes and prove two-commit source sequence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf input result
          mkdir -p input result
          for spec in old:$OLD_BLOB mid:$MID_BLOB new:$NEW_BLOB c3:$NEW_BLOB; do
            name="${spec%%:*}"; blob="${spec#*:}"
            curl --fail --silent --show-error --location "https://api.github.com/repos/n3roGit/MyHomeAssistantMods/git/blobs/$blob" -o "input/${name}_blob.json"
          done
          for spec in old:$OLD_COMMIT mid:$MID_COMMIT new:$NEW_COMMIT c3:$C3_COMMIT; do
            name="${spec%%:*}"; commit="${spec#*:}"
            curl --fail --silent --show-error --location "https://api.github.com/repos/n3roGit/MyHomeAssistantMods/contents/${UPSTREAM_PATH}?ref=${commit}" -o "input/${name}_contents.json"
          done
          for spec in old:$OLD_COMMIT mid:$MID_COMMIT new:$NEW_COMMIT; do
            name="${spec%%:*}"; commit="${spec#*:}"
            curl --fail --silent --show-error --location "https://api.github.com/repos/n3roGit/MyHomeAssistantMods/commits/${commit}" -o "input/${name}_commit.json"
          done
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          E={k:os.environ[k] for k in ['OLD_COMMIT','MID_COMMIT','NEW_COMMIT','C3_COMMIT','OLD_BLOB','MID_BLOB','NEW_BLOB','MID_SHA256','NEW_SHA256']}
          oldc=json.load(open('input/old_commit.json')); midc=json.load(open('input/mid_commit.json')); newc=json.load(open('input/new_commit.json'))
          assert midc['sha']==E['MID_COMMIT'] and len(midc['parents'])==1 and midc['parents'][0]['sha']==E['OLD_COMMIT']
          assert newc['sha']==E['NEW_COMMIT'] and len(newc['parents'])==1 and newc['parents'][0]['sha']==E['MID_COMMIT']
          expected_blob={'old':E['OLD_BLOB'],'mid':E['MID_BLOB'],'new':E['NEW_BLOB'],'c3':E['NEW_BLOB']}
          for name in ('old','mid','new','c3'):
            meta=json.load(open(f'input/{name}_contents.json'))
            assert meta['sha']==expected_blob[name],(name,meta['sha'])
            obj=json.load(open(f'input/{name}_blob.json'))
            assert obj['sha']==expected_blob[name] and obj['encoding']=='base64'
            data=base64.b64decode(obj['content'])
            git=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
            assert git==expected_blob[name],(name,git)
            Path(f'input/{name}.yaml').write_bytes(data)
          assert hashlib.sha256(Path('input/mid.yaml').read_bytes()).hexdigest()==E['MID_SHA256']
          assert hashlib.sha256(Path('input/new.yaml').read_bytes()).hexdigest()==E['NEW_SHA256']
          assert Path('input/new.yaml').read_bytes()==Path('input/c3.yaml').read_bytes()
          Path('result/SOURCE_SHA256.json').write_text(json.dumps({n:hashlib.sha256(Path(f'input/{n}.yaml').read_bytes()).hexdigest() for n in ('old','mid','new','c3')},sort_keys=True,indent=2)+'\n')
          Path('result/SOURCE_ANCESTRY.json').write_text(json.dumps({'old':E['OLD_COMMIT'],'mid':E['MID_COMMIT'],'new':E['NEW_COMMIT'],'mid_parent':E['OLD_COMMIT'],'new_parent':E['MID_COMMIT'],'c3_pin':E['C3_COMMIT']},sort_keys=True,indent=2)+'\n')
          PY

      - name: Prove result-bearing source delta only once and rederive 32-row frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          old=Path('input/old.yaml').read_text(); mid=Path('input/mid.yaml').read_text(); new=Path('input/new.yaml').read_text()
          begin='  target_preset: >\n'; end='\n\n  # Fallback-Temperatur'
          def block(t):
            assert t.count(begin)==1 and end in t.split(begin,1)[1]
            return begin+t.split(begin,1)[1].split(end,1)[0]
          assert block(old)==block(mid)==block(new)
          unconditional='  - service: climate.set_preset_mode\n    target:\n      entity_id: "{{ climate_entity }}"\n    data:\n      preset_mode: "{{ target_preset }}"'
          assert old.count(unconditional)==1
          guard="{{ ent != '' and cur != tgt }}"
          assert mid.count(guard)==new.count(guard)==1
          bad='  source_url: source_url: https://github.com/n3roGit/MyHomeAssistantMods'
          fixed='  source_url: https://github.com/n3roGit/MyHomeAssistantMods'
          assert bad in mid and fixed in new and mid.replace(bad,fixed,1)==new
          def desired(p,m,n): return 'sleep' if n else ('away' if not p else ('comfort' if m else 'home'))
          rows=[]
          for p in (False,True):
            for m in (False,True):
              for n in (False,True):
                target=desired(p,m,n)
                for cur in ('away','home','comfort','sleep'):
                  ok=cur!=target
                  action={'operation':'climate.set_preset_mode','target':'climate.agentmark_thermostat','service_data':{'preset_mode':target}}
                  rows.append({'state_id':f'p{int(p)}-m{int(m)}-n{int(n)}-cur-{cur}','presence':p,'motion':m,'night':n,'current_preset':cur,'target_preset':target,'old_expected_action':action,'new_expected_action':action if ok else {'operation':'NO_ACTION'},'compatibility':'COMPATIBLE_ACROSS_VERSION' if ok else 'RETIRED_BY_UPDATE'})
          payload=json.dumps(rows,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          digest=hashlib.sha256(payload).hexdigest()
          assert digest==os.environ['ROWS_SHA256'],digest
          assert sum(r['compatibility']=='COMPATIBLE_ACROSS_VERSION' for r in rows)==24
          assert sum(r['compatibility']=='RETIRED_BY_UPDATE' for r in rows)==8
          Path('result/EXPECTED_ROWS_CANONICAL.json').write_bytes(payload+b'\n')
          Path('result/STATIC_RESULT.json').write_text(json.dumps({'schema':'replaymark.ve1.static-source-history.v2','status':'PASS','home_assistant_executed':False,'replaymark_executed':False,'scientific_result_opened':False,'states':32,'compatible':24,'retired':8,'rows_sha256':digest},sort_keys=True,indent=2)+'\n')
          PY

      - name: Seal static-only provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={'schema':'replaymark.ve1.public-static-source-history.v2','repository':os.environ['GITHUB_REPOSITORY'],'execution_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'prior_static_failures':[34433623632,34433725274,34433795269,34434072256],'home_assistant_executed':False,'replaymark_executed':False,'scientific_result_opened':False}
          Path('result/PROVENANCE.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          cp VE1_PRIVATE_PRE_RESULT_AUTHORITY_V2_FINAL_MIRROR.json result/
          cp VE1_EXPECTED_ROWS_DIGEST_V2_MIRROR.json result/
          (cd result; find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256; sha256sum -c CHECKSUMS.sha256)

      - name: Upload static qualification capsule
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ve1-v2-static-source-history
          path: result
          if-no-files-found: error
          retention-days: 90
