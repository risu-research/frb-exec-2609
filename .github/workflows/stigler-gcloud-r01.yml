name: Stigler G-Cloud R01 full-index check
on:
  push:
    branches:
      - experiment/stigler-gcloud-r01-20261123
    paths:
      - research/gcloud_r01/**
      - .github/workflows/stigler-gcloud-r01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout public research branch
        uses: actions/checkout@v4
      - name: Install deterministic parsing dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect complete public result indices and check stability
        run: python -u research/gcloud_r01/run_deep.py
      - name: Preserve URLs, IDs, supplier records and parse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stigler-gcloud-r01-full-index
          path: research/gcloud_r01/results_full/
          retention-days: 14
          if-no-files-found: warn
