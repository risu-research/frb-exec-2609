name: Stigler G-Cloud R02 document evidence capture
on:
  push:
    branches:
      - experiment/stigler-gcloud-r01-20261123
    paths:
      - research/gcloud_r01/run_r02.py
      - .github/workflows/stigler-gcloud-r01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_service_details:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout R02 frozen source
        uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect official source pages with independent baseline controls
        run: python -u research/gcloud_r01/run_r02.py
      - name: Preserve source text and blinded candidate forms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stigler-gcloud-r02-official-source-pages
          path: research/gcloud_r01/r02_results/
          retention-days: 14
          if-no-files-found: warn
