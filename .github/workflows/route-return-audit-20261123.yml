name: Route return and matched cache audit 20261123
on:
  push:
    branches: [experiment/continuation-cache-audit-20261123]
    paths: ['.github/workflows/route-return-audit-20261123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [0,1,2,3]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.36.0' 'pyarrow==21.0.0' 'numpy==2.2.6'
      - name: Frozen route return analysis
        env:
          PART: ${{ matrix.part }}
          REVISION: bb26cf7
        run: |
          cat > audit.py <<'PY'
          import collections, datetime as dt, hashlib, json, os, pathlib, tempfile
          import numpy as np
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi, hf_hub_download
          REPO="harvardMadsys/freeinference_agentic_trace"
          COLS="session_id step model provider prompt_tokens cache_read_tokens block_ids start_ms end_ms ttft_ms step_trigger".split()
          def valid(r):
              p,c=r["prompt_tokens"],r["cache_read_tokens"]
              return p is not None and c is not None and p>0 and 0<=c<=p
          def rate(r): return r["cache_read_tokens"]/r["prompt_tokens"]
          def prefix(a,b):
              x,y=a["blocks"],b["blocks"]
              return x is not None and y is not None and len(x)>0 and len(x)<=len(y) and np.array_equal(x,y[:len(x)])
          def gap(a,b):
              if a["end_ms"] is None or b["start_ms"] is None: return None
              return b["start_ms"]-a["end_ms"]
          def gapbin(g):
              if g is None or g<0:return None
              return next((v for v in [1000,5000,15000,60000,300000,1800000] if g<=v),999999999)
          def binlen(n):return n.bit_length()-1
          def growth(a,b):
              return next((v for v in [1.01,1.05,1.15,1.25,1.5,2] if len(b["blocks"])/len(a["blocks"])<=v),999)
          def adjacent(a,b):return a["session_id"]==b["session_id"] and b["step"]==a["step"]+1
          def eligible(a,b):
              return adjacent(a,b) and valid(a) and valid(b) and a["model"] and a["model"]==b["model"] and a["provider"] and b["provider"] and prefix(a,b) and gapbin(gap(a,b)) is not None
          def strata(a,b):
              return (a["model"],a["provider"],b["step_trigger"],gapbin(gap(a,b)),binlen(len(a["blocks"])),growth(a,b),int(min(99,rate(a)*100))//5)
          def triple(a,b,c):
              if not eligible(a,b) or not eligible(b,c) or rate(a)<.9:return None
              p,q,r=a["provider"],b["provider"],c["provider"]
              return "AAA" if p==q==r else "ABA" if p==r else "ABB" if q==r else "AAB" if p==q else "ABC"
          def selftest():
              def r(i,p,c,blocks):
                  return dict(session_id="s",step=i,model="m",provider=p,prompt_tokens=100,cache_read_tokens=c,blocks=np.array(blocks),start_ms=i*1000,end_ms=i*1000+500,step_trigger="tool",ttft_ms=10)
              a,b,c=r(0,"A",99,[1]),r(1,"B",0,[1,2]),r(2,"A",98,[1,2,3])
              assert triple(a,b,c)=="ABA"
              c["provider"]="B";assert triple(a,b,c)=="ABB"
              c["blocks"]=np.array([1,3]);assert triple(a,b,c) is None
              assert gapbin(60000)==60000 and gapbin(60001)==300000
          selftest()
          def sumrecord(d,key,ar,br):
              k=d[key];k["n"]+=1;k["drop50"]+=ar-br>.5;k["zero"]+=br==0;k["delta_sum"]+=br-ar
          def audit(path,week):
              pf=pq.ParquetFile(path)
              cnt=collections.Counter(); pairs=collections.defaultdict(collections.Counter); triples=collections.defaultdict(collections.Counter)
              match=collections.defaultdict(collections.Counter)
              pool=collections.defaultdict(lambda:collections.defaultdict(collections.Counter))
              local=collections.defaultdict(collections.Counter)
              examples=[]; prev=None; prev2=None; sid=None
              def close_session():
                  for key,c in local.items():
                      p=pool[key]
                      p["same"].update({k[1]:v for k,v in c.items() if k[0]=="same"})
                      p["switch"].update({k[1]:v for k,v in c.items() if k[0]=="switch"})
                      t=c.get(("switch","n"),0);n=c.get(("same","n"),0)
                      if t and n:
                          d=match["within_session"];d["matched_switch"]+=t;d["control_count_in_cells"]+=n
                          d["switch_drops"]+=c.get(("switch","drop"),0);d["expected_control_drops"]+=t*c.get(("same","drop"),0)/n
                          d["switch_delta_sum"]+=c.get(("switch","delta"),0);d["expected_control_delta_sum"]+=t*c.get(("same","delta"),0)/n
                  local.clear()
              for batch in pf.iter_batches(batch_size=96,columns=COLS):
                  ba=batch.column(batch.schema.get_field_index("block_ids")); off=ba.offsets.to_numpy(); flat=ba.values.to_numpy(zero_copy_only=False); null=ba.is_null().to_numpy(zero_copy_only=False)
                  for i,b in enumerate(batch.drop_columns(["block_ids"]).to_pylist()):
                      b["blocks"]=None if null[i] else flat[off[i]:off[i+1]]
                      cnt["requests"]+=1
                      if b["session_id"]!=sid:
                          close_session();sid=b["session_id"];cnt["sessions"]+=1;prev=prev2=None
                      if prev and adjacent(prev,b):
                          cnt["adjacent"]+=1
                          if eligible(prev,b) and rate(prev)>=.9:
                              ar,br=rate(prev),rate(b);g="same" if prev["provider"]==b["provider"] else "switch";gb=gapbin(gap(prev,b))
                              sumrecord(pairs,g+"/all",ar,br);sumrecord(pairs,g+"/gap_le_"+str(gb),ar,br)
                              key=strata(prev,b);d=local[key]
                              d[g,"n"]+=1;d[g,"drop"]+=ar-br>.5;d[g,"delta"]+=br-ar
                      if prev2 and prev:
                          t=triple(prev2,prev,b)
                          if t:
                              a=prev2; ar,br,cr=rate(a),rate(prev),rate(b)
                              for scope in ["all"]+(["both_gaps_le_60s"] if max(gap(a,prev),gap(prev,b))<=60000 else []):
                                  d=triples[t+"/"+scope];d["n"]+=1;d["middle_drop50"]+=ar-br>.5;d["third_rebound50"]+=cr-br>.5;d["third_ge90"]+=cr>=.9;d["middle_delta_sum"]+=br-ar;d["third_delta_sum"]+=cr-br
                                  if ar-br>.5:
                                      d["drop_then_rebound50"]+=cr-br>.5
                                      d["drop_then_ge90"]+=cr>=.9
                                      d["drop_then_cached_count_ge_original"]+=b["cache_read_tokens"]>=a["cache_read_tokens"]
                              if t=="ABA" and ar-br>.5 and cr>=.9 and max(gap(a,prev),gap(prev,b))<=60000 and len(examples)<20:
                                  examples.append({"week":week,"model":a["model"],"providers":[a["provider"],prev["provider"],b["provider"]],"steps":[a["step"],prev["step"],b["step"]],"gaps_ms":[gap(a,prev),gap(prev,b)],"prompt":[r["prompt_tokens"] for r in [a,prev,b]],"cached":[r["cache_read_tokens"] for r in [a,prev,b]],"block_lengths":[len(r["blocks"]) for r in [a,prev,b]]})
                      prev2,prev=prev,b
              close_session()
              for key,p in pool.items():
                  c,t=p["same"],p["switch"]
                  n,z=c["n"],t["n"]
                  if n and z:
                      d=match["within_week"];d["matched_switch"]+=z;d["control_count_in_cells"]+=n;d["switch_drops"]+=t["drop"];d["expected_control_drops"]+=z*c["drop"]/n;d["switch_delta_sum"]+=t["delta"];d["expected_control_delta_sum"]+=z*c["delta"]/n
              assert cnt["requests"]==pf.metadata.num_rows
              return {"counts":dict(cnt),"pairs":{k:dict(v) for k,v in pairs.items()},"triples":{k:dict(v) for k,v in triples.items()},"matches":{k:dict(v) for k,v in match.items()},"examples":examples}
          idx=int(os.environ["PART"])
          api=HfApi(); info=api.dataset_info(REPO,revision=os.environ["REVISION"],files_metadata=True);rev=info.sha
          paths=sorted(s.rfilename for s in info.siblings if s.rfilename.endswith("/processed/requests.parquet"))
          assert len(paths)==16
          out=pathlib.Path("r33-results");out.mkdir(exist_ok=True)
          for path in paths[idx*4:(idx+1)*4]:
              week=path.split("/")[1]
              with tempfile.TemporaryDirectory() as cache:
                  f=hf_hub_download(REPO,path,repo_type="dataset",revision=rev,cache_dir=cache)
                  with open(f,"rb") as inp: sha=hashlib.file_digest(inp,"sha256").hexdigest()
                  r=audit(f,week);r.update(week=week,source_sha256=sha,revision=rev)
                  (out/(week+".json")).write_text(json.dumps(r,indent=2))
                  print("WEEK",json.dumps({k:v for k,v in r.items() if k!="examples"}),flush=True)
          
          PY
          python audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-return-part-${{ matrix.part }}
          path: r33-results/
          if-no-files-found: warn
          retention-days: 7
