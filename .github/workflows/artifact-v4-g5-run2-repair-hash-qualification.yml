name: artifact-v4 g5 run2 repair hash qualification

on:
  push:
    branches:
      - artifact-v4-g5-run2-repair-hash-qualification
    paths:
      - .github/workflows/artifact-v4-g5-run2-repair-hash-qualification.yml

permissions:
  contents: read
  actions: read

env:
  PRIVATE_SOURCE_SHA: 089236049bc33d20d2c694636b19032e2f9c158a
  RUN2_PREOPEN_FAILURE_SEAL_BLOB: 9a0a99e0f7d65c431e6c2d7a67fd145e2cb9203c

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - name: Checkout public carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Pre-open qualification gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'artifact-v4-g5-run2-repair-hash-qualification'
          test -n "$SOURCE_READ_TOKEN"
          test "$(git rev-parse HEAD:artifact/v4-g5/G5_RUN2_PREOPEN_HASH_BINDING_FAILURE_SEAL_V1.json)" = '9a0a99e0f7d65c431e6c2d7a67fd145e2cb9203c'
          echo 'RUN2_REPAIR_HASH_QUALIFICATION_PREOPEN=PASS'

      - name: Checkout exact private qualification source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/private-v4-g5-run2-hashq"
          python3 tools/qx_private_source.py clone --sha "$PRIVATE_SOURCE_SHA" --dest "$SRC"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          git -C "$SRC" remote -v | grep -q . && { echo 'private remote survived checkout'; exit 1; } || true

      - name: Verify qualification identities
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/private-v4-g5-run2-hashq"
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/G5_RUN2_PREOPEN_HASH_BINDING_FAILURE_SEAL_V1.json)" = '9a0a99e0f7d65c431e6c2d7a67fd145e2cb9203c'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/V4_G5_RUN2_REPAIR_HASH_QUALIFICATION_CONSTITUTION_V1.json)" = '876f4e90cd3ad2d735973b855315fe308ccedf70'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/g5_run2_repair_hash_qualifier.py)" = 'b258ed8ea3c6887092e3d4651ee7377d52ec364e'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/g5_challenge_executor.py)" = 'de465001c50cbd349a700d99dbc7fb09d17e2d39'
          python3 -m py_compile "$SRC/artifact_v4/g5_run2_repair_hash_qualifier.py"
          echo 'RUN2_REPAIR_HASH_QUALIFICATION_IDENTITIES=PASS'

      - name: Qualify exact repaired executor bytes only
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/private-v4-g5-run2-hashq"; OUT="$RUNNER_TEMP/run2-hashq"
          mkdir -p "$OUT"
          python3 "$SRC/artifact_v4/g5_run2_repair_hash_qualifier.py" --old "$SRC/artifact_v4/g5_challenge_executor.py" --out "$OUT/g5_run2_repaired_executor.py" --receipt "$OUT/G5_RUN2_REPAIR_HASH_QUALIFICATION_RECEIPT.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'run2-hashq'/'G5_RUN2_REPAIR_HASH_QUALIFICATION_RECEIPT.json'
          x=json.loads(p.read_text())
          assert x['status']=='PASS_PRECHALLENGE_REPAIR_HASH_QUALIFICATION'
          assert x['replacement_count']==3 and x['replacement_cardinalities']==[1,1,1]
          assert x['python_compile_pass'] is True
          assert x['challenge_executor_executed'] is False and x['verifier_B_executed'] is False and x['mutant_materialized'] is False and x['scientific_outcome_observed'] is False
          print('QUALIFIED_NEW_SHA256='+x['new_sha256'])
          PY

      - name: Seal qualification checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/run2-hashq"
          cd "$OUT"
          sha256sum G5_RUN2_REPAIR_HASH_QUALIFICATION_RECEIPT.json g5_run2_repaired_executor.py > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replaymark-artifact-v4-g5-run2-repair-hash-qualification
          path: ${{ runner.temp }}/run2-hashq/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
