name: HCII Yambda Stage7 exposure opportunity audit
on:
  push:
    branches:
      - run/hcii-yambda-matched-20261009
    paths:
      - hcii_yambda/stage7_opportunity_diagnostic.py
      - .github/workflows/hcii-yambda-stage7-20261009.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opportunity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb==1.4.0 requests==2.32.3
      - name: Run diagnostic with fixed policies
        run: python hcii_yambda/stage7_opportunity_diagnostic.py
      - name: Save aggregate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcii-yambda-opportunity-diagnostic
          path: hcii_yambda/results_stage7/
          retention-days: 10
