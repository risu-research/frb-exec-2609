name: qx sibling-read probe

on:
  push:
    branches:
      - qx-static-v1

permissions:
  contents: read

jobs:
  sibling-read-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe sibling private read without exposing content
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/risu-research/replaymark/contents/replaymark/q_compiler.py?ref=b5d40b10e5741b493edcfceb2d5c98e43de6d56d')
          printf '%s\n' "$code" > /tmp/sibling-http-code.txt
          echo "sibling_private_read_http=$code"
          test "$code" = '200' || test "$code" = '403' || test "$code" = '404'
      - uses: actions/upload-artifact@v4
        with:
          name: qx-sibling-read-probe
          path: /tmp/sibling-http-code.txt
          if-no-files-found: error
