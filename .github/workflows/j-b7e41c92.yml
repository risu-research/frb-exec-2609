name: j-b7e41c92
on:
  push:
    branches: [exec/j-b7e41c92]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen task blob and stage runtime copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, tarfile
          src=Path('jobs/j-b7e41c92/task'); out=Path('/tmp/task_blob.tar')
          with tarfile.open(out,'w') as tf:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  i=tf.gettarinfo(str(p),arcname=p.relative_to(src).as_posix()); i.mtime=i.uid=i.gid=0; i.uname=i.gname=''
                  with p.open('rb') as f: tf.addfile(i,f)
          got=hashlib.sha256(out.read_bytes()).hexdigest(); print('task_blob_sha256='+got)
          assert got=='3688bd830f77e86094152cc76dc1c9203f46f6611a30be8b0fd5dbac307ee4a8'
          PY
          rm -rf /tmp/canary-workspace
          cp -a jobs/j-b7e41c92/task /tmp/canary-workspace
          chmod -R a+rwX /tmp/canary-workspace
      - name: Run verifier sidecar and isolated scripted client
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-slim >/dev/null
          docker network create --internal canary-net >/dev/null
          trap 'docker rm -f gate >/dev/null 2>&1 || true; docker network rm canary-net >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/canary-bin" "$RUNNER_TEMP/gate"
          python - <<'PY' > "$RUNNER_TEMP/gate/policy-sentinel"
          import secrets; print(secrets.token_hex(32))
          PY
          chmod 0400 "$RUNNER_TEMP/gate/policy-sentinel"
          cat > "$RUNNER_TEMP/gate/server.py" <<'PY'
          import socket
          sentinel=open('/policy/policy-sentinel','rb').read().strip(); assert len(sentinel)>=32
          s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('0.0.0.0',8765)); s.listen(8)
          while True:
              c,_=s.accept()
              try:
                  m=c.recv(4096)
                  try: c.sendall(b'VERIFIER_ENDPOINT_OK\n' if m==b'PING\n' else b'BAD_REQUEST\n')
                  except (BrokenPipeError, ConnectionResetError): pass
              finally:
                  c.close()
          PY
          docker run -d --rm --name gate --network canary-net --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 128m --cpus 0.5 \
            -v "$RUNNER_TEMP/gate:/policy:ro" python:3.12-slim python /policy/server.py >/dev/null
          ready=0
          for _ in $(seq 1 50); do
            if docker exec gate python -c "import socket; s=socket.create_connection(('127.0.0.1',8765),.2); s.sendall(b'PING\\n'); assert s.recv(64)==b'VERIFIER_ENDPOINT_OK\\n'; s.close()" >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" = 1
          GATE_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' gate)"
          test -n "$GATE_IP"
          cat > "$RUNNER_TEMP/canary-bin/verify-candidate" <<PY
          #!/usr/bin/env python3
          import socket,sys
          s=socket.create_connection(('$GATE_IP',8765),timeout=3); s.sendall(b'PING\\n'); d=s.recv(4096); s.close()
          sys.stdout.write(d.decode()); raise SystemExit(0 if d==b'VERIFIER_ENDPOINT_OK\\n' else 3)
          PY
          chmod 0555 "$RUNNER_TEMP/canary-bin/verify-candidate"
          docker run --rm -i --network canary-net --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65532:65532 --pids-limit 128 --memory 512m --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "/tmp/canary-workspace:/workspace:rw" \
            -v "$RUNNER_TEMP/canary-bin/verify-candidate:/opt/exec/bin/verify-candidate:ro" \
            -w /workspace python:3.12-slim python - <<'PY'
          from pathlib import Path
          import json,socket,subprocess
          r={}; p=Path('/workspace/.rw_probe'); p.write_text('ok\n'); r['workspace_rw']=p.read_text()=='ok\n'
          r['policy_sentinel_absent']=not Path('/policy/policy-sentinel').exists() and not Path('/tmp/host-policy-sentinel').exists()
          try: Path('/opt/exec/bin/verify-candidate').write_text('tamper\n'); r['verifier_ro']=False
          except OSError: r['verifier_ro']=True
          s=socket.socket(); s.settimeout(1)
          try: s.connect(('1.1.1.1',53)); r['external_network_blocked']=False
          except OSError: r['external_network_blocked']=True
          finally: s.close()
          q=subprocess.run(['python','verify.py'],text=True,capture_output=True)
          r['verifier_sidecar']=q.returncode==0 and q.stdout=='VERIFIER_ENDPOINT_OK\n'
          keys=['workspace_rw','policy_sentinel_absent','verifier_ro','external_network_blocked','verifier_sidecar']
          r['status']='PASS' if all(r[k] for k in keys) else 'FAIL'
          Path('/workspace/.boundary_result.json').write_text(json.dumps(r,sort_keys=True)+'\n'); print(json.dumps(r,sort_keys=True))
          if q.returncode or q.stdout!='VERIFIER_ENDPOINT_OK\n': print('verify_rc=',q.returncode,'verify_stdout=',repr(q.stdout),'verify_stderr=',repr(q.stderr))
          raise SystemExit(0 if r['status']=='PASS' else 4)
          PY
          docker rm -f gate >/dev/null 2>&1 || true
          docker network rm canary-net >/dev/null 2>&1 || true
          trap - EXIT
      - name: Seal result manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=json.loads(Path('/tmp/canary-workspace/.boundary_result.json').read_text()); assert r['status']=='PASS'
          sealed={'job_id':'j-b7e41c92','task_blob_sha256':'3688bd830f77e86094152cc76dc1c9203f46f6611a30be8b0fd5dbac307ee4a8','runner_commit':os.environ['GITHUB_SHA'],'candidate_program_sha256':hashlib.sha256(Path('/tmp/canary-workspace/src/program.py').read_bytes()).hexdigest(),'boundary':r}
          out=Path('/tmp/j-b7e41c92-result.json'); out.write_text(json.dumps(sealed,sort_keys=True,separators=(',',':'))+'\n'); print('result_sha256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Upload minimal result
        uses: actions/upload-artifact@v4
        with:
          name: j-b7e41c92-result
          path: /tmp/j-b7e41c92-result.json
          retention-days: 1
          if-no-files-found: error
