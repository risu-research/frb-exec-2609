name: j-b7e41c92
on:
  push:
    branches: [exec/j-b7e41c92]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen task blob and stage runtime copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, tarfile
          src=Path('jobs/j-b7e41c92/task'); out=Path('/tmp/task_blob.tar')
          with tarfile.open(out,'w') as tf:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  i=tf.gettarinfo(str(p),arcname=p.relative_to(src).as_posix()); i.mtime=i.uid=i.gid=0; i.uname=i.gname=''
                  with p.open('rb') as f: tf.addfile(i,f)
          got=hashlib.sha256(out.read_bytes()).hexdigest(); print('task_blob_sha256='+got)
          assert got=='3688bd830f77e86094152cc76dc1c9203f46f6611a30be8b0fd5dbac307ee4a8'
          PY
          rm -rf /tmp/canary-workspace
          cp -a jobs/j-b7e41c92/task /tmp/canary-workspace
          chmod -R a+rwX /tmp/canary-workspace
      - name: Prepare host-only verifier boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-socket "$RUNNER_TEMP/canary-bin"
          chmod 700 /tmp/canary-socket
          python - <<'PY' > /tmp/host-policy-sentinel
          import secrets; print(secrets.token_hex(32))
          PY
          chmod 600 /tmp/host-policy-sentinel
          cat > "$RUNNER_TEMP/canary-bin/verify-candidate" <<'PY'
          #!/usr/bin/env python3
          import socket,sys
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect('/opt/exec/host/verify.sock'); s.sendall(b'PING\n')
          d=s.recv(4096); sys.stdout.write(d.decode()); raise SystemExit(0 if d==b'VERIFIER_ENDPOINT_OK\n' else 3)
          PY
          chmod 0555 "$RUNNER_TEMP/canary-bin/verify-candidate"
          cat > "$RUNNER_TEMP/host_server.py" <<'PY'
          import os,socket
          p='/tmp/canary-socket/verify.sock'
          try: os.unlink(p)
          except FileNotFoundError: pass
          assert len(open('/tmp/host-policy-sentinel','rb').read().strip())>=32
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.bind(p); os.chmod(p,0o666); s.listen(1)
          c,_=s.accept(); m=c.recv(4096); c.sendall(b'VERIFIER_ENDPOINT_OK\n' if m==b'PING\n' else b'BAD_REQUEST\n'); c.close(); s.close()
          PY
          python "$RUNNER_TEMP/host_server.py" &
          for _ in $(seq 1 50); do test -S /tmp/canary-socket/verify.sock && break; sleep 0.1; done
          test -S /tmp/canary-socket/verify.sock
      - name: Run isolated scripted client
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-slim >/dev/null
          docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "/tmp/canary-workspace:/workspace:rw" \
            -v "$RUNNER_TEMP/canary-bin/verify-candidate:/opt/exec/bin/verify-candidate:ro" \
            -v "/tmp/canary-socket:/opt/exec/host:rw" -w /workspace python:3.12-slim python - <<'PY'
          from pathlib import Path
          import json,socket,subprocess
          r={}; p=Path('/workspace/.rw_probe'); p.write_text('ok\n'); r['workspace_rw']=p.read_text()=='ok\n'
          r['host_sentinel_absent']=not Path('/tmp/host-policy-sentinel').exists()
          try: Path('/opt/exec/bin/verify-candidate').write_text('tamper\n'); r['verifier_ro']=False
          except OSError: r['verifier_ro']=True
          s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(1)
          try: s.connect(('1.1.1.1',53)); r['network_none']=False
          except OSError: r['network_none']=True
          finally: s.close()
          q=subprocess.run(['python','verify.py'],text=True,capture_output=True)
          r['verifier_socket']=q.returncode==0 and q.stdout=='VERIFIER_ENDPOINT_OK\n'
          r['status']='PASS' if all(r[k] for k in ['workspace_rw','host_sentinel_absent','verifier_ro','network_none','verifier_socket']) else 'FAIL'
          Path('/workspace/.boundary_result.json').write_text(json.dumps(r,sort_keys=True)+'\n'); print(json.dumps(r,sort_keys=True))
          raise SystemExit(0 if r['status']=='PASS' else 4)
          PY
      - name: Seal result manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=json.loads(Path('/tmp/canary-workspace/.boundary_result.json').read_text()); assert r['status']=='PASS'
          sealed={'job_id':'j-b7e41c92','task_blob_sha256':'3688bd830f77e86094152cc76dc1c9203f46f6611a30be8b0fd5dbac307ee4a8','runner_commit':os.environ['GITHUB_SHA'],'candidate_program_sha256':hashlib.sha256(Path('/tmp/canary-workspace/src/program.py').read_bytes()).hexdigest(),'boundary':r}
          out=Path('/tmp/j-b7e41c92-result.json'); out.write_text(json.dumps(sealed,sort_keys=True,separators=(',',':'))+'\n'); print('result_sha256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Upload minimal result
        uses: actions/upload-artifact@v4
        with:
          name: j-b7e41c92-result
          path: /tmp/j-b7e41c92-result.json
          retention-days: 1
          if-no-files-found: error
