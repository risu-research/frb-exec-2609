name: RISUAP v038 NY name source wave07 audited
on:
  push:
    branches:
      - ops/public-input-availability-261116
    paths:
      - .github/workflows/risuap-v038-fullnames-wave07.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: name_20140123_20140517
            start: "2014-01-23"
            end: "2014-05-17"
            expected: 61847
          - label: name_20140517_20140908
            start: "2014-05-17"
            end: "2014-09-08"
            expected: 53608
          - label: name_20140908_20150101
            start: "2014-09-08"
            end: "2015-01-01"
            expected: 55137
          - label: name_20150101_20150518
            start: "2015-01-01"
            end: "2015-05-18"
            expected: 73922
          - label: name_20150518_20151002
            start: "2015-05-18"
            end: "2015-10-02"
            expected: 69457
          - label: name_20151002_20160216
            start: "2015-10-02"
            end: "2016-02-16"
            expected: 68316
          - label: name_20160216_20160702
            start: "2016-02-16"
            end: "2016-07-02"
            expected: 77744
          - label: name_20160702_20161116
            start: "2016-07-02"
            end: "2016-11-16"
            expected: 67578
          - label: name_20161116_20170402
            start: "2016-11-16"
            end: "2017-04-02"
            expected: 75036
          - label: name_20170402_20170817
            start: "2017-04-02"
            end: "2017-08-17"
            expected: 76031
          - label: name_20170817_20180101
            start: "2017-08-17"
            end: "2018-01-01"
            expected: 71596
          - label: name_20180101_20180402
            start: "2018-01-01"
            end: "2018-04-02"
            expected: 57787
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private-recipient authenticated source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/risuap-v038
          /tmp/risuap-v038/bin/pip install --quiet cryptography==44.0.3
          openssl pkey -pubin -in probe/v032-recipient.pem -noout
      - name: Retrieve complete pinned official date range and independently check edition
        shell: bash
        run: |
          set -euo pipefail
          /tmp/risuap-v038/bin/python probe/risuap_v038_name_full_ingest.py \
            --label "${{ matrix.label }}" --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --expected "${{ matrix.expected }}" --rows-epoch 1794948547 --metadata-epoch 1794945028 \
            --max-rows 100000 --limit 10000 --out source_data
          cp source_data/manifest.json source-receipt.json
      - name: Encrypt archive for owner only and remove runner plaintext
        shell: bash
        run: |
          set -euo pipefail
          /tmp/risuap-v038/bin/python probe/seal_private_v031.py \
            --source source_data --recipient probe/v032-recipient.pem --out sealed-source.json
          rm -rf source_data
          python3 probe/v032_cipher_chunks.py --sealed sealed-source.json --label "${{ matrix.label }}" --out chunks
          rm sealed-source.json
      - name: Upload only source count/vintage and encryption receipts
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-receipts
          path: |
            source-receipt.json
            chunks/transport-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload ciphertext part00
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-part00
          path: chunks/sealed.part00
          retention-days: 7
          if-no-files-found: error
      - name: Upload ciphertext part01 if present
        if: ${{ hashFiles('chunks/sealed.part01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: v038-full-name-${{ matrix.label }}-part01
          path: chunks/sealed.part01
          retention-days: 7
