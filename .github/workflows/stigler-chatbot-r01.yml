name: Stigler Chatbot R01 legislative stage audit
on:
  push:
    branches:
      - experiment/stigler-chatbot-r01-20261123
    paths:
      - research/stigler_r01/**
      - .github/workflows/stigler-chatbot-r01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_law_history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install text parsers
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Capture all HI stages and committee document originals
        run: python -u research/stigler_r01/capture_hawaii.py
      - name: Preserve sources and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stigler-chatbot-r01-hawaii-primary-sources
          path: research/stigler_r01/results/
          if-no-files-found: warn
          retention-days: 14
