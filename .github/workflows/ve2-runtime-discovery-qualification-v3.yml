name: VE2 runtime substrate discovery qualification v3

on:
  push:
    branches:
      - ve2-runtime-discovery-qualification-v3

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V2_FAILURE_SEAL: 9f34c80649753e3bce331d9e2da986a0f73c7eff
      FAILURE_SEAL_BLOB: 7042cb8e93fc959902aef1cfeea9092eda3032bb
      PRIVATE_V3_AUTHORITY: 07d9b3e40c28df44075c98c8c839aba14fd09001
      CONSTITUTION_BLOB: 6fdc772525c9259097fc2cde9c6b010bee6fa180
      CANDIDATES_BLOB: 4a317c9c6158ef7ce28e9c425789ac3901071f41
      FAILED_V2_BLOB: 2de17d730d583fc2de501d8397a52e5fc7908653
      REMEDIATION_V3_BLOB: ea61bc7ff759115cb5480e9b60d2842b5fd221ef
      AUTHORITY_V3_BLOB: ab688e05d4810e25430eeaff54f6e826b9c0bc4d
      INSIDE_V3_BLOB: 045d3feebcd263fc197bfb318d0eec91fd62843a
      COORDINATOR_V3_BLOB: 3be6222a3161c045f46c4c3b5498efa4bb1a65dc
      VERIFIER_V3_BLOB: 817b5e9ff08e960486fe64571b8cdb1560c5091b
    steps:
      - name: Checkout exact v3 discovery authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require fresh one-file v3 open and probe-only remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          source_candidate="$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^^)" = "$V2_FAILURE_SEAL"
          mapfile -t marker_delta < <(git diff --name-only "$source_candidate..HEAD")
          test "${#marker_delta[@]}" -eq 1
          test "${marker_delta[0]}" = "VE2_RUNTIME_DISCOVERY_OPEN_V3.json"
          printf '%s\n' \
            '.github/workflows/ve2-runtime-discovery-qualification-v3.yml' \
            'VE2_RUNTIME_DISCOVERY_PRE_RESULT_AUTHORITY_V3.json' \
            'VE2_RUNTIME_DISCOVERY_REMEDIATION_CONTRACT_V3.json' \
            'VE2_RUNTIME_DISCOVERY_V2_FAILURE_RECEIPT.json' \
            've2_runtime_discovery_public_v3.py' \
            've2_runtime_inside_probe_v3.py' \
            'verify_ve2_runtime_discovery_freeze_v3.py' | LC_ALL=C sort > /tmp/expected
          git diff --name-only "$V2_FAILURE_SEAL..$source_candidate" | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(git hash-object --no-filters VE2_RUNTIME_DISCOVERY_FAILURE_SEAL_V2.json)" = "$FAILURE_SEAL_BLOB"
          test "$(git hash-object --no-filters VE2_RUNTIME_DISCOVERY_CONSTITUTION_V1.json)" = "$CONSTITUTION_BLOB"
          test "$(git hash-object --no-filters VE2_RUNTIME_DISCOVERY_CANDIDATES_V1.json)" = "$CANDIDATES_BLOB"
          test "$(git hash-object --no-filters VE2_RUNTIME_DISCOVERY_V2_FAILURE_RECEIPT.json)" = "$FAILED_V2_BLOB"
          test "$(git hash-object --no-filters VE2_RUNTIME_DISCOVERY_REMEDIATION_CONTRACT_V3.json)" = "$REMEDIATION_V3_BLOB"
          test "$(git hash-object --no-filters VE2_RUNTIME_DISCOVERY_PRE_RESULT_AUTHORITY_V3.json)" = "$AUTHORITY_V3_BLOB"
          test "$(git hash-object --no-filters ve2_runtime_inside_probe_v3.py)" = "$INSIDE_V3_BLOB"
          test "$(git hash-object --no-filters ve2_runtime_discovery_public_v3.py)" = "$COORDINATOR_V3_BLOB"
          test "$(git hash-object --no-filters verify_ve2_runtime_discovery_freeze_v3.py)" = "$VERIFIER_V3_BLOB"
          SOURCE="$source_candidate" python -c 'import json,os; v=json.load(open("VE2_RUNTIME_DISCOVERY_OPEN_V3.json")); assert v=={"schema":"replaymark.ve2.runtime-discovery-open.v3","authority":"RUNTIME_DISCOVERY_ONLY","source_candidate_head":os.environ["SOURCE"],"private_v3_authority":"07d9b3e40c28df44075c98c8c839aba14fd09001","v2_failure_seal_parent":"9f34c80649753e3bce331d9e2da986a0f73c7eff","scientific_result_opened":False,"ve2_home_assistant_scientific_cells":0,"ve2_replaymark_scientific_cells":0,"rerun_authorized":False}'
          python verify_ve2_runtime_discovery_freeze_v3.py
          python -m py_compile ve2_runtime_discovery_public_v3.py ve2_runtime_inside_probe_v3.py

      - name: Build isolated v3 discovery capsule
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ve2-runtime-discovery-capsule-v3
          mkdir -p /tmp/ve2-runtime-discovery-capsule-v3
          cp VE2_RUNTIME_DISCOVERY_CONSTITUTION_V1.json /tmp/ve2-runtime-discovery-capsule-v3/
          cp VE2_RUNTIME_DISCOVERY_CANDIDATES_V1.json /tmp/ve2-runtime-discovery-capsule-v3/
          cp VE2_RUNTIME_DISCOVERY_PRE_RESULT_AUTHORITY_V3.json /tmp/ve2-runtime-discovery-capsule-v3/
          cp VE2_RUNTIME_DISCOVERY_REMEDIATION_CONTRACT_V3.json /tmp/ve2-runtime-discovery-capsule-v3/
          cp VE2_RUNTIME_DISCOVERY_V2_FAILURE_RECEIPT.json /tmp/ve2-runtime-discovery-capsule-v3/
          cp ve2_runtime_inside_probe_v3.py /tmp/ve2-runtime-discovery-capsule-v3/
          cp ve2_runtime_discovery_public_v3.py /tmp/ve2-runtime-discovery-capsule-v3/
          cp VE2_RUNTIME_DISCOVERY_OPEN_V3.json /tmp/ve2-runtime-discovery-capsule-v3/
          test "$(find /tmp/ve2-runtime-discovery-capsule-v3 -maxdepth 1 -type f | wc -l)" -eq 8
          ! find /tmp/ve2-runtime-discovery-capsule-v3 -type f -iname '*frontier*' | grep -q .

      - name: Execute frozen v3 first-pass runtime discovery
        id: discovery
        shell: bash
        working-directory: /tmp/ve2-runtime-discovery-capsule-v3
        run: |
          set -euo pipefail
          rm -rf work results
          mkdir -p work results
          python ve2_runtime_discovery_public_v3.py \
            --inside-probe ve2_runtime_inside_probe_v3.py \
            --work work \
            --out results/VE2_RUNTIME_DISCOVERY_RESULT_V3.json

      - name: Seal v3 discovery provenance and checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ve2-runtime-discovery-results-v3
          mkdir -p ve2-runtime-discovery-results-v3
          cp /tmp/ve2-runtime-discovery-capsule-v3/VE2_RUNTIME_DISCOVERY_OPEN_V3.json ve2-runtime-discovery-results-v3/
          cp /tmp/ve2-runtime-discovery-capsule-v3/VE2_RUNTIME_DISCOVERY_CONSTITUTION_V1.json ve2-runtime-discovery-results-v3/
          cp /tmp/ve2-runtime-discovery-capsule-v3/VE2_RUNTIME_DISCOVERY_CANDIDATES_V1.json ve2-runtime-discovery-results-v3/
          cp /tmp/ve2-runtime-discovery-capsule-v3/VE2_RUNTIME_DISCOVERY_PRE_RESULT_AUTHORITY_V3.json ve2-runtime-discovery-results-v3/
          cp /tmp/ve2-runtime-discovery-capsule-v3/VE2_RUNTIME_DISCOVERY_REMEDIATION_CONTRACT_V3.json ve2-runtime-discovery-results-v3/
          cp /tmp/ve2-runtime-discovery-capsule-v3/VE2_RUNTIME_DISCOVERY_V2_FAILURE_RECEIPT.json ve2-runtime-discovery-results-v3/
          if [ -f /tmp/ve2-runtime-discovery-capsule-v3/results/VE2_RUNTIME_DISCOVERY_RESULT_V3.json ]; then cp /tmp/ve2-runtime-discovery-capsule-v3/results/VE2_RUNTIME_DISCOVERY_RESULT_V3.json ve2-runtime-discovery-results-v3/; fi
          status=MISSING; rsha=""
          if [ -f ve2-runtime-discovery-results-v3/VE2_RUNTIME_DISCOVERY_RESULT_V3.json ]; then status="$(python -c 'import json; print(json.load(open("ve2-runtime-discovery-results-v3/VE2_RUNTIME_DISCOVERY_RESULT_V3.json")).get("status","FAIL"))')"; rsha="$(sha256sum ve2-runtime-discovery-results-v3/VE2_RUNTIME_DISCOVERY_RESULT_V3.json | cut -d' ' -f1)"; fi
          STATUS="$status" RSHA="$rsha" SOURCE="$(git rev-parse HEAD^)" python -c 'import json,os,pathlib; pathlib.Path("ve2-runtime-discovery-results-v3/VE2_RUNTIME_DISCOVERY_PROVENANCE_V3.json").write_text(json.dumps({"schema":"replaymark.ve2.runtime-discovery-provenance.v3","repository":os.environ["GITHUB_REPOSITORY"],"execution_head":os.environ["GITHUB_SHA"],"source_candidate_head":os.environ["SOURCE"],"private_v3_authority":os.environ["PRIVATE_V3_AUTHORITY"],"v2_failure_seal":os.environ["V2_FAILURE_SEAL"],"workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"discovery_status":os.environ["STATUS"],"result_sha256":os.environ["RSHA"] or None,"scientific_result_opened":False,"frontier_result_seen":False,"ve2_home_assistant_scientific_cells":0,"ve2_replaymark_scientific_cells":0,"rerun_authorized":False},sort_keys=True,indent=2)+"\n")'
          (cd ve2-runtime-discovery-results-v3; find . -type f ! -name CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > CHECKSUMS.sha256; sha256sum -c CHECKSUMS.sha256; echo "CHECKSUMS_SHA256=$(sha256sum CHECKSUMS.sha256 | cut -d' ' -f1)"; cat CHECKSUMS.sha256)

      - name: Upload immutable v3 runtime discovery capsule
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ve2-runtime-discovery-qualification-v3
          path: ve2-runtime-discovery-results-v3
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Surface PASS only after sealed v3 artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json; v=json.load(open("ve2-runtime-discovery-results-v3/VE2_RUNTIME_DISCOVERY_RESULT_V3.json")); assert v["status"]=="PASS"; assert v["scientific_result_opened"] is False and v["frontier_result_seen"] is False and v["ve2_home_assistant_scientific_cells"]==0 and v["ve2_replaymark_scientific_cells"]==0 and v["transition_fixture_executed"] is False and v["historical_action_dispatched"] is False and v["rerun_all_roles_from_first_candidate"] is True; assert all(v["selected"][x] is not None for x in ("T01_OLD_HISTORY","T01_NEW_TARGET","T02_COMMON"))'
