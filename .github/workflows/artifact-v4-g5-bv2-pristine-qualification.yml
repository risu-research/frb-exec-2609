name: artifact-v4 g5 verifier-b-v2 pristine qualification

on:
  push:
    branches:
      - artifact-v4-g5-bv2-pristine-qualification
    paths:
      - .github/workflows/artifact-v4-g5-bv2-pristine-qualification.yml

permissions:
  contents: read
  actions: read

env:
  PRIVATE_SOURCE_SHA: e1069969b5f1c548a7e39e080ef6e3115393ae7a
  HISTORICAL_SHA: d017fde0d9ee5c225cf09199f54a510851b082ff
  FIXED_PROTOCOL_REF: 383ee2e1b192fda7c6ce3a9576d9c6a4eae0a77e
  S3C0_LEGACY_PROTOCOL_REF: 23b7c85bca6cb85fde9f4361a0f9664d21c8ae8d
  S3C0_LEGACY_OUTCOME_REF: ac20890bb4aa926e439802510de3723b74591c94
  VE2_SHA: 25ebfd817420fa0f782419977e4ec166f6ca358a
  EXPECTED_G4_B_VECTOR_SHA256: 65b2b519b45315589d885d75d17dc716b255db5c88612652b6201dca93b5103c

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - name: Checkout public qualification carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Checkout exact frozen private repair source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_READ_TOKEN"
          SRC="$RUNNER_TEMP/private-bv2q"
          python3 tools/qx_private_source.py clone --sha "$PRIVATE_SOURCE_SHA" --dest "$SRC"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          git -C "$SRC" remote -v | grep -q . && { echo 'private remote survived checkout'; exit 1; } || true

      - name: Verify prospective repair lineage and identities
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/private-bv2q"
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/G5_RUN2_COMPLETE_FAILURE_SEAL_V1.json)" = '183e628c0133fe0b696bf438a0d6f736e8b4d9f7'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/V4_G5_C14_INDEPENDENT_TWIN_FREEZE_V1.json)" = '2bfd9a4fb4d68416d46e16a9858185eac8585635'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/V4_G5_POSTMISS_REMEDIATION_CONSTITUTION_V1.json)" = 'bcb4eea889619ee4f0b4220563739807575f33f5'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/verifier_b.mjs)" = '809efb0ff3a26ab096af97d2b73b68045cf4d8c8'
          test "$(git -C "$SRC" rev-parse HEAD:artifact_v4/g5_verifier_b_v2_materializer.py)" = '16d4cfad98864df1eba45a5b5e0f6581ff0c7c97'
          python3 -m py_compile "$SRC/artifact_v4/g5_verifier_b_v2_materializer.py"
          echo 'BV2_REPAIR_LINEAGE=PASS'

      - name: Materialize and statically qualify Verifier B v2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/private-bv2q"; OUT="$RUNNER_TEMP/bv2q"; mkdir -p "$OUT"
          python3 "$SRC/artifact_v4/g5_verifier_b_v2_materializer.py" --old "$SRC/artifact_v4/verifier_b.mjs" --out "$OUT/verifier_b_v2.mjs" --receipt "$OUT/BV2_MATERIALIZATION_RECEIPT.json"
          node --check "$OUT/verifier_b_v2.mjs"
          ! grep -Eq 'C14_|C49_|V4_G2_CHALLENGE|CLAIM_LEDGER|replacement_expected|expected mutant' "$OUT/verifier_b_v2.mjs"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          o=Path(os.environ['RUNNER_TEMP'])/'bv2q'; p=o/'verifier_b_v2.mjs'; r=json.loads((o/'BV2_MATERIALIZATION_RECEIPT.json').read_text())
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert r['status']=='PASS_MATERIALIZED_VERIFIER_B_V2' and r['new_sha256']==h
          assert r['replacement_cardinalities']=={'helper_marker':1,'E06_block':1}
          print('BV2_SHA256='+h)
          PY

      - name: Checkout exact historical authority graph
        shell: bash
        run: |
          set -euo pipefail
          HIST="$RUNNER_TEMP/historical"
          git init -q "$HIST"
          git -C "$HIST" remote add origin https://github.com/risu-research/appeal-discovery-consumer.git
          git -C "$HIST" fetch -q --no-tags origin "$HISTORICAL_SHA" "$FIXED_PROTOCOL_REF" "$S3C0_LEGACY_PROTOCOL_REF" "$S3C0_LEGACY_OUTCOME_REF"
          for x in "$HISTORICAL_SHA" "$FIXED_PROTOCOL_REF" "$S3C0_LEGACY_PROTOCOL_REF" "$S3C0_LEGACY_OUTCOME_REF"; do git -C "$HIST" cat-file -e "$x^{commit}"; done
          git -C "$HIST" checkout -q --detach "$HISTORICAL_SHA"
          git -C "$HIST" remote remove origin

      - name: Materialize exact VE2 pre-result authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin "$VE2_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$VE2_SHA"
          VE2="$RUNNER_TEMP/ve2"
          git worktree add -q --detach "$VE2" "$VE2_SHA"
          test "$(git -C "$VE2" rev-parse HEAD^{tree})" = '88f796f2e8ff361aa07925500c80b2ce0f8532e9'

      - name: Materialize pristine B inputs with zero mutations
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/private-bv2q"; HIST="$RUNNER_TEMP/historical"; VE2="$RUNNER_TEMP/ve2"; RAW="$RUNNER_TEMP/bv2-raw"; PRISTINE="$RUNNER_TEMP/bv2-pristine"
          python3 "$SRC/artifact_v4/g4_prepare_pristine_b_inputs.py" --source_root "$SRC" --historical_root "$HIST" --public_root "$GITHUB_WORKSPACE" --ve2_root "$VE2" --out_dir "$RAW"
          python3 "$SRC/artifact_v4/g4_python_json_compat_adapter.py" --in-dir "$RAW" --out-dir "$PRISTINE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); x=json.loads((t/'bv2-raw'/'B_INPUT_MATERIALIZATION_RECEIPT.json').read_text()); y=json.loads((t/'bv2-pristine'/'PYJSON_COMPAT_RECEIPT.json').read_text())
          assert x['status']=='PASS_PRISTINE_INPUT_MATERIALIZATION' and x['role_count']==23 and x['mutations_applied']==0
          assert x['expected_values_read'] is False and x['verifier_a_output_read'] is False
          assert y['status']=='PASS_LEXICAL_COMPATIBILITY_ADAPTER' and y['finite_semantics_changed'] is False
          PY

      - name: Execute repaired B v2 on pristine authority only
        shell: bash
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/bv2q"; P="$RUNNER_TEMP/bv2-pristine"; S="$RUNNER_TEMP/bv2-sandbox"
          mkdir -p "$S"
          cp "$Q/verifier_b_v2.mjs" "$S/verifier_b.mjs"
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); p=t/'bv2-pristine'; s=t/'bv2-sandbox'; m=json.loads((p/'B_INPUT_MANIFEST.json').read_text()); shutil.copy2(p/'B_INPUT_MANIFEST.json',s/'B_INPUT_MANIFEST.json')
          for rec in m['roles'].values():
              src=p/rec['path']; dst=s/rec['path']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          PY
          (cd "$S" && env -i PATH="$PATH" HOME="$HOME" node ./verifier_b.mjs --manifest ./B_INPUT_MANIFEST.json --out "$RUNNER_TEMP/bv2q/BV2_VECTOR.json" --trace-out "$RUNNER_TEMP/bv2q/BV2_TRACE.json") >"$Q/BV2_STDOUT.log" 2>"$Q/BV2_STDERR.log"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); q=t/'bv2q'; v=json.loads((q/'BV2_VECTOR.json').read_text()); h=hashlib.sha256((q/'BV2_VECTOR.json').read_bytes()).hexdigest()
          assert len(v)==42, len(v)
          assert h==os.environ['EXPECTED_G4_B_VECTOR_SHA256'],(h,os.environ['EXPECTED_G4_B_VECTOR_SHA256'])
          print('BV2_PRISTINE_42_CLAIMS_EXACT_G4_VECTOR=PASS')
          PY

      - name: Write qualification receipt and checksums
        shell: bash
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/bv2q"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          q=Path(os.environ['RUNNER_TEMP'])/'bv2q'
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          mat=json.loads((q/'BV2_MATERIALIZATION_RECEIPT.json').read_text())
          rec={'schema':'replaymark.artifact-v4.g5-verifier-b-v2-pristine-qualification.v1','status':'PASS_BV2_PRISTINE_QUALIFICATION','verifier_b_v2_sha256':H(q/'verifier_b_v2.mjs'),'baseline_claim_count':42,'baseline_vector_sha256':H(q/'BV2_VECTOR.json'),'baseline_exact_frozen_G4_B':H(q/'BV2_VECTOR.json')==os.environ['EXPECTED_G4_B_VECTOR_SHA256'],'challenge_executed':False,'mutant_materialized':False,'challenge_catalog_visible_to_B':False,'expected_manuscript_values_visible_to_B':False,'materialization_receipt_sha256':H(q/'BV2_MATERIALIZATION_RECEIPT.json'),'trace_sha256':H(q/'BV2_TRACE.json')}
          (q/'BV2_PRISTINE_QUALIFICATION_RECEIPT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          assert rec['baseline_exact_frozen_G4_B']
          print(json.dumps(rec,sort_keys=True))
          PY
          cd "$Q"
          sha256sum verifier_b_v2.mjs BV2_MATERIALIZATION_RECEIPT.json BV2_VECTOR.json BV2_TRACE.json BV2_STDOUT.log BV2_STDERR.log BV2_PRISTINE_QUALIFICATION_RECEIPT.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload immutable B v2 qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replaymark-artifact-v4-g5-bv2-pristine-qualification
          path: ${{ runner.temp }}/bv2q/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
