name: j-4b2c82ad
on:
  push:
    branches: ["exec/j-4b2c82ad"]
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: dual-version-kernel-build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd jobs/j-4b2c82ad
          python - <<'PY'
          from pathlib import Path
          p = Path('Concrete.lean')
          s = p.read_text()
          s = s.replace('import Std.Tactic.Omega', 'import Lean.Elab.Tactic.Omega')
          repl = {
            'structure C0 where r : Int; a : Bool; o : Int': 'structure C0 where\n  r : Int\n  a : Bool\n  o : Int',
            'structure C1 where x : Int; l : Int; a : Bool': 'structure C1 where\n  x : Int\n  l : Int\n  a : Bool',
            'structure C2 where a : Bool; w : Bool; y : Bool': 'structure C2 where\n  a : Bool\n  w : Bool\n  y : Bool',
            'structure C3 where s : Int; o : Int': 'structure C3 where\n  s : Int\n  o : Int',
            'structure C4 where x : Int; y : Int; ox : Int; oy : Int': 'structure C4 where\n  x : Int\n  y : Int\n  ox : Int\n  oy : Int',
            'structure C5 where n : Int; o : Int': 'structure C5 where\n  n : Int\n  o : Int',
            'cases a <;> simp [i0,s0] at hi ⊢ <;> omega': 'cases a <;> simp [d0,i0,s0] at hd hi ⊢ <;> omega',
            'simp [b5,s5] at hb ⊢\n    omega': 'simp [d5,b5,s5] at hd hb ⊢\n    omega',
          }
          for a,b in repl.items():
              assert a in s, a
              s = s.replace(a,b)
          p.write_text(s)
          PY
          sha256sum Defs.lean Challenge.lean Solution.lean Concrete.lean
          for V in v4.33.1 v4.34.0-rc2; do
            echo "leanprover/lean4:${V}" > lean-toolchain
            elan toolchain install "leanprover/lean4:${V}"
            rm -rf .lake lake-manifest.json
            lake build
            lake env lean Solution.lean
            lake env lean Concrete.lean
            cat > /tmp/axioms.lean <<'EOF'
          import Solution
          #print axioms P.q0
          #print axioms P.q1
          #print axioms P.q2
          #print axioms P.q3
          #print axioms P.q4
          #print axioms P.q5
          #print axioms P.q6
          #print axioms P.q7
          EOF
            lake env lean /tmp/axioms.lean
          done
          echo 'leanprover/lean4:v4.34.0-rc2' > lean-toolchain
  judge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: build-pinned-checkers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.34.0-rc2
          git clone -q https://github.com/leanprover/comparator.git /tmp/comparator
          git -C /tmp/comparator checkout -q 2312244ac716564a61cc0bf4e107d9abf1757a61
          (cd /tmp/comparator && lake build lean4export comparator)
          git clone -q https://github.com/ammkrn/nanoda_lib.git /tmp/nanoda
          git -C /tmp/nanoda checkout -q 4c544ed4099c8227f07d5de77ad1e69fb0740a27
          (cd /tmp/nanoda && cargo build --release --bin nanoda_bin)
          git clone -q https://github.com/Zouuup/landrun.git /tmp/landrun-src
          git -C /tmp/landrun-src checkout -q 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd /tmp/landrun-src && go build -o /tmp/landrun ./cmd/landrun/main.go)
      - name: comparator-plus-independent-kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd jobs/j-4b2c82ad
          echo 'leanprover/lean4:v4.34.0-rc2' > lean-toolchain
          rm -rf .lake lake-manifest.json
          COMPARATOR_LANDRUN=/tmp/landrun \
          COMPARATOR_LEAN4EXPORT=/tmp/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export \
          COMPARATOR_NANODA=/tmp/nanoda/target/release/nanoda_bin \
          lake env /tmp/comparator/.lake/build/bin/comparator comparator.json
