name: j-4b2c82ad
on:
  push:
    branches: ["exec/j-4b2c82ad"]
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: dual-version-kernel-build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd jobs/j-4b2c82ad
          python concrete_gate.py
          sha256sum Concrete.lean ConcreteNormalized.lean ConcreteDefs.lean ConcreteChallenge.lean ConcreteSolution.lean comparator_concrete.json concrete_gate_manifest.json
          for V in v4.33.1 v4.34.0-rc2; do
            echo "leanprover/lean4:${V}" > lean-toolchain
            elan toolchain install "leanprover/lean4:${V}"
            rm -rf .lake lake-manifest.json
            lake build
            lake env lean Solution.lean
            lake env lean ConcreteNormalized.lean
            lake env lean ConcreteSolution.lean
            cat > /tmp/axioms.lean <<'EOF'
          import Solution
          #print axioms P.q0
          #print axioms P.q1
          #print axioms P.q2
          #print axioms P.q3
          #print axioms P.q4
          #print axioms P.q5
          #print axioms P.q6
          #print axioms P.q7
          EOF
            lake env lean /tmp/axioms.lean
          done
          echo 'leanprover/lean4:v4.34.0-rc2' > lean-toolchain
  judge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: build-pinned-checkers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.34.0-rc2
          git clone -q https://github.com/leanprover/comparator.git /tmp/comparator
          git -C /tmp/comparator checkout -q 2312244ac716564a61cc0bf4e107d9abf1757a61
          (cd /tmp/comparator && lake build lean4export comparator)
          git clone -q https://github.com/ammkrn/nanoda_lib.git /tmp/nanoda
          git -C /tmp/nanoda checkout -q 4c544ed4099c8227f07d5de77ad1e69fb0740a27
          (cd /tmp/nanoda && cargo build --release --bin nanoda_bin)
          git clone -q https://github.com/Zouuup/landrun.git /tmp/landrun-src
          git -C /tmp/landrun-src checkout -q 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd /tmp/landrun-src && go build -o /tmp/landrun ./cmd/landrun/main.go)
          echo "COMPARATOR_COMMIT=$(git -C /tmp/comparator rev-parse HEAD)"
          echo "NANODA_COMMIT=$(git -C /tmp/nanoda rev-parse HEAD)"
          echo "LANDRUN_COMMIT=$(git -C /tmp/landrun-src rev-parse HEAD)"
      - name: abstract-and-concrete-comparator-plus-independent-kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd jobs/j-4b2c82ad
          python concrete_gate.py
          echo 'leanprover/lean4:v4.34.0-rc2' > lean-toolchain
          rm -rf .lake lake-manifest.json
          sha256sum Defs.lean Challenge.lean Solution.lean Concrete.lean ConcreteNormalized.lean ConcreteDefs.lean ConcreteChallenge.lean ConcreteSolution.lean comparator.json comparator_concrete.json concrete_gate_manifest.json concrete_gate.py
          export COMPARATOR_LANDRUN=/tmp/landrun
          export COMPARATOR_LEAN4EXPORT=/tmp/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          export COMPARATOR_NANODA=/tmp/nanoda/target/release/nanoda_bin
          echo '=== ABSTRACT STATEMENT-LOCK GATE ==='
          lake env /tmp/comparator/.lake/build/bin/comparator comparator.json
          rm -rf .lake lake-manifest.json
          echo '=== CONCRETE 36-THEOREM STATEMENT-LOCK GATE ==='
          lake env /tmp/comparator/.lake/build/bin/comparator comparator_concrete.json
