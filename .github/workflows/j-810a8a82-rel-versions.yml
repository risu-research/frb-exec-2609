name: j-810a8a82-rel-versions
on:
  push:
    branches: ["exec/j-810a8a82"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: generated-relational-semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd jobs/j-4b2c82ad
          test "$(sha256sum source_a05.json | cut -d' ' -f1)" = ab3b7afc2634bdd6f2939355e7d47e355ae2bd06a99bae84b00bf3b8a3746736
          python qualify_emitters.py
          cp source_a05.json /tmp/a05-mut.json
          printf ' ' >> /tmp/a05-mut.json
          ! python compile_py.py /tmp/a05-mut.json /tmp/a05-mut-out
          python translation_gate.py
          python relational_adapter.py
          python roundtrip_check.py source_a05.json typed_ir.json
          cmp pyout/typed_ir.json jsout/typed_ir.json
          cmp pyout/GeneratedBank.lean jsout/GeneratedBank.lean
          cmp pyout/manifest.json jsout/manifest.json
          for V in v4.33.1 v4.34.0-rc2; do
            echo "leanprover/lean4:${V}" > lean-toolchain
            elan toolchain install "leanprover/lean4:${V}"
            rm -rf .lake lake-manifest.json
            lake build
            lake env lean GeneratedSolution.lean
          done
